<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>앤니즈 · 인보이스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Inter:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#fff;--surface:#fff;--surface2:#F5F5F5;--border:rgba(0,0,0,0.08);--border-mid:rgba(0,0,0,0.14);--text:#1A1714;--text-2:#6B6560;--text-3:#A09A94;--danger:#BD090A;--success:#2B6CB8;}
body{font-family:'Noto Sans KR',sans-serif;background:#F5F5F5;color:var(--text);font-size:14px;}

  .layout{display:flex;min-height:100vh;}
  .sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;}
  .sidebar-logo{height:60px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid var(--border);box-sizing:border-box;}
  .sidebar-nav{flex:1;padding:16px 10px;}
  .nav-section-label{font-size:10px;font-weight:500;letter-spacing:0.1em;color:var(--text-3);text-transform:uppercase;padding:0 10px;margin-bottom:6px;}
  .nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;font-size:13px;color:var(--text-2);text-decoration:none;transition:all 0.15s;margin-bottom:2px;}
  .nav-item:hover{background:var(--surface2);color:var(--text);}
  .nav-item.active{background:var(--surface2);color:var(--text);font-weight:500;}
  .nav-disabled{opacity:0.4;pointer-events:none;}
  .sidebar-footer{padding:16px 20px;font-size:10px;letter-spacing:0.1em;color:var(--text-3);border-top:1px solid var(--border);}
  .page-content{margin-left:220px;flex:1;min-width:0;}
  .topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;}
  .topbar-title{font-size:13px;font-weight:500;color:var(--text);}
  @media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  html,body{width:210mm;margin:0;padding:0;background:#fff;}
  .sidebar,.topbar,.no-print{display:none!important;}
  .page-content{margin-left:0!important;}
  .editor-wrap{padding:0;margin:0;}
  .invoice-paper{box-shadow:none;border-radius:0;padding:14mm 16mm;width:210mm;margin:0;font-size:11px;}
  [contenteditable]:hover,[contenteditable]:focus{background:transparent!important;box-shadow:none!important;}
  .del-btn,.add-row-btn{display:none!important;}
  #sealContainer .no-print{display:none!important;}
  #sealContainer{cursor:default!important;}
  #toastMsg{display:none!important;}
  tr{page-break-inside:avoid;}
  .inv-signatures,.inv-bank,.inv-summary{page-break-inside:avoid;}
  .inv-parties{padding:14px 18px;margin-bottom:20px;}
  .inv-table th{padding:7px 8px;font-size:10px;}
  .inv-table td{padding:8px 8px;font-size:11px;}
  .inv-summary-box{width:220px;}
  .inv-bank{padding:12px 16px;margin-bottom:18px;}
  .inv-terms{margin-bottom:20px;}
  .inv-signatures{margin-top:24px;padding-top:18px;}
  #itemBody [id^=img-preview-]{width:40px!important;height:40px!important;}
  #itemBody img{max-width:40px!important;max-height:40px!important;}
  input,textarea,select{border:none!important;background:transparent!important;padding:0!important;}
}
@page{size:A4;margin:0;}
/* 에디터 영역 */
.editor-wrap{max-width:1200px;margin:0 auto;padding:24px 28px 64px;}
.editor-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.btn{font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;padding:8px 16px;border-radius:8px;border:1px solid var(--border-mid);background:#fff;color:var(--text-2);cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.btn:hover{background:var(--text);color:#fff;border-color:var(--text);}
.btn.primary{background:var(--text);color:#fff;border-color:var(--text);}
.btn.primary:hover{opacity:0.8;}
.lang-toggle{display:flex;gap:4px;}
.lang-btn{font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;padding:7px 14px;border-radius:8px;border:1px solid var(--border-mid);background:transparent;color:var(--text-2);cursor:pointer;transition:all 0.15s;}
.lang-btn.active{background:var(--text);color:#fff;border-color:var(--text);}
/* 인보이스 페이퍼 */
.invoice-paper{background:#fff;border-radius:12px;box-shadow:0 2px 20px rgba(0,0,0,0.08);padding:56px 64px;max-width:860px;margin:0 auto;position:relative;overflow:visible;}
/* 헤더 */
.inv-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:48px;}
.inv-logo{display:flex;align-items:center;}
@media(max-width:768px){
  .inv-logo img{height:20px!important;}
  .inv-title{font-size:16px!important;letter-spacing:0.12em!important;}
  .inv-header{margin-bottom:16px;}
}
.inv-meta{text-align:right;}
.inv-title{font-size:22px;font-weight:300;letter-spacing:0.25em;text-transform:uppercase;color:var(--text);margin-bottom:8px;font-family:'Cormorant Garamond',Georgia,serif;line-height:1;}
.inv-number{font-size:13px;color:var(--text-2);margin-bottom:4px;}
.inv-date{font-size:13px;color:var(--text-2);}
/* 주소 섹션 */
.inv-parties{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-bottom:40px;padding:28px;background:var(--surface2);border-radius:10px;}
.inv-party-label{font-size:10px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:10px;}
.inv-party-name{font-size:15px;font-weight:500;color:var(--text);margin-bottom:6px;}
.inv-party-detail{font-size:13px;color:var(--text-2);line-height:1.7;}
/* 품목 테이블 */
.inv-table{width:100%;border-collapse:collapse;margin-bottom:28px;}
.inv-table th{font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-3);padding:10px 14px;border-bottom:2px solid var(--text);text-align:left;}
.inv-table th.right{text-align:right;}
.inv-table td{padding:13px 14px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text);vertical-align:middle;}
.inv-table td.right{text-align:right;}
.inv-table tr:last-child td{border-bottom:none;}
.inv-table tr:hover td{background:var(--surface2);}
.add-row-btn{font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--text-3);background:none;border:1px dashed var(--border-mid);border-radius:6px;padding:8px 16px;cursor:pointer;width:100%;margin-bottom:28px;transition:all 0.15s;}
.add-row-btn:hover{border-color:var(--text);color:var(--text);}
/* 합계 */
.inv-summary{display:flex;justify-content:flex-end;margin-bottom:40px;}
.inv-summary-box{width:280px;}
.inv-summary-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px solid var(--border);}
.inv-summary-row:last-child{border-bottom:none;border-top:2px solid var(--text);padding-top:12px;font-size:15px;font-weight:500;}
/* 은행 정보 */
.inv-bank{background:var(--surface2);border-radius:10px;padding:20px 24px;margin-bottom:32px;}
.inv-bank-title{font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:12px;}
.inv-bank-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.inv-bank-item{font-size:13px;}
.inv-bank-label{color:var(--text-3);font-size:11px;margin-bottom:2px;}
.inv-bank-value{color:var(--text);font-weight:500;}
/* 결제조건 & 비고 */
.inv-terms{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:40px;}
.inv-section-title{font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;}
/* 서명란 */
.inv-signatures{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:48px;padding-top:32px;border-top:1px solid var(--border);overflow:visible;}
.inv-sig-box{}
.inv-sig-label{font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:40px;}
.inv-sig-line{border-bottom:1px solid var(--text);margin-bottom:6px;}
.inv-sig-name{font-size:12px;color:var(--text-3);}
/* 편집 가능 */
[contenteditable]{outline:none;}
[contenteditable]:hover{background:rgba(43,108,184,0.05);border-radius:4px;}
[contenteditable]:focus{background:rgba(43,108,184,0.08);border-radius:4px;box-shadow:0 0 0 2px rgba(43,108,184,0.2);}
.del-btn{background:none;border:none;cursor:pointer;color:#ccc;font-size:14px;padding:0 4px;}
.del-btn:hover{color:var(--danger);}
/* 프린트 */
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body{background:#fff;}
  .editor-toolbar,.no-print{display:none!important;}
  .editor-wrap{padding:0;}
  .invoice-paper{box-shadow:none;border-radius:0;padding:40px 48px;}
  [contenteditable]:hover,[contenteditable]:focus{background:transparent;box-shadow:none;}
  .del-btn,.add-row-btn{display:none!important;}
  #sealContainer .no-print{display:none!important;}
  #sealContainer{cursor:default!important;}
  #toastMsg{display:none!important;}
  #img-preview-0,#img-preview-1,[id^=img-preview-]{cursor:default!important;}
}
input[type=text],textarea{font-family:inherit;font-size:inherit;border:none;background:transparent;width:100%;outline:none;resize:none;color:inherit;}
input[type=text]:hover,textarea:hover{background:rgba(43,108,184,0.05);border-radius:4px;}
input[type=text]:focus,textarea:focus{background:rgba(43,108,184,0.08);border-radius:4px;}
select{font-family:inherit;font-size:12px;border:1px solid var(--border-mid);border-radius:6px;padding:6px 10px;background:#fff;color:var(--text-2);outline:none;cursor:pointer;}



/* 모바일 메뉴 */
.mobile-header{display:none;}
.mobile-menu-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:150;}
.mobile-menu-overlay.open{display:block;}
.mobile-menu-panel{position:fixed;top:0;left:0;bottom:0;width:240px;background:#fff;z-index:200;padding:20px 16px;transform:translateX(-100%);transition:transform 0.25s;}
.mobile-menu-panel.open{transform:translateX(0);}
.mobile-menu-logo{height:40px;display:flex;align-items:center;margin-bottom:24px;}
.mobile-menu-item{display:flex;align-items:center;gap:10px;padding:12px 10px;border-radius:8px;font-size:14px;color:#6B6560;text-decoration:none;margin-bottom:4px;}
.mobile-menu-item.active{background:#F5F5F5;color:#1A1714;font-weight:500;}
.mobile-menu-item-disabled{opacity:0.4;pointer-events:none;}

@media(max-width:768px){
  .sidebar{display:none!important;}
  .page-content{margin-left:0!important;}
  .topbar{padding:0 16px;position:sticky;top:0;z-index:50;}
  .mobile-header{display:flex;align-items:center;gap:12px;}
  main{padding:16px 12px 40px;}
  .metrics{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .metric-card{padding:14px 12px;}
  .metric-value{font-size:15px;}
  .chart-card{padding:16px 12px;margin-bottom:16px;}
  .platforms{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .plat-card{padding:12px 10px;}
  .plat-val{font-size:13px;}
  .table-card{overflow-x:auto;}
  table{font-size:12px;}
  thead th{padding:8px 8px;font-size:10px;}
  tbody td{padding:8px 8px;}
  .sec-head{margin-bottom:10px;}
  .input-card{padding:16px 12px;}
  .form-grid{grid-template-columns:1fr 1fr;gap:8px;}
  .cal-cell{min-height:52px;padding:4px;}
  .cal-sales{font-size:10px;}
  .cal-net{font-size:9px;}
  .wh-stock{font-size:10px;padding:2px 5px;}
  .badge{font-size:10px;padding:2px 6px;}
  .toolbar{flex-wrap:wrap;gap:6px;}
  .search-input{width:100%;}
  .modal{padding:20px 16px;margin:12px;}
  .inv-parties{grid-template-columns:1fr;gap:16px;padding:16px;}
  .inv-bank-grid{grid-template-columns:1fr;}
  .inv-terms{grid-template-columns:1fr;gap:16px;}
  .inv-signatures{grid-template-columns:1fr;gap:20px;}
  .invoice-paper{padding:28px 18px;}
  .editor-wrap{padding:12px 10px 40px;}
  .editor-toolbar{flex-wrap:wrap;gap:6px;}
  .btn{font-size:11px;padding:6px 10px;}
  .lang-btn{font-size:11px;padding:5px 8px;}
  .topbar-title{display:none;}
}
.inv-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}

<style id="navcolor-v1">

let rowCount = 0;

function setLang(l, btn) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const lb = labels[l];
  const ids = {'topbarTitle':lb.topbar,'invTitle':lb.title,'lbl-no':lb.no,'lbl-date':lb.date,'lbl-due':lb.due,
    'lbl-from':lb.from,'lbl-to':lb.to,'th-desc':lb.desc,'th-qty':lb.qty,'th-price':lb.price,
    'th-discount':lb.discount,'th-discprice':lb.discprice,'th-total':lb.total,'th-vat':lb.vat,
    'lbl-subtotal':lb.subtotal,'lbl-vat':lb.vatLbl,'lbl-grand':lb.grand,
    'lbl-bank':lb.bank,'lbl-bankname':lb.bankname,'lbl-account':lb.account,
    'lbl-holder':lb.holder,'lbl-swift':lb.swift,'lbl-terms':lb.terms,'lbl-notes':lb.notes,
    'lbl-sig1':lb.sig1,'lbl-sig2':lb.sig2,'addRowBtn':lb.addRow};
  Object.entries(ids).forEach(([id,val])=>{ const el=document.getElementById(id); if(el) el.textContent=val; });
  calcTotals();
}

function addRow(desc='', qty=1, price=0, vatRate=10, imgUrl='', discount=0) {
  const id = rowCount++;
  const lb = labels[lang];
  const tr = document.createElement('tr');
  tr.id = 'row-'+id;
  const imgHtml = imgUrl ? `<img src="${imgUrl}" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.innerHTML='사진'">` : '사진';
  tr.innerHTML = `
    <td style="text-align:center;padding:4px;">
      <div id="img-preview-${id}" style="width:52px;height:52px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-3);cursor:pointer;overflow:hidden;margin:0 auto;" onclick="editImg(${id})" title="클릭해서 이미지 추가">
        ${imgHtml}
      </div>
      <input type="hidden" id="img-url-${id}" value="${imgUrl}">
    </td>
    <td><input type="text" placeholder="${lb.desc}" value="${desc}" oninput="calcTotals()" style="width:100%;min-width:0;"></td>
    <td class="right"><input type="number" value="${qty}" min="1" oninput="calcTotals()" style="width:50px;text-align:right;"></td>
    <td class="right"><input type="number" value="${price}" min="0" oninput="calcTotals()" style="width:80px;text-align:right;"></td>
    <td class="right"><div style="display:flex;align-items:center;justify-content:flex-end;gap:2px;"><input type="number" id="disc-${id}" value="${discount}" min="0" max="100" oninput="calcTotals()" style="width:44px;text-align:right;font-size:12px;padding:4px 6px;"><span style="font-size:11px;color:var(--text-3);">%</span></div></td>
    <td class="right" id="row-discprice-${id}" style="color:var(--success);font-size:12px;">-</td>
    <td class="right" id="row-total-${id}">0</td>
    <td class="right"><select onchange="calcTotals()" style="width:52px;font-size:12px;"><option value="10"${vatRate==10?' selected':''}>10%</option><option value="0"${vatRate==0?' selected':''}>없음</option></select></td>
    <td><button class="del-btn no-print" onclick="delRow(${id})">✕</button></td>`;
  document.getElementById('itemBody').appendChild(tr);
  calcTotals();
}

function editImg(id) {
  const cur = document.getElementById('img-url-'+id).value;
  const url = prompt('이미지 URL을 입력하세요:', cur);
  if(url === null) return;
  document.getElementById('img-url-'+id).value = url;
  const preview = document.getElementById('img-preview-'+id);
  if(url.trim()) {
    preview.innerHTML = `<img src="${url.trim()}" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.innerHTML='오류'">`;
  } else { preview.innerHTML = '사진'; }
}

function delRow(id) {
  const tr = document.getElementById('row-'+id);
  if(tr) tr.remove();
  calcTotals();
}

function fmt(n) { return labels[lang].currency + Math.round(n).toLocaleString(); }

function calcTotals() {
  let subtotal=0, vatTotal=0;
  document.querySelectorAll('#itemBody tr').forEach(tr => {
    const inputs = tr.querySelectorAll('input[type=number]');
    const vatSel = tr.querySelector('select');
    if(!inputs.length) return;
    const qty = parseFloat(inputs[0].value)||0;
    const price = parseFloat(inputs[1].value)||0;
    const discInput = tr.querySelector('input[id^="disc-"]');
    const discount = discInput ? parseFloat(discInput.value)||0 : 0;
    const vatRate = vatSel ? parseFloat(vatSel.value)||0 : 10;
    const discPrice = price * (1 - discount/100);
    const lineTotal = qty * discPrice;
    const lineVat = lineTotal * vatRate / 100;
    const id = tr.id.replace('row-','');
    const totalEl = document.getElementById('row-total-'+id);
    const discEl = document.getElementById('row-discprice-'+id);
    if(totalEl) totalEl.textContent = fmt(lineTotal);
    if(discEl) discEl.textContent = discount > 0 ? fmt(discPrice) : '-';
    subtotal += lineTotal;
    vatTotal += lineVat;
  });
  document.getElementById('subtotal').textContent = fmt(subtotal);
  document.getElementById('vatTotal').textContent = fmt(vatTotal);
  document.getElementById('grandTotal').textContent = fmt(subtotal + vatTotal);
}

function setView(v,btn) {
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
}

function resetInvoice() {
  if(!confirm('인보이스를 초기화할까요?')) return;
  document.getElementById('itemBody').innerHTML = '';
  rowCount = 0;
  document.getElementById('to-name').value = '';
  document.getElementById('to-detail').value = '';
  document.getElementById('terms-text').value = '';
  document.getElementById('notes-text').value = '';
  setInvoiceNumber();
  calcTotals();
  addRow(); addRow();
}

function setInvoiceNumber() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,'0');
  document.getElementById('inv-number').value = `INV-${y}${m}-001`;
  document.getElementById('inv-date').value = now.toISOString().slice(0,10);
  const due = new Date(now); due.setDate(due.getDate()+30);
  document.getElementById('inv-due').value = due.toISOString().slice(0,10);
}

// 도장 드래그
(function() {
  function initDrag() {
    const el = document.getElementById('sealContainer');
    if(!el) return;
    let isDragging = false, startX, startY, startLeft, startTop;
    el.addEventListener('mousedown', e => {
      if(e.target.tagName === 'BUTTON') return;
      isDragging = true;
      startX = e.clientX; startY = e.clientY;
      startLeft = parseInt(el.style.left)||0;
      startTop = parseInt(el.style.top)||24;
      el.style.opacity = '0.75';
      e.preventDefault();
    });
    document.addEventListener('mousemove', e => {
      if(!isDragging) return;
      el.style.left = (startLeft + e.clientX - startX) + 'px';
      el.style.top = (startTop + e.clientY - startY) + 'px';
    });
    document.addEventListener('mouseup', () => { if(!isDragging) return; isDragging=false; el.style.opacity='0.9'; });
    el.addEventListener('touchstart', e => {
      if(e.target.tagName==='BUTTON') return;
      const t=e.touches[0]; isDragging=true;
      startX=t.clientX; startY=t.clientY;
      startLeft=parseInt(el.style.left)||0; startTop=parseInt(el.style.top)||24;
      e.preventDefault();
    }, {passive:false});
    document.addEventListener('touchmove', e => {
      if(!isDragging) return;
      const t=e.touches[0];
      el.style.left=(startLeft+t.clientX-startX)+'px';
      el.style.top=(startTop+t.clientY-startY)+'px';
    });
    document.addEventListener('touchend', ()=>{ isDragging=false; });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', initDrag);
  else initDrag();
})();

// 도장 크기 조절
let sealSize = 80;
function resizeSeal(delta) {
  sealSize = Math.max(40, Math.min(200, sealSize + delta));
  document.getElementById('sealImg').style.height = sealSize + 'px';
  document.getElementById('sealImg').style.width = sealSize + 'px';
}

function collectInvoiceData() {
  const rows = [];
  document.querySelectorAll('#itemBody tr').forEach(tr => {
    const inputs = tr.querySelectorAll('input[type=number]');
    const textInput = tr.querySelector('input[type=text]');
    const vatSel = tr.querySelector('select');
    const imgUrl = tr.querySelector('input[type=hidden]');
    const discInput = tr.querySelector('input[id^="disc-"]');
    if(!inputs.length) return;
    rows.push({
      desc: textInput?.value||'',
      qty: parseFloat(inputs[0].value)||0,
      price: parseFloat(inputs[1].value)||0,
      discount: parseFloat(discInput?.value)||0,
      vatRate: vatSel?parseFloat(vatSel.value)||0:10,
      imgUrl: imgUrl?.value||''
    });
  });
  const seal = document.getElementById('sealContainer');
  return {
    invoiceNumber: document.getElementById('inv-number').value,
    date: document.getElementById('inv-date').value,
    due: document.getElementById('inv-due').value,
    fromName: document.getElementById('from-name').value,
    fromDetail: document.getElementById('from-detail').value,
    toName: document.getElementById('to-name').value,
    toDetail: document.getElementById('to-detail').value,
    bankName: document.getElementById('bank-name').value,
    bankAccount: document.getElementById('bank-account').value,
    bankHolder: document.getElementById('bank-holder').value,
    bankSwift: document.getElementById('bank-swift').value,
    terms: document.getElementById('terms-text').value,
    notes: document.getElementById('notes-text').value,
    rows, lang,
    sealLeft: seal ? seal.style.left : '0px',
    sealTop: seal ? seal.style.top : '24px',
    sealSize: sealSize
  };
}

async function saveInvoice() {
  const data = collectInvoiceData();
  const grandText = document.getElementById('grandTotal').textContent.replace(/[^0-9]/g,'');
  const total = parseInt(grandText)||0;
  try {
    await sb('invoices', {method:'POST', body:JSON.stringify({
      invoice_number: data.invoiceNumber,
      client_name: data.toName||'미입력',
      issue_date: data.date,
      total_amount: total,
      status: '미수금',
      data: data
    })});
    showToast('저장되었습니다 ✓');
  } catch(e) { showToast('저장 실패: '+e.message); }
}

async function openLoadModal() {
  const modal = document.getElementById('loadModal');
  modal.style.display = 'flex';
  const listEl = document.getElementById('savedList');
  listEl.innerHTML = '<div style="text-align:center;padding:20px;color:#A09A94;font-size:13px;">불러오는 중...</div>';
  try {
    const list = await sb('invoices?select=*&order=created_at.desc&limit=30') || [];
    if(!list.length) {
      listEl.innerHTML = '<div style="text-align:center;padding:20px;color:#A09A94;font-size:13px;">저장된 인보이스가 없습니다</div>';
      return;
    }
    listEl.innerHTML = list.map(inv => {
      const isPaid = inv.status === '입금완료';
      const statusColor = isPaid ? '#2B6CB8' : '#BD090A';
      const statusBg = isPaid ? '#EBF2FB' : '#FDF0ED';
      return `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(0,0,0,0.08);">
        <div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="font-weight:500;font-size:13px;">${inv.invoice_number} · ${inv.client_name}</span>
            <span style="font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;background:${statusBg};color:${statusColor};">${inv.status||'미수금'}</span>
          </div>
          <div style="font-size:12px;color:#A09A94;margin-top:3px;">${inv.issue_date} · ₩${(inv.total_amount||0).toLocaleString()}</div>
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
          <button onclick="toggleStatus(${inv.id},'${inv.status||'미수금'}')" style="font-family:'Noto Sans KR',sans-serif;font-size:11px;padding:5px 10px;border-radius:7px;border:1px solid ${statusColor};background:${statusBg};color:${statusColor};cursor:pointer;">${isPaid?'↩ 미수금':'✓ 입금완료'}</button>
          <button onclick="loadSaved(${inv.id})" style="font-family:'Noto Sans KR',sans-serif;font-size:12px;padding:6px 14px;border-radius:7px;border:1px solid rgba(0,0,0,0.14);background:#fff;cursor:pointer;">불러오기</button>
          <button onclick="deleteSaved(${inv.id})" style="font-family:'Noto Sans KR',sans-serif;font-size:12px;padding:6px 10px;border-radius:7px;border:1px solid rgba(140,58,42,0.3);background:#fff;color:#BD090A;cursor:pointer;">삭제</button>
        </div>
      </div>`;
    }).join('');
  } catch(e) { listEl.innerHTML = '<div style="color:#BD090A;font-size:13px;">불러오기 실패</div>'; }
}

async function toggleStatus(id, currentStatus) {
  const newStatus = currentStatus === '입금완료' ? '미수금' : '입금완료';
  try {
    await sb('invoices?id=eq.'+id, {method:'PATCH', body:JSON.stringify({status: newStatus})});
    openLoadModal();
  } catch(e) { showToast('상태 변경 실패'); }
}

async function loadSaved(id) {
  try {
    const list = await sb('invoices?id=eq.'+id) || [];
    if(!list.length) return;
    loadInvoiceData(list[0].data);
    closeLoadModal();
    showToast('불러왔습니다 ✓');
  } catch(e) { showToast('실패: '+e.message); }
}

async function deleteSaved(id) {
  if(!confirm('이 인보이스를 삭제할까요?')) return;
  try {
    await sb('invoices?id=eq.'+id, {method:'DELETE'});
    openLoadModal();
    showToast('삭제되었습니다');
  } catch(e) { showToast('삭제 실패'); }
}

function closeLoadModal() { document.getElementById('loadModal').style.display='none'; }

function printInvoice() { window.print(); }

function showToast(msg) {
  const t = document.getElementById('toastMsg');
  t.textContent = msg;
  t.style.transform = 'translateX(-50%) translateY(0)';
  setTimeout(()=>t.style.transform='translateX(-50%) translateY(80px)', 2500);
}

setInvoiceNumber();
addRow(); addRow();
calcTotals();
</script>
