<meta charset="UTF-8">

<title>업무 캘린더 (app)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1A1714;--mut:#6B6560;--mut2:#A09A94;--line:rgba(0,0,0,0.10);--bg:#FFFFFF;--card:#F6F5F3;--hover:#F0EEEA;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:"Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:13px;}
.pl{display:grid;grid-template-columns:236px 1fr;height:100vh;overflow:hidden;}
.pl.detail-open{grid-template-columns:236px 1fr 340px;}
/* ===== 사이드바 ===== */
.side{border-right:1px solid var(--line);padding:16px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
.side::-webkit-scrollbar{width:6px;} .side::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:3px;}
.search{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:8px 11px;margin-bottom:12px;color:var(--mut2);}
.search input{border:none;outline:none;background:none;font-family:inherit;font-size:12.5px;flex:1;color:var(--ink);}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink);}
.nav-item:hover{background:var(--hover);}
.nav-item.on{background:var(--card);font-weight:600;}
.nav-item .ic{width:16px;text-align:center;color:var(--mut);font-size:13px;}
.nav-item .cnt{margin-left:auto;font-size:11px;color:var(--mut2);}
.grp{font-size:10.5px;letter-spacing:.14em;color:var(--mut2);font-weight:600;padding:16px 10px 6px;}
.cat-item,.proj-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--ink);}
.cat-item:hover,.proj-item:hover{background:var(--hover);}
.cat-item.on,.proj-item.on{background:var(--card);font-weight:600;}
.dot{width:9px;height:9px;border-radius:50%;flex:none;}
.cat-item .cnt{margin-left:auto;font-size:11px;color:var(--mut2);}
.add-proj{color:var(--mut2);font-size:12px;padding:8px 10px;cursor:pointer;border-radius:8px;}
.add-proj:hover{background:var(--hover);color:var(--ink);}
.proj-item{justify-content:space-between;}
.proj-item .pname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.proj-acts{display:flex;gap:1px;opacity:0;flex:none;}
.proj-item:hover .proj-acts{opacity:1;}
.pa{border:none;background:none;cursor:pointer;color:var(--mut2);font-size:12px;padding:3px 5px;border-radius:5px;line-height:1;font-family:inherit;}
.pa:hover{background:var(--hover);color:var(--ink);}
.pa.del:hover{color:#B04A3C;}
.proj-item.dragging{opacity:.4;}
.proj-item.drop-above{box-shadow:inset 0 2px 0 0 var(--ink);}
.proj-item.drop-below{box-shadow:inset 0 -2px 0 0 var(--ink);}
.side-div{height:1px;background:var(--line);margin:12px 4px;}
/* ===== 메인 ===== */
.main{display:flex;flex-direction:column;overflow:hidden;}
.top{display:flex;align-items:center;gap:14px;padding:14px 22px;flex-wrap:wrap;}
.mtitle{font-size:19px;font-weight:700;letter-spacing:-.01em;min-width:130px;}
.navbtn{border:1px solid var(--line);background:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;color:var(--mut);font-size:14px;}
.navbtn:hover{border-color:var(--mut2);}
.today-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);}
.today-btn:hover{border-color:var(--mut2);}
.seg{display:inline-flex;background:var(--card);border-radius:9px;padding:3px;gap:2px;}
.seg button{border:none;background:none;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--mut);padding:6px 13px;border-radius:7px;cursor:pointer;}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.09);}
.qfilter{display:flex;gap:4px;margin-left:auto;}
.qf{border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 13px;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;}
.qf.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.canvas{flex:1;overflow-y:auto;}
/* 월 뷰 */
.mgrid{display:flex;flex-direction:column;height:100%;}
.wk-head{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);}
.wk-head div{padding:9px 10px;font-size:11px;font-weight:600;color:var(--mut2);text-align:left;}
.wk-head div.sun{color:#B0796F;} .wk-head div.sat{color:#6E7BA1;}
.mrows{flex:1;display:grid;grid-auto-rows:1fr;}
.mrow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);}
.mcell{border-right:1px solid var(--line);padding:6px 6px 4px;min-height:96px;cursor:pointer;position:relative;overflow:hidden;}
.mcell:last-child{border-right:none;}
.mcell:hover{background:#FBFAF9;}
.mcell.dragover{background:#EEF3F0;box-shadow:inset 0 0 0 2px #5E8B7E;}
.mcell.other{background:#FCFCFB;} .mcell.other .dnum{color:var(--mut2);opacity:.55;}
.dnum{font-size:12px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:50%;}
.mcell.today .dnum{background:var(--ink);color:#fff;}
.ev{display:flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 6px;border-radius:5px;margin-top:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--card);}
.ev .ebar{width:3px;align-self:stretch;border-radius:2px;flex:none;}
.ev .etime{color:var(--mut2);font-size:10px;}
.ev.done{opacity:.5;text-decoration:line-through;}
.ev-more{font-size:10.5px;color:var(--mut2);padding:2px 6px;cursor:pointer;}
/* 주 뷰 (컬럼 리스트) */
.wgrid{display:grid;grid-template-columns:repeat(7,1fr);height:100%;}
.wcol{border-right:1px solid var(--line);overflow-y:auto;padding:8px;}
.wcol:last-child{border-right:none;}
.wcol-h{font-size:12px;font-weight:600;margin-bottom:8px;color:var(--mut);}
.wcol-h .wd{font-size:18px;color:var(--ink);}
.wcol.today .wcol-h .wd{color:#fff;background:var(--ink);border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;}
.wev{border:1px solid var(--line);border-left-width:3px;border-radius:6px;padding:7px 9px;margin-bottom:7px;cursor:pointer;font-size:12px;}
.wev .wt{color:var(--mut2);font-size:10.5px;}
/* 아젠다 */
.agenda{padding:14px 22px;}
.ag-day{margin-bottom:6px;}
.ag-date{font-size:12px;font-weight:700;color:var(--mut);padding:14px 0 8px;border-bottom:1px solid var(--line);margin-bottom:8px;}
.ag-date .rel{color:var(--mut2);font-weight:400;margin-left:8px;}
.ag-ev{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;cursor:pointer;}
.ag-ev:hover{background:var(--hover);}
.ag-ev .abar{width:3px;height:26px;border-radius:2px;flex:none;}
.ag-ev .atime{font-size:11px;color:var(--mut2);width:88px;flex:none;}
.ag-ev .atitle{font-size:13px;}
.ag-ev.done .atitle{text-decoration:line-through;color:var(--mut2);}
.ag-empty{color:var(--mut2);padding:40px;text-align:center;}
/* 받은 작업함 */
.inbox{padding:18px 22px;max-width:640px;}
.inbox-h{font-size:15px;font-weight:700;margin-bottom:4px;}
.inbox-sub{font-size:12px;color:var(--mut2);margin-bottom:16px;}
.task{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:8px;cursor:grab;background:#fff;}
.task:hover{border-color:var(--mut2);}
.task .tcheck{width:17px;height:17px;border:1.5px solid var(--mut2);border-radius:5px;flex:none;cursor:pointer;}
.task .tbar{width:3px;height:22px;border-radius:2px;flex:none;}
.task .ttitle{font-size:13px;flex:1;}
.task .tcat{font-size:11px;color:var(--mut2);}
.task-add{display:flex;gap:8px;margin-bottom:14px;}
.task-add input{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:inherit;font-size:13px;outline:none;}
.task-add input:focus{border-color:var(--ink);}
.task-add button{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:0 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.inbox-hint{font-size:11.5px;color:var(--mut2);margin-top:10px;}
/* ===== 상세 패널 ===== */
.detail{border-left:1px solid var(--line);overflow-y:auto;padding:20px;display:none;}
.pl.detail-open .detail{display:block;}
.d-top{display:flex;justify-content:flex-end;gap:6px;margin-bottom:6px;}
.d-x,.d-del{border:none;background:none;cursor:pointer;color:var(--mut2);font-size:13px;padding:4px 6px;border-radius:6px;}
.d-x:hover{background:var(--hover);color:var(--ink);} .d-del:hover{color:#B04A3C;}
.d-title{width:100%;border:none;outline:none;font-family:inherit;font-size:17px;font-weight:700;color:var(--ink);margin-bottom:6px;line-height:1.4;resize:none;}
.d-done{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);cursor:pointer;margin-bottom:16px;}
.d-done input{width:16px;height:16px;}
.d-field{margin-bottom:14px;}
.d-label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);margin-bottom:6px;}
.d-field input,.d-field select,.d-field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13px;outline:none;color:var(--ink);background:#fff;}
.d-field input:focus,.d-field textarea:focus,.d-field select:focus{border-color:var(--ink);}
.d-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.d-row3{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.prio{display:flex;gap:6px;}
.prio button{flex:1;border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 0;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--mut);font-family:inherit;}
.prio button.on[data-p=high]{background:#FBECEA;border-color:#D9A99F;color:#B04A3C;}
.prio button.on[data-p=mid]{background:#FBF4E6;border-color:#D9C48F;color:#9A7B2E;}
.prio button.on[data-p=low]{background:#EEF1F5;border-color:#A9B6C9;color:#5E6E8A;}
.chk{display:flex;align-items:center;gap:8px;padding:5px 0;}
.chk .cb{width:16px;height:16px;border:1.5px solid var(--mut2);border-radius:4px;flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;}
.chk .cb.on{background:var(--ink);border-color:var(--ink);}
.chk input.ct{flex:1;border:none;outline:none;font-family:inherit;font-size:12.5px;background:none;color:var(--ink);}
.chk.done input.ct{text-decoration:line-through;color:var(--mut2);}
.chk .cx{color:var(--mut2);cursor:pointer;font-size:12px;opacity:0;}
.chk:hover .cx{opacity:1;}
.chk-add{color:var(--mut2);font-size:12px;cursor:pointer;padding:6px 0;}
.chk-add:hover{color:var(--ink);}
/* 미배정 업무 독 */
.dock{border-top:1px solid var(--line);background:var(--card);flex:none;display:none;flex-direction:column;}
.dock.show{display:flex;}
.dock-h{display:flex;align-items:center;gap:8px;padding:9px 20px 7px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mut);cursor:pointer;}
.dock-h .cnt{color:#fff;background:var(--mut2);border-radius:10px;padding:1px 7px;font-size:10px;}
.dock-h .tg{margin-left:auto;color:var(--mut2);font-weight:500;}
.dock-body{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 12px;}
.dock.collapsed .dock-body{display:none;}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;font-size:12px;cursor:grab;white-space:nowrap;flex:none;}
.chip:hover{border-color:var(--mut2);}
.chip:active{cursor:grabbing;}
.chip .cbar{width:3px;height:15px;border-radius:2px;flex:none;}
.dock-empty{font-size:11.5px;color:var(--mut2);padding:2px 0 4px;}
.drag-ghost{position:fixed;z-index:400;background:var(--ink);color:#fff;font-size:12px;padding:6px 11px;border-radius:8px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.22);max-width:220px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:9px;font-size:12.5px;opacity:0;transition:.3s;z-index:300;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media(max-width:900px){.pl{grid-template-columns:1fr;} .side{display:none;} .pl.detail-open{grid-template-columns:1fr;}}
</style>

  var WD=["일","월","화","수","목","금","토"];
  function renderMonth(){
    var first=new Date(curYear,curMonth,1);
    var startDow=first.getDay();
    var gridStart=new Date(curYear,curMonth,1-startDow);
    var todayStr=ymd(new Date());
    var html='<div class="mgrid"><div class="wk-head">'+WD.map(function(w,i){return '<div class="'+(i===0?"sun":i===6?"sat":"")+'">'+w+'</div>';}).join("")+'</div><div class="mrows">';
    for(var r=0;r<6;r++){
      html+='<div class="mrow">';
      for(var c=0;c<7;c++){
        var d=new Date(gridStart); d.setDate(gridStart.getDate()+r*7+c);
        var ds=ymd(d), other=d.getMonth()!==curMonth, isToday=ds===todayStr;
        var dayEvs=events().filter(function(e){return e.date===ds&&visible(e);}).sort(function(a,b){return (a.start||"99")>(b.start||"99")?1:-1;});
        html+='<div class="mcell'+(other?" other":"")+(isToday?" today":"")+'" data-date="'+ds+'">';
        html+='<span class="dnum">'+d.getDate()+'</span>';

          html+='<div class="ev'+(e.done?" done":"")+'" data-id="'+e.id+'"><span class="ebar" style="background:'+catColor(e.cat)+'"></span>'+(e.start?'<span class="etime">'+e.start+'</span>':'')+'<span>'+esc(e.title)+'</span></div>';
        });
        if(dayEvs.length>3)html+='<div class="ev-more" data-date="'+ds+'">+'+(dayEvs.length-3)+' 더보기</div>';
        html+='</div>';
      }
      html+='</div>';
    }

  function renderWeek(){
    var base=new Date(curYear,curMonth,cur.getDate?cur.getDate():1);

    for(var i=0;i<7;i++){
      var d=new Date(sunday); d.setDate(sunday.getDate()+i); var ds=ymd(d);

  var _weekRef=new Date();
  function renderAgenda(list,emptyMsg){
    if(!list.length)return '<div class="ag-empty">'+esc(emptyMsg||"일정이 없어요.")+'</div>';
    var byDate={}; list.forEach(function(e){(byDate[e.date]=byDate[e.date]||[]).push(e);});

    var todayStr=ymd(new Date());
    var html='<div class="agenda">';
    dates.forEach(function(ds){
      var d=parseYmd(ds), rel="";
      if(ds===todayStr)rel="오늘"; else{var diff=Math.round((d-parseYmd(todayStr))/86400000); if(diff===1)rel="내일"; else if(diff>0)rel=diff+"일 후"; else if(diff<0)rel=(-diff)+"일 전";}
      html+='<div class="ag-day"><div class="ag-date">'+(d.getMonth()+1)+"월 "+d.getDate()+"일 "+WD[d.getDay()]+'요일<span class="rel">'+rel+'</span></div>';
      byDate[ds].sort(function(a,b){return (a.start||"00")>(b.start||"00")?1:-1;}).forEach(function(e){
        html+='<div class="ag-ev'+(e.done?" done":"")+'" data-id="'+e.id+'"><span class="abar" style="background:'+catColor(e.cat)+'"></span><span class="atime">'+(e.start?e.start+(e.end?"–"+e.end:""):"종일")+'</span><span class="atitle">'+esc(e.title)+(e.project?' · <span style="color:var(--mut2)">'+esc(e.project)+'</span>':'')+'</span></div>';
      });

    });
    return html+'</div>';

  function closeDetail(){ selId=null; document.getElementById("pl").classList.remove("detail-open"); }

  /* 포인터 기반 드래그: ① 미배정 업무 → 캘린더 날짜  ② 프로젝트 순서 변경 */
  var pDrag=null, ghost=null, projDrag=null, justDragged=false;
  function clearOver(){[].forEach.call(document.querySelectorAll(".dragover"),function(c){c.classList.remove("dragover");});}
  function clearProjMark(){[].forEach.call(document.querySelectorAll(".proj-item"),function(c){c.classList.remove("drop-above","drop-below","dragging");});}
  document.addEventListener("mousedown",function(e){
    justDragged=false;
    var pit=e.target.closest(".proj-item");
    if(pit && !e.target.closest(".pa")){ projDrag={from:+pit.getAttribute("data-pi"),sx:e.clientX,sy:e.clientY,started:false}; return; }
    var chip=e.target.closest(".chip,.task"); if(chip){ pDrag={id:chip.getAttribute("data-id"),sx:e.clientX,sy:e.clientY,started:false,label:chip.textContent.trim()}; }
  });
  document.addEventListener("mousemove",function(e){
    if(projDrag){
      if(!projDrag.started){ if(Math.abs(e.clientX-projDrag.sx)+Math.abs(e.clientY-projDrag.sy)<5)return; projDrag.started=true; document.body.style.userSelect="none"; var dr=document.querySelector('.proj-item[data-pi="'+projDrag.from+'"]'); if(dr)dr.classList.add("dragging"); }
      clearProjMark(); var dr2=document.querySelector('.proj-item[data-pi="'+projDrag.from+'"]'); if(dr2)dr2.classList.add("dragging");
      var el=document.elementFromPoint(e.clientX,e.clientY); var over=el&&el.closest(".proj-item");
      if(over && +over.getAttribute("data-pi")!==projDrag.from){ var r=over.getBoundingClientRect(); over.classList.add(e.clientY>r.top+r.height/2?"drop-below":"drop-above"); }
      return;
    }
    if(!pDrag)return;
    if(!pDrag.started){ if(Math.abs(e.clientX-pDrag.sx)+Math.abs(e.clientY-pDrag.sy)<5)return; pDrag.started=true; ghost=document.createElement("div"); ghost.className="drag-ghost"; ghost.textContent=pDrag.label; document.body.appendChild(ghost); document.body.style.userSelect="none"; }
    ghost.style.left=(e.clientX+10)+"px"; ghost.style.top=(e.clientY+10)+"px";
    clearOver(); var el2=document.elementFromPoint(e.clientX,e.clientY); var cell=el2&&el2.closest(".mcell,.wcol"); if(cell)cell.classList.add("dragover");
  });
  document.addEventListener("mouseup",function(e){
    if(projDrag){
      if(projDrag.started){
        var el=document.elementFromPoint(e.clientX,e.clientY); var over=el&&el.closest(".proj-item");
        if(over){ var oi=+over.getAttribute("data-pi"); if(oi!==projDrag.from){ var r=over.getBoundingClientRect(); reorderProj(projDrag.from, oi, e.clientY>r.top+r.height/2); } }
        document.body.style.userSelect=""; clearProjMark(); justDragged=true;
      }
      projDrag=null; return;
    }
    if(!pDrag)return;
    if(pDrag.started){ var el3=document.elementFromPoint(e.clientX,e.clientY); var cell=el3&&el3.closest(".mcell,.wcol"); if(cell&&cell.getAttribute("data-date")){ var it=state.items.find(function(x){return x.id===pDrag.id;}); if(it){it.date=cell.getAttribute("data-date");save();render();toast("일정으로 옮겼어요");} } if(ghost){ghost.remove();ghost=null;} document.body.style.userSelect=""; clearOver(); justDragged=true; }
    pDrag=null;
  });
  function reorderProj(from,overIdx,after){
    var arr=state.projects; var moved=arr[from]; arr.splice(from,1);
    var target=(from<overIdx)?overIdx-1:overIdx; if(after)target+=1;
    if(target<0)target=0; if(target>arr.length)target=arr.length;
    arr.splice(target,0,moved); save(); render();
  }
  document.addEventListener("click",function(e){ if(justDragged){justDragged=false;e.stopPropagation();e.preventDefault();} },true);

  /* 사이드바 */
  document.querySelector(".side").addEventListener("click",function(e){
    var nv=e.target.closest(".nav-item"); if(nv){ view=nv.getAttribute("data-view"); [].forEach.call(document.querySelectorAll(".nav-item"),function(x){x.classList.toggle("on",x===nv);}); setSeg(); render(); return; }
    var ci=e.target.closest(".cat-item"); if(ci){ filterCat=ci.getAttribute("data-cat"); filterProj=""; render(); return; }
    var pe=e.target.closest("[data-pedit]"); if(pe){ var ei=+pe.getAttribute("data-pedit"); var oldN=state.projects[ei]; var nn=prompt("프로젝트 이름 변경", oldN); if(nn&&nn.trim()&&nn.trim()!==oldN){ var newN=nn.trim(); state.items.forEach(function(it){if(it.project===oldN)it.project=newN;}); if(filterProj===oldN)filterProj=newN; state.projects[ei]=newN; save(); render(); } return; }
    var pd=e.target.closest("[data-pdel]"); if(pd){ var di=+pd.getAttribute("data-pdel"); var pn=state.projects[di]; var cnt=state.items.filter(function(it){return it.project===pn;}).length; if(!confirm('"'+pn+'" 프로젝트를 삭제할까요?'+(cnt?("\n연결된 일정 "+cnt+"건은 \"프로젝트 없음\"으로 바뀝니다."):""))) return; state.items.forEach(function(it){if(it.project===pn)it.project="";}); if(filterProj===pn)filterProj=""; state.projects.splice(di,1); save(); render(); return; }
    var pi=e.target.closest(".proj-item"); if(pi){ var p=pi.getAttribute("data-proj"); filterProj=(filterProj===p?"":p); filterCat=""; render(); return; }
    if(e.target.id==="addProj"){ var n=prompt("새 프로젝트 이름"); if(n&&n.trim()){state.projects.push(n.trim());save();render();} }
  });
  document.getElementById("searchInput").addEventListener("input",function(){search=this.value.trim().toLowerCase();render();});

  /* 상단 */
  function setSeg(){ [].forEach.call(document.querySelectorAll("#viewSeg button"),function(b){b.classList.toggle("on",b.getAttribute("data-v")===view);}); }
  document.getElementById("viewSeg").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;view=b.getAttribute("data-v");[].forEach.call(document.querySelectorAll(".nav-item"),function(x){x.classList.toggle("on",x.getAttribute("data-view")===view);});setSeg();render();});
  document.getElementById("qfilter").addEventListener("click",function(e){var b=e.target.closest(".qf");if(!b)return;quick=b.getAttribute("data-q");[].forEach.call(document.querySelectorAll(".qf"),function(x){x.classList.toggle("on",x===b);});render();});
  document.getElementById("prev").onclick=function(){ if(view==="week"){_weekRef.setDate(_weekRef.getDate()-7);} else {curMonth--;if(curMonth<0){curMonth=11;curYear--;}} render(); };
  document.getElementById("next").onclick=function(){ if(view==="week"){_weekRef.setDate(_weekRef.getDate()+7);} else {curMonth++;if(curMonth>11){curMonth=0;curYear++;}} render(); };
  document.getElementById("todayBtn").onclick=function(){ var n=new Date(); curYear=n.getFullYear();curMonth=n.getMonth();_weekRef=new Date(); if(view==="inbox"||view==="agenda"){} render(); };

  function toast(m){var t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.classList.add("show");},10);setTimeout(function(){t.classList.remove("show");setTimeout(function(){t.remove();},300);},2000);}

  /* ---- 로드 ---- */
  (async function(){
    var loaded=null;
    try{ var r=await sb("sku_state?id=eq."+ROW+"&select=payload"); var p=r&&r[0]&&r[0].payload; if(p&&p.items){loaded=p;} cloudOK=true; }
    catch(e){ cloudOK=false; try{var l=JSON.parse(localStorage.getItem(LKEY)||"null"); if(l&&l.items)loaded=l;}catch(e2){} }
    if(loaded){ state=loaded; if(!state.projects)state.projects=[]; }
    else { state.items=seed(); }
    ready=true; render();
    if(loaded&&cloudOK)save();
  })();
})();
</script>
</body>
</html>
