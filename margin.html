<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상품별 마진 · ANDNEEDS</title>
<style>
  :root{
    --bg:#ffffff;
    --panel:#ffffff;
    --ink:#111315;
    --ink-2:#5b6168;
    --ink-3:#9aa0a6;
    --line:#ececef;
    --line-2:#e2e2e6;
    --blue:#2B6CB8;
    --blue-soft:#e9f1fa;
    --red:#e5484d;
    --amber:#c2790a;
    --good:#1f9d6b;
    --chip:#f4f5f7;
    --radius:14px;
    --shadow:0 1px 2px rgba(17,19,21,.04),0 8px 24px rgba(17,19,21,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);
    font-family:'Galvji',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Inter',sans-serif;
    -webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1;}
  .wrap{max-width:1180px;margin:0 auto;padding:32px 24px 80px}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
  .sub{color:var(--ink-2);font-size:14px;margin-top:6px}

  /* channel tabs */
  .tabs{display:flex;gap:8px;margin:26px 0 18px;flex-wrap:wrap}
  .tab{border:1px solid var(--line-2);background:var(--chip);color:var(--ink-2);
    padding:9px 18px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;
    transition:.16s ease;letter-spacing:-.01em}
  .tab:hover{border-color:#cfd2d8}
  .tab.active{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(43,108,184,.24)}

  /* settings bar */
  .settings{display:flex;align-items:center;gap:22px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:11px;letter-spacing:.04em;color:var(--ink-3);font-weight:600;text-transform:uppercase}
  .field .inp{display:flex;align-items:center;gap:4px}
  .field input{width:74px;border:1px solid var(--line-2);border-radius:9px;padding:7px 10px;
    font-size:15px;font-weight:600;color:var(--ink);text-align:right;font-family:inherit}
  .field input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
  .field .unit{color:var(--ink-2);font-size:14px;font-weight:600}
  .note{color:var(--ink-3);font-size:12.5px;line-height:1.5;max-width:330px}
  .note b{color:var(--ink-2);font-weight:600}

  /* toolbar */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 12px;flex-wrap:wrap}
  .left-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .search{position:relative}
  .search input{border:1px solid var(--line-2);border-radius:10px;padding:9px 12px 9px 34px;
    font-size:14px;width:210px;font-family:inherit}
  .search input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
  .seg{display:flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
  .seg button{border:none;background:#fff;color:var(--ink-2);padding:8px 14px;font-size:13px;
    font-weight:600;cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--ink);color:#fff}
  .btn-primary{background:var(--ink);color:#fff;border:none;border-radius:10px;padding:10px 16px;
    font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
  .btn-primary:hover{background:#000}
  .summary{color:var(--ink-2);font-size:13px}
  .summary b{color:var(--ink);font-weight:700;font-size:15px}

  /* table */
  .tablecard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden}
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:880px}
  thead .grp th{font-size:11px;letter-spacing:.04em;color:var(--ink-3);font-weight:600;
    text-transform:uppercase;padding:14px 14px 4px;text-align:right;white-space:nowrap}
  thead .grp th.lbl{text-align:left}
  thead .rate th{font-size:11px;color:var(--blue);font-weight:600;padding:0 14px 12px;
    text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
  thead .rate th.lbl{color:var(--ink-3);text-align:left}
  th.disc{background:#fcfcfd}
  th.disc.custom{background:var(--blue-soft)}
  tbody td{padding:14px;border-bottom:1px solid var(--line);font-size:14px;text-align:right;white-space:nowrap}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#fafbfc}
  td.name{text-align:left;font-weight:600;letter-spacing:-.01em;position:sticky;left:0;background:#fff;z-index:1}
  tbody tr:hover td.name{background:#fafbfc}
  td.cost,td.price{color:var(--ink-2);font-variant-numeric:tabular-nums}
  td.m{font-variant-numeric:tabular-nums}
  td.m .pct{font-weight:700;font-size:14.5px}
  td.m .amt{font-size:11.5px;color:var(--ink-3);margin-top:2px}
  td.m.neg .pct{color:var(--red)}
  td.m.neg .amt{color:#e98a8d}
  td.m.thin .pct{color:var(--amber)}
  td.m.custom{background:var(--blue-soft)}
  td.actions{text-align:right}
  .icon-btn{border:none;background:none;cursor:pointer;color:var(--ink-3);padding:5px;border-radius:7px;font-size:13px}
  .icon-btn:hover{background:#f0f1f3;color:var(--ink)}
  .empty{padding:54px;text-align:center;color:var(--ink-3);font-size:14px}

  /* custom discount control */
  .custombar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);font-weight:600}
  .custombar input{width:60px;border:1px solid var(--blue);border-radius:9px;padding:7px 9px;
    font-size:14px;font-weight:600;text-align:right;color:var(--blue);font-family:inherit}
  .custombar input:focus{outline:none;box-shadow:0 0 0 3px var(--blue-soft)}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(17,19,21,.34);backdrop-filter:blur(2px);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:18px;width:100%;max-width:420px;padding:26px 26px 22px;
    box-shadow:0 24px 60px rgba(17,19,21,.22)}
  .modal h3{font-size:19px;font-weight:700;letter-spacing:-.01em}
  .modal .mfield{margin-top:18px}
  .modal .mfield label{display:block;font-size:12px;color:var(--ink-2);font-weight:600;margin-bottom:6px}
  .modal .mfield input{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:11px 13px;
    font-size:15px;font-family:inherit}
  .modal .mfield input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
  .modal-actions{display:flex;gap:10px;margin-top:24px}
  .modal-actions button{flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn-ghost{background:#f4f5f7;border:none;color:var(--ink-2)}
  .btn-ghost:hover{background:#ececef}
  .btn-save{background:var(--ink);border:none;color:#fff}
  .btn-save:hover{background:#000}
  .mprev{margin-top:18px;padding:12px 14px;background:#fafbfc;border:1px solid var(--line);border-radius:10px;
    font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between}
  .mprev b{color:var(--ink);font-weight:700}

  @media(max-width:640px){
    .wrap{padding:22px 14px 64px}
    h1{font-size:24px}
    .settings{gap:16px}
    .toolbar{align-items:flex-start;flex-direction:column}
    .search input{width:100%}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">ANDNEEDS · 채널 마진</div>
  <h1>상품별 마진</h1>
  <p class="sub">채널을 바꾸면 같은 상품의 채널별 마진이 보입니다. 할인 구간별로 실제 남는 마진을 확인하세요.</p>

  <div class="tabs" id="tabs"></div>

  <div class="settings" id="settings"></div>

  <div class="toolbar">
    <div class="left-tools">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" placeholder="상품 검색" oninput="render()">
      </div>
      <div class="seg">
        <button id="seg-pct" class="on" onclick="setView('pct')">마진율</button>
        <button id="seg-amt" onclick="setView('amt')">마진액</button>
      </div>
      <div class="custombar">직접 할인
        <input id="custom" type="number" min="0" max="90" value="35" oninput="render()">%
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:16px">
      <div class="summary" id="summary"></div>
      <button class="btn-primary" onclick="openModal()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
        상품 추가
      </button>
    </div>
  </div>

  <div class="tablecard">
    <div class="scroll">
      <table id="tbl"></table>
    </div>
  </div>
</div>

<!-- modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modal-title">상품 추가</h3>
    <div class="mfield">
      <label>상품명</label>
      <input id="m-name" placeholder="예: 우먼 코튼 셔츠">
    </div>
    <div class="mfield">
      <label>원가 (₩)</label>
      <input id="m-cost" type="number" inputmode="numeric" placeholder="18000" oninput="updatePreview()">
    </div>
    <div class="mfield">
      <label>정가 (₩)</label>
      <input id="m-price" type="number" inputmode="numeric" placeholder="59000" oninput="updatePreview()">
    </div>
    <div class="mprev" id="m-prev"><span>정가 기준 마진</span><b>—</b></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveProduct()">저장</button>
    </div>
  </div>
</div>

<script>
/* ---------- defaults ---------- */
const DISCOUNTS=[0,10,20,30,40,50];
let CHANNELS={
  '29cm'   :{name:'29CM',   commission:30, step:1,   type:'platform'},
  'musinsa':{name:'무신사', commission:30, step:0,   type:'platform'},
  'zvzo'   :{name:'ZVZO',   commission:30, step:0,   type:'platform'},
  'own'    :{name:'자사몰', commission:0,  step:0,   type:'own', pg:3.3}
};
let PRODUCTS=[
  {id:1,name:'우먼 코튼 셔츠',     cost:18000, price:59000},
  {id:2,name:'와이드 데님 팬츠',   cost:24000, price:78000},
  {id:3,name:'램스울 라운드 니트', cost:21000, price:68000}
];
let active='29cm', view='pct', editingId=null;

/* ---------- storage (graceful) ---------- */
async function load(){
  try{
    const p=await window.storage.get('margin:products');
    if(p&&p.value) PRODUCTS=JSON.parse(p.value);
  }catch(e){}
  try{
    const c=await window.storage.get('margin:channels');
    if(c&&c.value) CHANNELS=JSON.parse(c.value);
  }catch(e){}
}
async function save(){
  try{await window.storage.set('margin:products',JSON.stringify(PRODUCTS));}catch(e){}
  try{await window.storage.set('margin:channels',JSON.stringify(CHANNELS));}catch(e){}
}

/* ---------- math ---------- */
function effRate(ch,d){            // effective fee rate (%) at discount d(%)
  if(ch.type==='own') return ch.pg||0;
  return Math.max(0, ch.commission - (d/10)*ch.step);
}
function calc(prod,ch,d){
  const sell=prod.price*(1-d/100);
  const fee=sell*effRate(ch,d)/100;
  const margin=sell-prod.cost-fee;
  const pct=sell>0?margin/sell*100:0;
  return {sell,fee,margin,pct};
}
const won=n=>'₩'+Math.round(n).toLocaleString('ko-KR');
const fmtR=v=>Number.isInteger(v)?v:Math.round(v*10)/10;

/* ---------- render ---------- */
function renderTabs(){
  document.getElementById('tabs').innerHTML=Object.keys(CHANNELS).map(k=>
    `<button class="tab ${k===active?'active':''}" onclick="setChannel('${k}')">${CHANNELS[k].name}</button>`).join('');
}
function renderSettings(){
  const ch=CHANNELS[active];
  let html='';
  if(ch.type==='own'){
    html=`<div class="field"><label>PG 수수료</label><div class="inp">
      <input type="number" step="0.1" value="${ch.pg}" onchange="setCfg('pg',this.value)"><span class="unit">%</span></div></div>
      <div class="note">자사몰은 플랫폼 수수료가 없어요. <b>PG 결제 수수료</b>만 차감해 마진을 계산합니다. 할인해도 수수료율은 그대로예요.</div>`;
  }else{
    html=`<div class="field"><label>기본 수수료율</label><div class="inp">
      <input type="number" step="0.5" value="${ch.commission}" onchange="setCfg('commission',this.value)"><span class="unit">%</span></div></div>
      <div class="field"><label>할인당 수수료 차감</label><div class="inp">
      <input type="number" step="0.5" value="${ch.step}" onchange="setCfg('step',this.value)"><span class="unit">%p / 10%</span></div></div>`;
    if(active==='29cm'){
      html+=`<div class="note"><b>29CM 규칙 반영됨.</b> 10% 할인당 수수료가 1%p씩 줄어요. (예: 정가 30% → 30%할인 27% → 50%할인 25%)</div>`;
    }else{
      html+=`<div class="note">실제 계약 수수료율로 바꿔주세요. 이 값은 기본 placeholder예요. 할인 시 수수료 차감이 있으면 우측 값을 올리면 됩니다.</div>`;
    }
  }
  document.getElementById('settings').innerHTML=html;
}
function colsHTML(){
  const ch=CHANNELS[active];
  const cd=Math.max(0,Math.min(90,parseFloat(document.getElementById('custom').value)||0));
  let grp=`<th class="lbl">상품명</th><th>원가</th><th>정가</th>`;
  let rate=`<th class="lbl">적용 수수료율 →</th><th></th><th></th>`;
  DISCOUNTS.forEach(d=>{
    grp+=`<th class="disc">${d===0?'정가':'-'+d+'%'}</th>`;
    rate+=`<th class="disc">${fmtR(effRate(ch,d))}%</th>`;
  });
  grp+=`<th class="disc custom">직접 -${cd}%</th><th>관리</th>`;
  rate+=`<th class="disc custom">${fmtR(effRate(ch,cd))}%</th><th></th>`;
  return {grp,rate,cd};
}
function cell(prod,ch,d,custom){
  const r=calc(prod,ch,d);
  let cls='m'+(custom?' custom':'');
  if(r.margin<0) cls+=' neg'; else if(r.pct<10) cls+=' thin';
  const main = view==='pct' ? r.pct.toFixed(1)+'%' : won(r.margin);
  const sub  = view==='pct' ? won(r.margin)        : r.pct.toFixed(1)+'%';
  return `<td class="${cls}"><div class="pct">${main}</div><div class="amt">${sub}</div></td>`;
}
function render(){
  renderTabs();renderSettings();
  const ch=CHANNELS[active];
  const {grp,rate,cd}=colsHTML();
  const q=(document.getElementById('search').value||'').trim().toLowerCase();
  const list=PRODUCTS.filter(p=>p.name.toLowerCase().includes(q));

  let body='';
  if(list.length===0){
    body=`<tr><td class="empty" colspan="${DISCOUNTS.length+5}">${PRODUCTS.length?'검색 결과가 없어요.':'아직 상품이 없어요. ‘상품 추가’로 시작하세요.'}</td></tr>`;
  }else{
    body=list.map(p=>{
      let cells=DISCOUNTS.map(d=>cell(p,ch,d,false)).join('');
      cells+=cell(p,ch,cd,true);
      return `<tr>
        <td class="name">${p.name}</td>
        <td class="cost">${won(p.cost)}</td>
        <td class="price">${won(p.price)}</td>
        ${cells}
        <td class="actions">
          <button class="icon-btn" title="수정" onclick="openModal(${p.id})">✎</button>
          <button class="icon-btn" title="삭제" onclick="del(${p.id})">✕</button>
        </td></tr>`;
    }).join('');
  }
  document.getElementById('tbl').innerHTML=
    `<thead><tr class="grp">${grp}</tr><tr class="rate">${rate}</tr></thead><tbody>${body}</tbody>`;

  // summary: avg margin% at 정가
  if(list.length){
    const avg=list.reduce((s,p)=>s+calc(p,ch,0).pct,0)/list.length;
    document.getElementById('summary').innerHTML=`정가 기준 평균 마진율 <b>${avg.toFixed(1)}%</b>`;
  }else document.getElementById('summary').innerHTML='';
}

/* ---------- interactions ---------- */
function setChannel(k){active=k;render();}
function setView(v){view=v;
  document.getElementById('seg-pct').classList.toggle('on',v==='pct');
  document.getElementById('seg-amt').classList.toggle('on',v==='amt');render();}
function setCfg(key,val){CHANNELS[active][key]=parseFloat(val)||0;save();render();}

/* modal */
function openModal(id){
  editingId=id||null;
  document.getElementById('modal-title').textContent=id?'상품 수정':'상품 추가';
  const p=id?PRODUCTS.find(x=>x.id===id):null;
  document.getElementById('m-name').value=p?p.name:'';
  document.getElementById('m-cost').value=p?p.cost:'';
  document.getElementById('m-price').value=p?p.price:'';
  updatePreview();
  document.getElementById('overlay').classList.add('show');
  setTimeout(()=>document.getElementById('m-name').focus(),50);
}
function closeModal(){document.getElementById('overlay').classList.remove('show');}
function updatePreview(){
  const cost=parseFloat(document.getElementById('m-cost').value)||0;
  const price=parseFloat(document.getElementById('m-price').value)||0;
  const ch=CHANNELS[active];
  const el=document.getElementById('m-prev');
  if(price>0){const r=calc({cost,price},ch,0);
    el.innerHTML=`<span>${ch.name} 정가 기준 마진</span><b>${won(r.margin)} · ${r.pct.toFixed(1)}%</b>`;
  }else el.innerHTML=`<span>정가 기준 마진</span><b>—</b>`;
}
function saveProduct(){
  const name=document.getElementById('m-name').value.trim();
  const cost=parseFloat(document.getElementById('m-cost').value)||0;
  const price=parseFloat(document.getElementById('m-price').value)||0;
  if(!name){document.getElementById('m-name').focus();return;}
  if(editingId){const p=PRODUCTS.find(x=>x.id===editingId);p.name=name;p.cost=cost;p.price=price;}
  else PRODUCTS.push({id:Date.now(),name,cost,price});
  save();closeModal();render();
}
function del(id){
  const p=PRODUCTS.find(x=>x.id===id);
  if(confirm(`‘${p.name}’ 삭제할까요?`)){PRODUCTS=PRODUCTS.filter(x=>x.id!==id);save();render();}
}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* init */
(async()=>{await load();render();})();
</script>
</body>
</html>
