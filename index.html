<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>앤니즈 · 매출현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F5F2;
    --surface: #FFFFFF;
    --surface2: #F0EDE8;
    --border: rgba(0,0,0,0.08);
    --border-mid: rgba(0,0,0,0.14);
    --text: #1A1714;
    --text-2: #6B6560;
    --text-3: #A09A94;
    --accent: #1A1714;
    --danger: #8C3A2A;
    --success: #2A6644;
    --chart-bar: rgba(26,23,20,0.13);
    --chart-net: rgba(26,23,20,0.6);
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    font-weight: 400;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* NAV */
  nav {
    position: sticky; top: 0; z-index: 100;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px; height: 56px;
  }
  .nav-brand { font-family: 'DM Serif Display', serif; font-size: 17px; letter-spacing: 0.04em; color: var(--text); }
  .nav-sub { font-size: 11px; letter-spacing: 0.12em; color: var(--text-3); text-transform: uppercase; }
  .nav-right { display: flex; gap: 6px; }
  .tab-btn {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px; font-weight: 500;
    padding: 5px 14px; border-radius: 20px;
    border: 1px solid var(--border-mid);
    background: transparent; color: var(--text-2);
    cursor: pointer; transition: all 0.15s;
    letter-spacing: 0.03em;
  }
  .tab-btn:hover { background: var(--surface2); }
  .tab-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }

  /* MAIN */
  main { max-width: 1080px; margin: 0 auto; padding: 32px 24px 64px; }

  /* SECTION HEADER */
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .sec-title { font-size: 11px; font-weight: 500; letter-spacing: 0.1em; color: var(--text-3); text-transform: uppercase; }

  /* METRIC CARDS */
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .metric-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px;
    transition: border-color 0.15s;
  }
  .metric-card:hover { border-color: var(--border-mid); }
  .metric-label { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: var(--text-3); text-transform: uppercase; margin-bottom: 8px; }
  .metric-value { font-size: 22px; font-weight: 300; color: var(--text); letter-spacing: -0.02em; }
  .metric-sub { font-size: 12px; color: var(--text-3); margin-top: 4px; }
  .metric-card.highlight { background: var(--text); }
  .metric-card.highlight .metric-label { color: rgba(247,245,242,0.5); }
  .metric-card.highlight .metric-value { color: #F7F5F2; }
  .metric-card.highlight .metric-sub { color: rgba(247,245,242,0.45); }

  /* CHART */
  .chart-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px; margin-bottom: 28px;
  }
  .chart-legend { display: flex; gap: 20px; margin-bottom: 16px; }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-2); }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; }

  /* PLATFORM */
  .platforms { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .plat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px;
  }
  .plat-name { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: var(--text-3); text-transform: uppercase; margin-bottom: 8px; }
  .plat-val { font-size: 17px; font-weight: 400; color: var(--text); }
  .plat-net { font-size: 12px; color: var(--text-3); margin-top: 3px; }
  .plat-bar { height: 2px; background: var(--border); border-radius: 2px; margin-top: 14px; }
  .plat-fill { height: 100%; border-radius: 2px; background: var(--text); transition: width 0.5s ease; }

  /* TABLE */
  .table-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; margin-bottom: 28px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    background: var(--surface2); padding: 11px 16px;
    text-align: left; font-size: 11px; font-weight: 500;
    color: var(--text-3); letter-spacing: 0.07em; text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }
  tbody td { padding: 11px 16px; border-bottom: 1px solid var(--border); color: var(--text); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--surface2); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .neg { color: var(--danger); }
  .pos { color: var(--success); }

  /* INPUT SECTION */
  .input-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px; margin-bottom: 28px;
  }
  .input-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .input-tab {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px; font-weight: 500; padding: 5px 14px;
    border-radius: 20px; border: 1px solid var(--border-mid);
    background: transparent; color: var(--text-2); cursor: pointer;
    transition: all 0.15s;
  }
  .input-tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .input-panel { display: none; }
  .input-panel.active { display: block; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-label { font-size: 11px; font-weight: 500; color: var(--text-3); letter-spacing: 0.06em; text-transform: uppercase; }
  input[type=text], input[type=number], input[type=date], select {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px; padding: 8px 12px;
    border: 1px solid var(--border-mid); border-radius: 8px;
    background: var(--bg); color: var(--text);
    outline: none; transition: border-color 0.15s; width: 100%;
  }
  input:focus, select:focus { border-color: var(--text); }
  .btn-primary {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px; font-weight: 500;
    padding: 10px 24px; border-radius: 8px;
    border: none; background: var(--text); color: var(--bg);
    cursor: pointer; transition: opacity 0.15s;
  }
  .btn-primary:hover { opacity: 0.8; }

  /* UPLOAD AREA */
  .upload-area {
    border: 1.5px dashed var(--border-mid); border-radius: 10px;
    padding: 32px; text-align: center; cursor: pointer;
    transition: all 0.15s; background: var(--bg);
  }
  .upload-area:hover, .upload-area.drag { border-color: var(--text); background: var(--surface2); }
  .upload-icon { font-size: 28px; margin-bottom: 10px; }
  .upload-title { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
  .upload-sub { font-size: 12px; color: var(--text-3); margin-bottom: 16px; }
  .upload-btn {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px; font-weight: 500;
    padding: 7px 18px; border-radius: 8px;
    border: 1px solid var(--border-mid); background: var(--surface);
    color: var(--text-2); cursor: pointer;
  }
  .upload-hint { font-size: 11px; color: var(--text-3); margin-top: 12px; }
  #fileInput { display: none; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--text); color: var(--bg);
    font-size: 13px; padding: 10px 20px; border-radius: 8px;
    transition: transform 0.3s; z-index: 999; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* EMPTY */
  .empty { text-align: center; padding: 40px; color: var(--text-3); font-size: 13px; }

  @media (max-width: 600px) {
    nav { padding: 0 16px; }
    main { padding: 20px 16px 48px; }
    .metric-value { font-size: 18px; }
  }
</style>
</head>
<body>

<nav>
  <div>
    <div class="nav-brand">AN·NIZ</div>
    <div class="nav-sub">매출현황</div>
  </div>
  <div class="nav-right">
    <button class="tab-btn active" onclick="setView('monthly',this)">월별</button>
    <button class="tab-btn" onclick="setView('daily',this)">일별</button>
  </div>
</nav>

<main>
  <!-- Metrics -->
  <div class="sec-head">
    <span class="sec-title" id="periodLabel">2025년 전체</span>
  </div>
  <div class="metrics" id="metrics"></div>

  <!-- Chart -->
  <div class="chart-card">
    <div class="chart-legend">
      <div class="legend-item"><div class="legend-dot" style="background:rgba(26,23,20,0.18)"></div>판매액</div>
      <div class="legend-item"><div class="legend-dot" style="background:rgba(26,23,20,0.65)"></div>실 판매액</div>
    </div>
    <div style="position:relative;width:100%;height:220px;">
      <canvas id="mainChart" role="img" aria-label="앤니즈 매출 추이"></canvas>
    </div>
  </div>

  <!-- Platforms -->
  <div class="sec-head"><span class="sec-title">플랫폼별</span></div>
  <div class="platforms" id="platforms"></div>

  <!-- Table -->
  <div class="sec-head"><span class="sec-title">상세 내역</span></div>
  <div class="table-card">
    <table><thead><tr id="tableHead"></tr></thead><tbody id="tableBody"></tbody></table>
  </div>

  <!-- Input -->
  <div class="sec-head"><span class="sec-title">데이터 입력</span></div>
  <div class="input-card">
    <div class="input-tabs">
      <button class="input-tab active" onclick="switchInputTab('manual',this)">직접 입력</button>
      <button class="input-tab" onclick="switchInputTab('upload',this)">파일 업로드</button>
    </div>

    <!-- 직접 입력 -->
    <div class="input-panel active" id="panel-manual">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">날짜</label>
          <input type="date" id="inp-date">
        </div>
        <div class="form-group">
          <label class="form-label">플랫폼</label>
          <select id="inp-platform">
            <option>29CM</option>
            <option>무신사</option>
            <option>자사몰</option>
            <option>기타</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">판매액 (원)</label>
          <input type="number" id="inp-sales" placeholder="예: 1500000">
        </div>
        <div class="form-group">
          <label class="form-label">쿠폰할인 (원)</label>
          <input type="number" id="inp-coupon" placeholder="예: 75000">
        </div>
        <div class="form-group">
          <label class="form-label">주문 건수</label>
          <input type="number" id="inp-orders" placeholder="예: 12">
        </div>
      </div>
      <button class="btn-primary" onclick="addManual()">추가하기</button>
    </div>

    <!-- 파일 업로드 -->
    <div class="input-panel" id="panel-upload">
      <div class="upload-area" id="uploadArea"
        ondragover="event.preventDefault();this.classList.add('drag')"
        ondragleave="this.classList.remove('drag')"
        ondrop="handleDrop(event)">
        <div class="upload-icon">📂</div>
        <div class="upload-title">CSV / Excel 파일을 여기에 끌어다 놓으세요</div>
        <div class="upload-sub">29CM에서 내려받은 주문 데이터 파일을 그대로 올려주세요</div>
        <button class="upload-btn" onclick="document.getElementById('fileInput').click()">파일 선택</button>
        <div class="upload-hint">지원 형식 · .csv · 취소 주문 자동 제외</div>
        <input type="file" id="fileInput" accept=".csv" onchange="handleFile(this.files[0])">
      </div>
      <div id="uploadResult" style="margin-top:14px;font-size:13px;color:var(--text-3);"></div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
let currentView = 'monthly';
let chartInstance = null;

// 샘플 데이터
let records = [
  { date:'2025-01-15', platform:'29CM',  sales:3200000, coupon:160000, orders:24 },
  { date:'2025-01-22', platform:'무신사', sales:1400000, coupon:70000,  orders:11 },
  { date:'2025-02-08', platform:'29CM',  sales:2900000, coupon:145000, orders:19 },
  { date:'2025-02-20', platform:'자사몰', sales:800000,  coupon:30000,  orders:6  },
  { date:'2025-03-05', platform:'29CM',  sales:3800000, coupon:190000, orders:28 },
  { date:'2025-03-18', platform:'무신사', sales:2100000, coupon:105000, orders:16 },
  { date:'2025-04-03', platform:'29CM',  sales:4200000, coupon:210000, orders:32 },
  { date:'2025-04-14', platform:'무신사', sales:2600000, coupon:130000, orders:20 },
  { date:'2025-04-25', platform:'자사몰', sales:1100000, coupon:44000,  orders:9  },
];

function fmt(n){ return '₩' + Math.round(n).toLocaleString(); }
function fmtK(n){ return n>=1000000 ? '₩'+(n/1000000).toFixed(1)+'M' : fmt(n); }

// ── 집계 ──────────────────────────────────────────────
function getAgg(){
  if(currentView==='monthly'){
    const map = {};
    records.forEach(r=>{
      const key = r.date.slice(0,7);
      if(!map[key]) map[key]={date:key, sales:0, coupon:0, orders:0};
      map[key].sales  += r.sales;
      map[key].coupon += r.coupon;
      map[key].orders += (r.orders||1);
    });
    return Object.values(map).sort((a,b)=>a.date.localeCompare(b.date));
  } else {
    const map = {};
    records.forEach(r=>{
      if(!map[r.date]) map[r.date]={date:r.date, sales:0, coupon:0, orders:0};
      map[r.date].sales  += r.sales;
      map[r.date].coupon += r.coupon;
      map[r.date].orders += (r.orders||1);
    });
    return Object.values(map).sort((a,b)=>a.date.localeCompare(b.date));
  }
}

// ── 메트릭 ───────────────────────────────────────────
function renderMetrics(){
  const totalSales  = records.reduce((s,r)=>s+r.sales,0);
  const totalCoupon = records.reduce((s,r)=>s+r.coupon,0);
  const totalNet    = totalSales - totalCoupon;
  const totalOrders = records.reduce((s,r)=>s+(r.orders||1),0);
  const discRate    = Math.round(totalCoupon/totalSales*100);

  const cards = [
    { label:'총 판매액',  value: fmt(totalSales), highlight: false },
    { label:'쿠폰 할인',  value: fmt(totalCoupon), sub: '할인율 '+discRate+'%', highlight: false },
    { label:'실 판매액',  value: fmt(totalNet), highlight: true },
    { label:'총 주문',    value: totalOrders+'건', highlight: false },
  ];

  document.getElementById('metrics').innerHTML = cards.map(c=>`
    <div class="metric-card${c.highlight?' highlight':''}">
      <div class="metric-label">${c.label}</div>
      <div class="metric-value">${c.value}</div>
      ${c.sub?`<div class="metric-sub">${c.sub}</div>`:''}
    </div>`).join('');
}

// ── 차트 ─────────────────────────────────────────────
function renderChart(){
  const ctx = document.getElementById('mainChart').getContext('2d');
  if(chartInstance){ chartInstance.destroy(); chartInstance=null; }
  const agg = getAgg();
  const labels    = agg.map(r=> currentView==='monthly' ? r.date : r.date.slice(5));
  const salesArr  = agg.map(r=>r.sales);
  const netArr    = agg.map(r=>r.sales-r.coupon);

  chartInstance = new Chart(ctx, {
    type:'bar',
    data:{
      labels,
      datasets:[
        { label:'판매액',   data:salesArr, backgroundColor:'rgba(26,23,20,0.13)', borderRadius:3, borderSkipped:false },
        { label:'실 판매액', data:netArr,   backgroundColor:'rgba(26,23,20,0.62)', borderRadius:3, borderSkipped:false },
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          callbacks:{
            label:c=>c.dataset.label+': ₩'+Math.round(c.raw).toLocaleString()
          }
        }
      },
      scales:{
        x:{
          ticks:{color:'#A09A94', font:{size:11, family:'Noto Sans KR'}, autoSkip:true, maxRotation:0},
          grid:{display:false}, border:{display:false}
        },
        y:{
          ticks:{color:'#A09A94', font:{size:11, family:'Noto Sans KR'}, callback:v=>fmtK(v)},
          grid:{color:'rgba(0,0,0,0.05)'}, border:{display:false}
        }
      }
    }
  });
}

// ── 플랫폼 ───────────────────────────────────────────
function renderPlatforms(){
  const pmap = {};
  records.forEach(r=>{
    if(!pmap[r.platform]) pmap[r.platform]={sales:0,coupon:0};
    pmap[r.platform].sales  += r.sales;
    pmap[r.platform].coupon += r.coupon;
  });
  const total = Object.values(pmap).reduce((s,v)=>s+v.sales,0)||1;
  document.getElementById('platforms').innerHTML = Object.entries(pmap)
    .sort((a,b)=>b[1].sales-a[1].sales)
    .map(([name,v])=>`
      <div class="plat-card">
        <div class="plat-name">${name}</div>
        <div class="plat-val">${fmt(v.sales)}</div>
        <div class="plat-net">실 ${fmt(v.sales-v.coupon)}</div>
        <div class="plat-bar"><div class="plat-fill" style="width:${Math.round(v.sales/total*100)}%"></div></div>
      </div>`).join('');
}

// ── 테이블 ───────────────────────────────────────────
function renderTable(){
  const agg = getAgg();
  if(agg.length===0){
    document.getElementById('tableHead').innerHTML='';
    document.getElementById('tableBody').innerHTML='<tr><td colspan="5" class="empty">데이터가 없습니다</td></tr>';
    return;
  }
  if(currentView==='monthly'){
    document.getElementById('tableHead').innerHTML=`
      <th>월</th><th class="num">판매액</th>
      <th class="num">쿠폰할인</th><th class="num">실 판매액</th>
      <th class="num">주문</th>`;
    document.getElementById('tableBody').innerHTML = agg.map(r=>`
      <tr>
        <td>${r.date}</td>
        <td class="num">${fmt(r.sales)}</td>
        <td class="num neg">−${fmt(r.coupon)}</td>
        <td class="num pos">${fmt(r.sales-r.coupon)}</td>
        <td class="num">${r.orders}건</td>
      </tr>`).join('');
  } else {
    document.getElementById('tableHead').innerHTML=`
      <th>날짜</th><th>플랫폼</th><th class="num">판매액</th>
      <th class="num">쿠폰할인</th><th class="num">실 판매액</th>`;
    document.getElementById('tableBody').innerHTML = agg.map(r=>`
      <tr>
        <td>${r.date}</td>
        <td>${records.find(x=>x.date===r.date)?.platform||'—'}</td>
        <td class="num">${fmt(r.sales)}</td>
        <td class="num neg">−${fmt(r.coupon)}</td>
        <td class="num pos">${fmt(r.sales-r.coupon)}</td>
      </tr>`).join('');
  }
}

// ── 뷰 전환 ─────────────────────────────────────────
function setView(view, btn){
  currentView = view;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('periodLabel').textContent = view==='monthly' ? '2025년 전체 (월별)' : '2025년 4월 (일별)';
  render();
}

// ── 직접 입력 ────────────────────────────────────────
function addManual(){
  const date    = document.getElementById('inp-date').value;
  const platform= document.getElementById('inp-platform').value;
  const sales   = parseInt(document.getElementById('inp-sales').value)||0;
  const coupon  = parseInt(document.getElementById('inp-coupon').value)||0;
  const orders  = parseInt(document.getElementById('inp-orders').value)||1;
  if(!date||!sales){ showToast('날짜와 판매액을 입력해주세요'); return; }
  records.push({date, platform, sales, coupon, orders});
  ['inp-date','inp-sales','inp-coupon','inp-orders'].forEach(id=>document.getElementById(id).value='');
  render();
  showToast('추가되었습니다');
}

// ── 파일 업로드 ──────────────────────────────────────
function handleDrop(e){
  e.preventDefault();
  document.getElementById('uploadArea').classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if(file) handleFile(file);
}

function handleFile(file){
  if(!file){ return; }
  const result = document.getElementById('uploadResult');
  result.textContent = '파일 분석 중...';

  Papa.parse(file, {
    header: true, skipEmptyLines: true,
    complete(res){
      const rows = res.data;
      let added = 0, skipped = 0;

      rows.forEach(row=>{
        // 취소 주문 제외
        const status = row['주문상태']||row['상태']||row['status']||'';
        if(status.includes('취소')) { skipped++; return; }

        // 컬럼명 유연하게 매핑
        const date   = row['주문일']||row['날짜']||row['date']||'';
        const sales  = parseFloat((row['판매액']||row['결제금액']||row['sales']||'0').replace(/[,₩]/g,''))||0;
        const coupon = parseFloat((row['쿠폰할인']||row['할인금액']||row['coupon']||'0').replace(/[,₩]/g,''))||0;
        const plat   = row['플랫폼']||row['채널']||'29CM';

        if(date && sales>0){
          records.push({ date: date.slice(0,10), platform:plat, sales, coupon, orders:1 });
          added++;
        }
      });

      result.innerHTML = `<span style="color:var(--success)">✓ ${added}건 추가</span>${skipped>0?` &nbsp;·&nbsp; 취소 ${skipped}건 제외`:''}`;
      render();
      showToast(`${added}건이 추가되었습니다`);
    },
    error(){ result.textContent = '파일을 읽을 수 없습니다. CSV 형식인지 확인해주세요.'; }
  });
}

// ── 입력 탭 전환 ─────────────────────────────────────
function switchInputTab(name, btn){
  document.querySelectorAll('.input-tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.input-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
}

// ── 토스트 ───────────────────────────────────────────
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

// ── 렌더 ─────────────────────────────────────────────
function render(){
  renderMetrics();
  renderChart();
  renderPlatforms();
  renderTable();
}

render();
</script>
</body>
