<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>앤니즈 · 매출현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#FFFFFF;--surface:#FFFFFF;--surface2:#F5F5F5;--border:rgba(0,0,0,0.08);--border-mid:rgba(0,0,0,0.14);--text:#1A1714;--text-2:#6B6560;--text-3:#A09A94;--danger:#8C3A2A;--success:#2B6CB8;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px;}

  .layout{display:flex;min-height:100vh;}
  .sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;}
  .sidebar-logo{height:60px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid var(--border);box-sizing:border-box;}
  .sidebar-nav{flex:1;padding:16px 10px;}
  .nav-section-label{font-size:10px;font-weight:500;letter-spacing:0.1em;color:var(--text-3);text-transform:uppercase;padding:0 10px;margin-bottom:6px;}
  .nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;font-size:13px;color:var(--text-2);text-decoration:none;transition:all 0.15s;margin-bottom:2px;}
  .nav-item:hover{background:var(--surface2);color:var(--text);}
  .nav-item.active{background:var(--surface2);color:var(--text);font-weight:500;}
  .nav-disabled{opacity:0.4;pointer-events:none;}
  .sidebar-footer{padding:16px 20px;font-size:10px;letter-spacing:0.1em;color:var(--text-3);border-top:1px solid var(--border);}
  .page-content{margin-left:220px;flex:1;min-width:0;}
  .topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;}
  .topbar-title{font-size:13px;font-weight:500;color:var(--text);}
  @media(max-width:768px){.sidebar{width:48px;}.nav-item span.nav-label{display:none;}.nav-section-label{display:none;}.sidebar-footer{display:none;}.sidebar-logo{padding:0 10px;}.page-content{margin-left:48px;}.topbar{padding:0 16px;}}
main{max-width:1200px;margin:0 auto;padding:24px 28px 64px;}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:28px;}
.metric-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
.metric-card.highlight{background:var(--text);}
.metric-label{font-size:11px;font-weight:500;letter-spacing:0.08em;color:var(--text-3);text-transform:uppercase;margin-bottom:8px;}
.metric-card.highlight .metric-label{color:rgba(247,245,242,0.5);}
.metric-value{font-size:22px;font-weight:300;color:var(--text);letter-spacing:-0.02em;}
.metric-card.highlight .metric-value{color:#F7F5F2;}
.metric-sub{font-size:12px;color:var(--text-3);margin-top:4px;}
.metric-card.highlight .metric-sub{color:rgba(247,245,242,0.45);}
.tab-btn{font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;padding:5px 14px;border-radius:20px;border:1px solid var(--border-mid);background:transparent;color:var(--text-2);cursor:pointer;transition:all 0.15s;}
.tab-btn.active{background:var(--text);color:var(--bg);border-color:var(--text);}
.plat-filter-btn{font-family:'Noto Sans KR',sans-serif;font-size:12px;padding:5px 14px;border-radius:20px;border:1px solid var(--border-mid);background:transparent;color:var(--text-2);cursor:pointer;transition:all 0.15s;}
.plat-filter-btn:hover{background:var(--surface2);color:var(--text);}
.plat-filter-btn.active{background:var(--text);color:#fff;border-color:var(--text);}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:28px;}
.chart-legend{display:flex;gap:20px;margin-bottom:16px;}
.legend-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-2);}
.legend-dot{width:10px;height:10px;border-radius:2px;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-nav-btn{background:none;border:1px solid var(--border-mid);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px;color:var(--text-2);display:flex;align-items:center;justify-content:center;}
.cal-nav-btn:hover{background:var(--surface2);}
.cal-month-label{font-size:15px;font-weight:500;color:var(--text);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-day-name{text-align:center;font-size:11px;font-weight:500;color:var(--text-3);padding:8px 0;}
.cal-cell{background:var(--surface);border:1px solid var(--border);border-radius:8px;min-height:72px;padding:8px;}
.cal-cell.empty{background:transparent;border-color:transparent;}
.cal-cell.today{border-color:var(--text);}
.cal-date{font-size:12px;font-weight:500;color:var(--text-2);margin-bottom:4px;}
.cal-cell.today .cal-date{color:var(--text);}
.cal-sales{font-size:11px;font-weight:500;color:var(--text);line-height:1.4;}
.cal-net{font-size:10px;color:var(--success);}
.cal-cell{cursor:pointer;}
.cal-cell:hover{border-color:var(--border-mid);}
.cal-cell.has-data:hover{border-color:var(--text);}
.cal-compare{font-size:10px;color:var(--text-3);margin-top:2px;}
.cal-detail-overlay{display:none;position:fixed;inset:0;background:rgba(26,23,20,0.4);z-index:200;align-items:center;justify-content:center;}
.cal-detail-overlay.open{display:flex;}
.cal-detail-box{background:var(--surface);border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;margin:16px;}
.cal-detail-title{font-size:15px;font-weight:500;color:var(--text);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.cal-detail-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-3);}
.cal-detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.cal-detail-row:last-child{border-bottom:none;}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.sec-title{font-size:11px;font-weight:500;letter-spacing:0.1em;color:var(--text-3);text-transform:uppercase;}
.platforms{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:28px;}
.plat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
.plat-name{font-size:11px;font-weight:500;letter-spacing:0.08em;color:var(--text-3);text-transform:uppercase;margin-bottom:8px;}
.plat-val{font-size:17px;font-weight:400;color:var(--text);}
.plat-net{font-size:12px;color:var(--text-3);margin-top:3px;}
.plat-bar{height:2px;background:var(--border);border-radius:2px;margin-top:14px;}
.plat-fill{height:100%;border-radius:2px;background:var(--text);transition:width 0.5s;}
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:28px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{background:var(--surface2);padding:11px 16px;text-align:left;font-size:11px;font-weight:500;color:var(--text-3);letter-spacing:0.07em;text-transform:uppercase;border-bottom:1px solid var(--border);}
tbody td{padding:11px 16px;border-bottom:1px solid var(--border);color:var(--text);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--surface2);}
.num{text-align:right;font-variant-numeric:tabular-nums;}
.neg{color:var(--danger);}.pos{color:var(--success);}
.input-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:28px;}
.input-tabs{display:flex;gap:8px;margin-bottom:20px;}
.input-tab{font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;padding:5px 14px;border-radius:20px;border:1px solid var(--border-mid);background:transparent;color:var(--text-2);cursor:pointer;transition:all 0.15s;}
.input-tab.active{background:var(--text);color:var(--bg);border-color:var(--text);}
.input-panel{display:none;}.input-panel.active{display:block;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px;}
.form-group{display:flex;flex-direction:column;gap:5px;}
.form-label{font-size:11px;font-weight:500;color:var(--text-3);letter-spacing:0.06em;text-transform:uppercase;}
input[type=text],input[type=number],input[type=date],select{font-family:'Noto Sans KR',sans-serif;font-size:13px;padding:8px 12px;border:1px solid var(--border-mid);border-radius:8px;background:var(--bg);color:var(--text);outline:none;transition:border-color 0.15s;width:100%;}
input:focus,select:focus{border-color:var(--text);}
.btn-primary{font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:500;padding:10px 24px;border-radius:8px;border:none;background:var(--text);color:#fff;cursor:pointer;}
.btn-primary:hover{opacity:0.8;}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
.plat-select-btn{font-family:'Noto Sans KR',sans-serif;font-size:13px;padding:7px 18px;border-radius:8px;border:1px solid var(--border-mid);background:transparent;color:var(--text-2);cursor:pointer;transition:all 0.15s;}
.plat-select-btn:hover{background:var(--surface2);color:var(--text);}
.plat-select-btn.active{background:var(--text);color:#fff;border-color:var(--text);}
.upload-area{border:1.5px dashed var(--border-mid);border-radius:10px;padding:32px;text-align:center;background:var(--bg);}
.upload-btn{font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;padding:7px 18px;border-radius:8px;border:1px solid var(--border-mid);background:var(--surface);color:var(--text-2);cursor:pointer;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;font-size:13px;padding:10px 20px;border-radius:8px;transition:transform 0.3s;z-index:999;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
.loading{text-align:center;padding:40px;color:var(--text-3);font-size:13px;}
#fileInput{display:none;}



/* 모바일 메뉴 */
.mobile-header{display:none;}
.mobile-menu-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:150;}
.mobile-menu-overlay.open{display:block;}
.mobile-menu-panel{position:fixed;top:0;left:0;bottom:0;width:240px;background:#fff;z-index:200;padding:20px 16px;transform:translateX(-100%);transition:transform 0.25s;}
.mobile-menu-panel.open{transform:translateX(0);}
.mobile-menu-logo{height:40px;display:flex;align-items:center;margin-bottom:24px;}
.mobile-menu-item{display:flex;align-items:center;gap:10px;padding:12px 10px;border-radius:8px;font-size:14px;color:#6B6560;text-decoration:none;margin-bottom:4px;}
.mobile-menu-item.active{background:#F5F5F5;color:#1A1714;font-weight:500;}
.mobile-menu-item-disabled{opacity:0.4;pointer-events:none;}

@media(max-width:768px){
  .sidebar{display:none!important;}
  .page-content{margin-left:0!important;}
  .topbar{padding:0 16px;position:sticky;top:0;z-index:50;}
  .mobile-header{display:flex;align-items:center;gap:12px;}
  main{padding:16px 12px 40px;}
  .metrics{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .metric-card{padding:14px 12px;}
  .metric-value{font-size:15px;}
  .chart-card{padding:16px 12px;margin-bottom:16px;}
  .platforms{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .plat-card{padding:12px 10px;}
  .plat-val{font-size:13px;}
  .table-card{overflow-x:auto;}
  table{font-size:12px;}
  thead th{padding:8px 8px;font-size:10px;}
  tbody td{padding:8px 8px;}
  .sec-head{margin-bottom:10px;}
  .input-card{padding:16px 12px;}
  .form-grid{grid-template-columns:1fr 1fr;gap:8px;}
  .cal-cell{min-height:52px;padding:4px;}
  .cal-sales{font-size:10px;}
  .cal-net{font-size:9px;}
  .wh-stock{font-size:10px;padding:2px 5px;}
  .badge{font-size:10px;padding:2px 6px;}
  .toolbar{flex-wrap:wrap;gap:6px;}
  .search-input{width:100%;}
  .modal{padding:20px 16px;margin:12px;}
  .inv-parties{grid-template-columns:1fr;gap:16px;padding:16px;}
  .inv-bank-grid{grid-template-columns:1fr;}
  .inv-terms{grid-template-columns:1fr;gap:16px;}
  .inv-signatures{grid-template-columns:1fr;gap:20px;}
  .invoice-paper{padding:28px 18px;}
  .editor-wrap{padding:12px 10px 40px;}
  .editor-toolbar{flex-wrap:wrap;gap:6px;}
  .btn{font-size:11px;padding:6px 10px;}
  .lang-btn{font-size:11px;padding:5px 8px;}
  .topbar-title{display:none;}
}
</style>
</head>

async function sbFetch(path, opts={}) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    ...opts,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || 'return=minimal',
      ...opts.headers
    }
  });
  if (!res.ok) throw new Error(await res.text());
  const text = await res.text();
  if (!text || text.trim() === '') return null;
  try { return JSON.parse(text); } catch(e) { return null; }
}

}

function getFiltered(){
  if(platFilter==='전체') return records;
  return records.filter(r=>r.platform===platFilter);
}

async function loadData() {
  try {
    // Supabase 1000건 제한 해제 - 페이지네이션으로 전체 로드
    let all = [];
    let from = 0;
    const size = 1000;
    while(true) {
      const batch = await sbFetch('sales?select=*&order=date.asc', {
        headers: {'Range': `${from}-${from+size-1}`, 'Range-Unit': 'items'}
      }) || [];
      all = all.concat(batch);
      if(batch.length < size) break;
      from += size;
    }
    records = all;
    render();
  } catch(e) { showToast('데이터 불러오기 실패: ' + e.message); }
}

function fmt(n) { return '₩' + Math.round(n).toLocaleString(); }
function fmtK(n) { return n>=1000000 ? '₩'+(n/1000000).toFixed(1)+'M' : fmt(n); }
function num(v) { return Number(v)||0; }

function getAgg() {
  const map = {};
  getFiltered().forEach(r => {
    const key = currentView==='monthly' ? String(r.date).slice(0,7) : String(r.date);
    if(!map[key]) map[key] = {date:key, original_sales:0, coupon:0, net_sales:0, orders:0};
    map[key].original_sales += num(r.original_sales);
    map[key].coupon += num(r.coupon);
    map[key].net_sales += num(r.net_sales);
    map[key].orders += num(r.orders)||1;
  });
  return Object.values(map).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}

function getSrc() {
  const filtered = getFiltered();
  if(currentView==='calendar') {
    const prefix = calYear+'-'+String(calMonth+1).padStart(2,'0');
    return filtered.filter(r=>String(r.date).startsWith(prefix));
  }
  return filtered;
}

function renderMetrics() {
  const src = getSrc();
  const ts = src.reduce((s,r)=>s+num(r.original_sales),0);
  const tc = src.reduce((s,r)=>s+num(r.coupon),0);
  const tn = src.reduce((s,r)=>s+num(r.net_sales),0);
  const to = src.reduce((s,r)=>s+(num(r.orders)||1),0);
  document.getElementById('metrics').innerHTML=[
    {label:'총 판매액', value:fmt(ts), highlight:false},
    {label:'쿠폰 할인', value:fmt(tc), sub:'할인율 '+(ts>0?Math.round(tc/ts*100):0)+'%', highlight:false},
    {label:'실 판매액', value:fmt(tn), highlight:true},
    {label:'총 주문', value:to+'건', highlight:false},
  ].map(c=>`<div class="metric-card${c.highlight?' highlight':''}"><div class="metric-label">${c.label}</div><div class="metric-value">${c.value}</div>${c.sub?`<div class="metric-sub">${c.sub}</div>`:''}</div>`).join('');
}

function renderChart() {
  const ctx = document.getElementById('mainChart').getContext('2d');
  if(chartInstance){chartInstance.destroy();chartInstance=null;}
  const agg = getAgg();
  chartInstance = new Chart(ctx, {
    type:'bar',
    data:{
      labels: agg.map(r=>currentView==='monthly'?r.date:String(r.date).slice(5)),
      datasets:[
        {label:'판매액', data:agg.map(r=>r.original_sales), backgroundColor:'rgba(26,23,20,0.13)', borderRadius:3},
        {label:'실 판매액', data:agg.map(r=>r.net_sales), backgroundColor:'rgba(26,23,20,0.62)', borderRadius:3}
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmt(c.raw)}}},
      scales:{
        x:{ticks:{color:'#A09A94',font:{size:11},autoSkip:true,maxRotation:0},grid:{display:false},border:{display:false}},
        y:{ticks:{color:'#A09A94',font:{size:11},callback:v=>fmtK(v)},grid:{color:'rgba(0,0,0,0.05)'},border:{display:false}}
      }
    }
  });
}

function renderCalendar() {
  const DAYS=['일','월','화','수','목','금','토'];
  document.getElementById('calDayNames').innerHTML=DAYS.map(d=>`<div class="cal-day-name">${d}</div>`).join('');
  document.getElementById('calMonthLabel').textContent=calYear+'년 '+(calMonth+1)+'월';
  const prefix=calYear+'-'+String(calMonth+1).padStart(2,'0');

  // 이번달 데이터
  const dayMap={};
  getFiltered().filter(r=>String(r.date).startsWith(prefix)).forEach(r=>{
    const day=String(r.date).slice(8,10);
    if(!dayMap[day])dayMap[day]={original_sales:0,net_sales:0};
    dayMap[day].original_sales+=num(r.original_sales);
    dayMap[day].net_sales+=num(r.net_sales);
  });

  // 전달 데이터
  let prevYear=calYear, prevMonth=calMonth-1;
  if(prevMonth<0){prevMonth=11;prevYear--;}
  const prevPrefix=prevYear+'-'+String(prevMonth+1).padStart(2,'0');
  const prevDayMap={};
  records.filter(r=>String(r.date).startsWith(prevPrefix)).forEach(r=>{
    const day=String(r.date).slice(8,10);
    if(!prevDayMap[day])prevDayMap[day]={original_sales:0,net_sales:0};
    prevDayMap[day].original_sales+=num(r.original_sales);
    prevDayMap[day].net_sales+=num(r.net_sales);
  });

  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const todayStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');

  let cells='';
  for(let i=0;i<firstDay;i++) cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds=String(d).padStart(2,'0');
    const fd=prefix+'-'+ds;
    const data=dayMap[ds];
    const prevData=prevDayMap[ds];
    const isToday=fd===todayStr;
    const hasData=!!data;

    let compareHtml='';
    if(data&&prevData){
      const diff=data.original_sales-prevData.original_sales;
      const pct=prevData.original_sales>0?Math.round(diff/prevData.original_sales*100):0;
      const arrow=diff>=0?'▲':'▼';
      compareHtml=`<div class="cal-compare" style="color:var(--danger)">${arrow} ${Math.abs(pct)}%</div>`;
    }

    cells+=`<div class="cal-cell${isToday?' today':''}${hasData?' has-data':''}" onclick="openDayDetail('${fd}')">
      <div class="cal-date">${d}</div>
      ${data?`<div class="cal-sales">${fmtK(data.original_sales)}</div><div class="cal-net">실 ${fmtK(data.net_sales)}</div>${compareHtml}`:''}
    </div>`;
  }
  document.getElementById('calCells').innerHTML=cells;
  renderMetrics();
}

function openDayDetail(date) {
  const dayRecords = records.filter(r=>String(r.date)===date);
  if(dayRecords.length===0) return;

  const totalSales = dayRecords.reduce((s,r)=>s+num(r.original_sales),0);
  const totalCoupon = dayRecords.reduce((s,r)=>s+num(r.coupon),0);
  const totalNet = dayRecords.reduce((s,r)=>s+num(r.net_sales),0);
  const totalOrders = dayRecords.reduce((s,r)=>s+(num(r.orders)||1),0);

  // 전달 같은 날 비교
  const prevDate = (() => {
    const d = new Date(date);
    d.setMonth(d.getMonth()-1);
    return d.toISOString().slice(0,10);
  })();
  const prevRecords = records.filter(r=>String(r.date)===prevDate);
  const prevSales = prevRecords.reduce((s,r)=>s+num(r.original_sales),0);
  const diffPct = prevSales>0 ? Math.round((totalSales-prevSales)/prevSales*100) : null;

  let compareStr = '';
  if(diffPct!==null){
    const arrow=diffPct>=0?'▲':'▼';
    compareStr=`<span style="font-size:12px;color:var(--danger)">${arrow} 전달 대비 ${Math.abs(diffPct)}%</span>`;
  }

  document.getElementById('calDetailTitle').innerHTML=`${date} ${compareStr}`;
  document.getElementById('calDetailBody').innerHTML=`
    <div class="cal-detail-row"><span style="color:var(--text-3)">판매액</span><strong>${fmt(totalSales)}</strong></div>
    <div class="cal-detail-row"><span style="color:var(--text-3)">쿠폰할인</span><span style="color:var(--danger)">−${fmt(totalCoupon)}</span></div>
    <div class="cal-detail-row"><span style="color:var(--text-3)">실 판매액</span><strong style="color:var(--success)">${fmt(totalNet)}</strong></div>
    <div class="cal-detail-row"><span style="color:var(--text-3)">주문 건수</span><span>${totalOrders}건</span></div>
    ${prevSales>0?`<div class="cal-detail-row"><span style="color:var(--text-3)">전달 같은 날</span><span>${fmt(prevSales)}</span></div>`:''}
  `;
  document.getElementById('calDetailOverlay').classList.add('open');
}

function moveMonth(dir){
  calMonth+=dir;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  renderCalendar();
  renderTable();
}

function renderPlatforms(){
  const pmap={};
  getFiltered().forEach(r=>{
    if(!pmap[r.platform])pmap[r.platform]={original_sales:0,net_sales:0,coupon:0};
    pmap[r.platform].original_sales+=num(r.original_sales);
    pmap[r.platform].net_sales+=num(r.net_sales);
    pmap[r.platform].coupon+=num(r.coupon);
  });
  const total=Object.values(pmap).reduce((s,v)=>s+v.original_sales,0)||1;
  document.getElementById('platforms').innerHTML=Object.entries(pmap).sort((a,b)=>b[1].original_sales-a[1].original_sales).map(([name,v])=>`
    <div class="plat-card"><div class="plat-name">${name}</div><div class="plat-val">${fmt(v.original_sales)}</div><div class="plat-net">실 ${fmt(v.net_sales)}</div><div class="plat-bar"><div class="plat-fill" style="width:${Math.round(v.original_sales/total*100)}%"></div></div></div>`).join('');
}

function renderTable(){
  const agg=getAgg();
  if(currentView==='monthly'){
    document.getElementById('tableHead').innerHTML='<th>월</th><th class="num">판매액</th><th class="num">쿠폰할인</th><th class="num">실 판매액</th><th class="num">주문</th><th></th>';
    document.getElementById('tableBody').innerHTML=agg.map(r=>`<tr>
      <td>${r.date}</td>
      <td class="num">${fmt(r.original_sales)}</td>
      <td class="num neg">−${fmt(r.coupon)}</td>
      <td class="num pos">${fmt(r.net_sales)}</td>
      <td class="num">${r.orders}건</td>
      <td><button onclick="deleteMonth('${r.date}')" style="font-family:'Noto Sans KR',sans-serif;font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid rgba(140,58,42,0.3);background:transparent;color:var(--danger);cursor:pointer;">삭제</button></td>
    </tr>`).join('')||'<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--text-3)">데이터가 없습니다</td></tr>';
  } else {
    document.getElementById('tableHead').innerHTML='<th>날짜</th><th>플랫폼</th><th class="num">판매액</th><th class="num">쿠폰할인</th><th class="num">실 판매액</th>';
    const src=getSrc();
    // 날짜별로 그룹핑
    const groups={};
    src.slice().reverse().forEach(r=>{
      if(!groups[r.date])groups[r.date]=[];
      groups[r.date].push(r);
    });
    let html='';
    Object.entries(groups).forEach(([date,rows])=>{
      const totalSales=rows.reduce((s,r)=>s+num(r.original_sales),0);
      const totalCoupon=rows.reduce((s,r)=>s+num(r.coupon),0);
      const totalNet=rows.reduce((s,r)=>s+num(r.net_sales),0);
      const id='grp-'+date.replace(/-/g,'');
      // 날짜 요약 행
      html+=`<tr style="background:var(--surface2);cursor:pointer;" onclick="toggleGroup('${id}')">
        <td style="font-weight:500">${date} <span id="${id}-icon" style="font-size:11px;color:var(--text-3)">▼ ${rows.length}건</span></td>
        <td style="font-size:11px;color:var(--text-3)">29CM</td>
        <td class="num" style="font-weight:500">${fmt(totalSales)}</td>
        <td class="num neg">−${fmt(totalCoupon)}</td>
        <td class="num pos" style="font-weight:500">${fmt(totalNet)}</td>
      </tr>`;
      // 상세 행들 (숨김 처리를 tr에 직접)
      rows.forEach((r,i)=>{
        html+=`<tr class="detail-${id}" style="display:none;background:var(--bg);">
          <td style="padding-left:24px;color:var(--text-3);font-size:12px;">${r.date}</td>
          <td style="font-size:12px;color:var(--text-3)">${r.platform}</td>
          <td class="num" style="font-size:12px;">${fmt(num(r.original_sales))}</td>
          <td class="num neg" style="font-size:12px;">−${fmt(num(r.coupon))}</td>
          <td class="num pos" style="font-size:12px;">${fmt(num(r.net_sales))}</td>
        </tr>`;
      });
    });
    document.getElementById('tableBody').innerHTML=html||'<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--text-3)">데이터가 없습니다</td></tr>';
  }
}

function toggleGroup(id){
  const rows=document.querySelectorAll('.detail-'+id);
  const icon=document.getElementById(id+'-icon');
  if(!rows.length)return;
  const isHidden=rows[0].style.display==='none';
  rows.forEach(r=>r.style.display=isHidden?'':'none');
  icon.textContent=isHidden?`▲ ${rows.length}건`:`▼ ${rows.length}건`;
}

function setView(view,btn){
  currentView=view;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('chartSection').style.display=view==='calendar'?'none':'block';
  document.getElementById('calSection').style.display=view==='calendar'?'block':'none';
  render();
}

async function addManual(){
  const date=document.getElementById('inp-date').value;
  const platform=document.getElementById('inp-platform').value;
  const original_sales=parseInt(document.getElementById('inp-sales').value)||0;
  const coupon=parseInt(document.getElementById('inp-coupon').value)||0;
  const net_sales=original_sales-coupon;
  const orders=parseInt(document.getElementById('inp-orders').value)||1;
  if(!date||!original_sales){showToast('날짜와 판매액을 입력해주세요');return;}
  try{
    await sbFetch('sales',{method:'POST',body:JSON.stringify({date,platform,original_sales,coupon,net_sales,orders})});
    ['inp-sales','inp-coupon','inp-orders'].forEach(id=>document.getElementById(id).value='');
    await loadData();
    showToast('저장되었습니다 ✓');
  }catch(e){showToast('저장 실패: '+e.message);}
}

async function deleteMonth(yearMonth){
  if(!confirm(`${yearMonth} 데이터를 전부 삭제할까요?`))return;
  try{
    const from=yearMonth+'-01';
    const toDate=new Date(yearMonth.slice(0,4),parseInt(yearMonth.slice(5,7)),0);
    const to=yearMonth+'-'+String(toDate.getDate()).padStart(2,'0');
    await sbFetch(`sales?date=gte.${from}&date=lte.${to}`,{method:'DELETE'});
    await loadData();
    showToast(`${yearMonth} 데이터가 삭제되었습니다`);
  }catch(e){showToast('삭제 실패: '+e.message);}
}

let previewRows=[], selectedPlatform='29CM';

function selectPlat(name,btn){
  selectedPlatform=name;
  document.querySelectorAll('.plat-select-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(previewRows.length>0) previewRows.forEach(r=>r.platform=name);
}

function handleFile(file){
  if(!file)return;
  const resultEl=document.getElementById('uploadResult');
  resultEl.textContent='파일 분석 중...';
  previewRows=[];
  const isExcel=file.name.match(/\.xlsx?$/i);
  if(isExcel){
    const reader=new FileReader();
    reader.onload=(e)=>{
      try{
        const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});
        parseRows(rows);
      }catch(err){resultEl.textContent='엑셀 파일을 읽을 수 없습니다.';console.error(err);}
    };
    reader.readAsArrayBuffer(file);
  }else{
    Papa.parse(file,{header:true,skipEmptyLines:true,complete:(res)=>{parseRows(res.data);}});
  }
}

function parseRows(rows){
  let skipped=0; previewRows=[];
  rows.forEach(row=>{
    // 무신사 형식 감지 (입금일자 컬럼 존재)
    if(row['입금일자']!==undefined) {
      const rawDate=String(row['입금일자']||'');
      if(!rawDate||rawDate==='평균'||rawDate==='입금일자')return;
      // 날짜 변환 (20260101 → 2026-01-01)
      const dateStr=rawDate.toString().replace(/[^0-9]/g,'');
      if(dateStr.length!==8)return;
      const date=dateStr.slice(0,4)+'-'+dateStr.slice(4,6)+'-'+dateStr.slice(6,8);
      const original_sales=parseFloat(String(row['결제금액+적립금']||'0').replace(/[,\s]/g,''))||0;
      const net_sales=parseFloat(String(row['결제금액']||'0').replace(/[,\s]/g,''))||0;
      const coupon=Math.max(0,original_sales-net_sales);
      if(net_sales>0)previewRows.push({date,platform:selectedPlatform,original_sales:Math.round(original_sales),coupon:Math.round(coupon),net_sales:Math.round(net_sales),orders:1});
      return;
    }
    // 29CM 형식
    const status=String(row['주문상태']||row['상태']||'');
    if(status.includes('취소')||status.includes('반품')){skipped++;return;}
    const rawDate=String(row['주문일시']||row['주문일']||row['날짜']||'');
    const date=rawDate.slice(0,10);
    if(!date||date.length<10)return;
    const original_sales=parseFloat(String(row['판매액']||'0').replace(/[,₩\s]/g,''))||0;
    const coupon=parseFloat(String(row['쿠폰 할인']||row['쿠폰할인']||'0').replace(/[,₩\s]/g,''))||0;
    const netSales=parseFloat(String(row['실 판매액']||row['실판매액']||'0').replace(/[,₩\s]/g,''))||0;
    const shipping=parseFloat(String(row['배송비']||'0').replace(/[,₩\s]/g,''))||0;
    const islandShip=parseFloat(String(row['도서산간 배송비']||'0').replace(/[,₩\s]/g,''))||0;
    const net_sales=netSales+shipping+islandShip;
    if(net_sales>0)previewRows.push({date,platform:selectedPlatform,original_sales:Math.round(original_sales),coupon:Math.round(coupon),net_sales:Math.round(net_sales),orders:1});
  });
  const resultEl=document.getElementById('uploadResult');
  if(previewRows.length===0){resultEl.innerHTML='<span style="color:var(--danger)">인식된 데이터가 없습니다.</span>';return;}
  const preview={};
  previewRows.forEach(r=>{if(!preview[r.date])preview[r.date]={original_sales:0,net_sales:0,count:0};preview[r.date].original_sales+=r.original_sales;preview[r.date].net_sales+=r.net_sales;preview[r.date].count++;});
  const previewDates=Object.keys(preview).sort();
  const previewHtml=previewDates.slice(0,5).map(d=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;"><span style="color:var(--text-2)">${d}</span><span>${preview[d].count}건 · <strong>${fmt(preview[d].original_sales)}</strong> (실 ${fmt(preview[d].net_sales)})</span></div>`).join('');
  const moreText=previewDates.length>5?`<div style="font-size:11px;color:var(--text-3);margin-top:6px;">외 ${previewDates.length-5}일 더...</div>`:'';
  resultEl.innerHTML=`
    <div style="margin-bottom:10px;font-size:13px;color:var(--text-2)"><strong style="color:var(--text)">${previewRows.length}건</strong> 인식됨 · ${skipped>0?`<span style="color:var(--danger)">${skipped}건 제외(취소/반품)</span>`:'취소 없음'}</div>
    <div style="background:var(--surface2);border-radius:8px;padding:10px 14px;margin-bottom:12px;">${previewHtml}${moreText}</div>
    <button class="btn-primary" id="confirmBtn" onclick="confirmUpload()" style="width:100%;">✓ 이 데이터로 저장하기</button>`;
}

async function confirmUpload(){
  if(previewRows.length===0)return;
  const btn=document.getElementById('confirmBtn');
  const total=previewRows.length;
  btn.disabled=true;
  try{
    const chunkSize=100;
    let saved=0;
    for(let i=0;i<total;i+=chunkSize){
      const chunk=previewRows.slice(i,i+chunkSize);
      await sbFetch('sales',{method:'POST',body:JSON.stringify(chunk)});
      saved+=chunk.length;
      btn.textContent=`저장 중... ${saved}/${total}건`;
    }
    document.getElementById('uploadResult').innerHTML=`<span style="color:var(--success)">✓ ${total}건이 모두 저장되었습니다</span>`;
    previewRows=[];
    await loadData();
    showToast(total+'건 저장 완료 ✓');
  }catch(e){
    btn.textContent='✓ 이 데이터로 저장하기';btn.disabled=false;
    showToast('저장 실패: '+e.message);
  }
}

function handleDrop(e){e.preventDefault();handleFile(e.dataTransfer.files[0]);}
function switchTab(name,btn){document.querySelectorAll('.input-tab').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.input-panel').forEach(p=>p.classList.remove('active'));btn.classList.add('active');document.getElementById('panel-'+name).classList.add('active');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function render(){renderMetrics();if(currentView==='calendar')renderCalendar();else renderChart();renderPlatforms();renderTable();}
document.getElementById('inp-date').value=new Date().toISOString().slice(0,10);
loadData();
</script>
