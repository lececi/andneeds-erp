<meta charset="UTF-8">

<title>Influencer CRM (app)</title>

<style>
@font-face{font-family:"HelveticaLight";src:url("HelveticaLight.ttf") format("truetype");font-display:swap;}
:root{--ink:#1A1714;--mut:#6B6560;--mut2:#A09A94;--line:rgba(0,0,0,0.11);--bg:#FFFFFF;--card:#F6F5F3;--hover:#F0EEEA;--dark:#2E2E2E;--blue:#245a9c;--green:#4E7D5B;--amber:#A9885E;--red:#B04A3C;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
body{font-family:"Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:13px;}
.en{font-family:"HelveticaLight","Helvetica Neue",Helvetica,Arial,sans-serif;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:12.5px;color:var(--ink);}
a{color:inherit;}
.wrap{padding:26px 30px 60px;}
/* header */
.hd{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0;margin-bottom:22px;}
.hd-title{padding-bottom:14px;}
.eyebrow{font-size:10.5px;letter-spacing:.18em;color:var(--mut2);text-transform:uppercase;}
.h1{font-size:24px;letter-spacing:.01em;margin-top:4px;font-weight:300;}
.tabs{display:flex;gap:26px;margin-left:34px;}
.tab{background:none;border:none;padding:0 0 14px;font-size:13.5px;letter-spacing:.06em;color:var(--mut2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.on{color:var(--ink);border-bottom-color:var(--ink);}
.hd-right{margin-left:auto;display:flex;gap:8px;padding-bottom:12px;align-items:center;}
.sync{font-size:11px;color:var(--mut2);margin-right:6px;}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font-size:12.5px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn:hover{border-color:var(--mut2);}
.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff;}
.btn.dark:hover{background:#1A1A1A;}
.btn.sm{padding:5px 10px;font-size:11.5px;border-radius:7px;}
.btn.ghost{border-color:transparent;background:none;color:var(--mut);}
.btn.ghost:hover{background:var(--hover);}
.btn.danger{color:var(--red);}
/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;margin-bottom:20px;overflow:hidden;}
.kpi{padding:14px 18px;border-right:1px solid var(--line);}
.kpi:last-child{border-right:none;}
.kpi .kl{font-size:10.5px;letter-spacing:.14em;color:var(--mut2);text-transform:uppercase;}
.kpi .kv{font-size:22px;margin-top:6px;font-weight:300;}
.kpi .ks{font-size:11px;color:var(--mut);margin-top:3px;}
.kpi.clk{cursor:pointer;} .kpi.clk:hover{background:var(--card);}
/* filters */
.fbar{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:320px;flex:0 1 420px;color:var(--mut2);}
.search input{border:none;outline:none;background:none;flex:1;font-size:12.5px;}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:11.5px;letter-spacing:.06em;cursor:pointer;color:var(--mut);}
.chip:hover{border-color:var(--mut2);}
.chip.on{background:var(--dark);border-color:var(--dark);color:#fff;}
.chip .n{opacity:.6;margin-left:4px;}
.sel{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font-size:12px;color:var(--ink);cursor:pointer;outline:none;}
.sel.on{border-color:var(--ink);}
.fsep{width:1px;height:20px;background:var(--line);margin:0 4px;}
.tagsugg{display:flex;gap:6px;flex-wrap:wrap;}
.tg{font-size:11.5px;color:var(--mut);cursor:pointer;padding:2px 2px;}
.tg:hover,.tg.on{color:var(--blue);}
.rescount{font-size:11.5px;color:var(--mut2);margin-left:auto;}
/* grid */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;}
@media(max-width:1180px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));}.kpis{grid-template-columns:repeat(2,1fr);}.kpi:nth-child(2){border-right:none;}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line);}}
@media(max-width:760px){.grid{grid-template-columns:1fr;}.wrap{padding:18px 16px 50px;}.search{min-width:0;flex:1 1 100%;}.tabs{margin-left:0;}}
.card{border:1px solid var(--line);border-radius:14px;padding:18px;background:#fff;cursor:pointer;transition:box-shadow .2s,border-color .2s;display:flex;flex-direction:column;}
.card:hover{border-color:rgba(0,0,0,.2);box-shadow:0 6px 22px rgba(0,0,0,.05);}
.ch{display:flex;gap:12px;align-items:center;}
.av{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--card);flex:none;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--mut);overflow:hidden;}
.av img{width:100%;height:100%;object-fit:cover;}
.cinfo{flex:1;min-width:0;}
.cname{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px;}
.cname span.nm{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cid{font-size:11.5px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cmeta{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11.5px;color:var(--mut);}
.pic{width:15px;height:15px;flex:none;display:inline-block;}
.fit{border:1px solid var(--line);border-radius:10px;width:66px;padding:7px 0 6px;text-align:center;flex:none;}
.fit .g{font-size:22px;line-height:1.05;}
.fit .gl{font-size:9px;letter-spacing:.12em;color:var(--mut2);margin-top:2px;}
.fit.A .g{color:var(--ink);} .fit.B .g{color:#6B6560;} .fit.C .g{color:#B8B2AC;} .fit.none .g{color:#D0CBC5;}
.rel{font-size:9.5px;letter-spacing:.12em;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--mut);font-weight:500;flex:none;}
.rel.VIP{background:var(--dark);color:#fff;border-color:var(--dark);}
.rel.FRIEND{border-color:var(--blue);color:var(--blue);}
.rel.PAID{border-color:var(--amber);color:var(--amber);}
.rel.SEEDING{border-color:var(--green);color:var(--green);}
.cbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 14px;}
.cbtns .btn{justify-content:center;padding:9px 0;}
.save.on{color:var(--red);}
.save.on svg{fill:var(--red);stroke:var(--red);}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.imgs .im{aspect-ratio:1/1;border-radius:6px;background:var(--card);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mut2);font-size:11px;}
.imgs .im img{width:100%;height:100%;object-fit:cover;display:block;}
.csum{margin-top:12px;font-size:11.5px;color:var(--mut);}
.csum b{font-weight:500;color:var(--ink);}
.crecent{margin-top:3px;font-size:11px;color:var(--mut2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.new{color:var(--blue);font-weight:500;}
.empty{border:1px dashed var(--line);border-radius:14px;padding:60px 20px;text-align:center;color:var(--mut2);grid-column:1/-1;}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(20,18,16,.28);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;}
.ov.on{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:#fff;z-index:41;transform:translateX(102%);transition:transform .28s cubic-bezier(.22,.61,.36,1);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.08);}
.drawer.on{transform:none;}
.dh{padding:22px 26px 18px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:flex-start;}
.dh .av{width:72px;height:72px;}
.dhx{border:none;background:none;font-size:20px;cursor:pointer;color:var(--mut);margin-left:auto;line-height:1;padding:2px 4px;}
.dbody{flex:1;overflow-y:auto;padding:4px 26px 40px;}
.sec{padding:20px 0;border-bottom:1px solid var(--line);}
.sec:last-child{border-bottom:none;}
.st{font-size:10.5px;letter-spacing:.18em;color:var(--mut2);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.st .btn{margin-left:auto;letter-spacing:0;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;}
.fg .full{grid-column:1/-1;}
.fl{font-size:11px;color:var(--mut);margin-bottom:4px;display:block;}
.in{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 10px;outline:none;background:#fff;}
.in:focus{border-color:var(--ink);}
textarea.in{min-height:74px;resize:vertical;line-height:1.55;}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap;}
.seg button{flex:1;border:none;background:#fff;padding:7px 8px;font-size:11.5px;letter-spacing:.06em;cursor:pointer;color:var(--mut);border-right:1px solid var(--line);}
.seg button:last-child{border-right:none;}
.seg button.on{background:var(--dark);color:#fff;}
.hist{display:flex;flex-direction:column;}
.hrow{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.06);cursor:pointer;}
.hrow:hover{background:var(--card);margin:0 -8px;padding:10px 8px;}
.hrow:last-child{border-bottom:none;}
.hd8{font-size:12px;color:var(--mut);}
.htx{font-size:12.5px;min-width:0;}
.htx .sub{font-size:11px;color:var(--mut2);margin-top:2px;}
.typ{font-size:9.5px;letter-spacing:.1em;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:6px;}
.perf{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.pc{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
.pc:nth-child(3n){border-right:none;}
.pc:nth-last-child(-n+3){border-bottom:none;}
.pc .pl{font-size:10.5px;color:var(--mut2);}
.pc .pv{font-size:17px;margin-top:4px;font-weight:300;}
.muted{color:var(--mut2);}
.media{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.mslot{aspect-ratio:4/5;border:1px dashed var(--line);border-radius:7px;background:var(--card);overflow:hidden;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--mut2);text-align:center;}
.mslot.avs{border-radius:50%;aspect-ratio:1;align-self:start;}
.mslot img{width:100%;height:100%;object-fit:cover;}
.mslot .mx{position:absolute;top:3px;right:3px;background:rgba(255,255,255,.9);border:none;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;display:none;line-height:18px;}
.mslot:hover .mx{display:block;}
.hint{font-size:11px;color:var(--mut2);margin-top:6px;line-height:1.5;}
.dfoot{padding:14px 26px;border-top:1px solid var(--line);display:flex;gap:8px;}
/* modal */
.mo{position:fixed;inset:0;background:rgba(20,18,16,.32);z-index:60;display:none;align-items:center;justify-content:center;padding:20px;}
.mo.on{display:flex;}
.mbox{background:#fff;border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.18);}
.mbox.wide{width:min(720px,100%);}
.mh{padding:20px 24px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);}
.mh .av{width:38px;height:38px;}
.mt{font-size:16px;font-weight:600;}
.mb{padding:18px 24px;overflow-y:auto;}
.mf{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center;}
.flow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
.flow button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:11.5px;cursor:pointer;color:var(--mut);}
.flow button.done{background:var(--card);color:var(--ink);}
.flow button.on{background:var(--dark);border-color:var(--dark);color:#fff;}
.flow .ar{color:var(--mut2);font-size:10px;}
.flow button.decl.on{background:var(--red);border-color:var(--red);}
/* status pill */
.sp{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;background:var(--card);color:var(--mut);white-space:nowrap;}
.sp.s0{background:#F3F2F0;color:var(--mut2);}
.sp.s1{background:#EEF1F5;color:#4A5B70;}
.sp.s2{background:#E8EEF7;color:var(--blue);}
.sp.s3,.sp.s4{background:#F6F0E6;color:#8A6A3E;}
.sp.s5{background:#E9F1EB;color:var(--green);}

/* seeding */
.sd{display:grid;grid-template-columns:230px 1fr;gap:26px;}
@media(max-width:900px){.sd{grid-template-columns:1fr;}}
.clist{display:flex;flex-direction:column;gap:2px;}
.ci{padding:10px 12px;border-radius:9px;cursor:pointer;}
.ci:hover{background:var(--hover);}
.ci.on{background:var(--card);}
.ci .cn{font-size:13px;font-weight:500;letter-spacing:.02em;}
.ci .cs{font-size:11px;color:var(--mut2);margin-top:3px;}
.ci .bar{height:3px;background:rgba(0,0,0,.06);border-radius:2px;margin-top:7px;overflow:hidden;}
.ci .bar i{display:block;height:100%;background:var(--dark);}
.chd{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.ctitle{font-size:20px;font-weight:300;letter-spacing:.03em;border:1px solid transparent;border-radius:7px;padding:3px 6px;margin-left:-7px;outline:none;min-width:200px;background:none;}
.ctitle:hover{border-color:var(--line);} .ctitle:focus{border-color:var(--ink);}
.skpi{display:flex;border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden;flex-wrap:wrap;}
.skpi div{flex:1;padding:12px 16px;border-right:1px solid var(--line);min-width:110px;}
.skpi div:last-child{border-right:none;}
.skpi .kl{font-size:10.5px;color:var(--mut2);letter-spacing:.1em;}
.skpi .kv{font-size:20px;font-weight:300;margin-top:4px;}
.skpi .kv small{font-size:12px;color:var(--mut);margin-left:2px;}
.tw{border:1px solid var(--line);border-radius:12px;overflow-x:auto;}
table{border-collapse:collapse;width:100%;min-width:1080px;}
th{font-size:10.5px;letter-spacing:.1em;color:var(--mut2);font-weight:500;text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);background:#FCFBFA;white-space:nowrap;}
td{padding:7px 10px;border-bottom:1px solid rgba(0,0,0,.06);vertical-align:middle;font-size:12.5px;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#FCFBFA;}
.tin{border:1px solid transparent;border-radius:6px;padding:5px 7px;width:100%;outline:none;background:none;font-size:12.5px;}
.tin:hover{border-color:var(--line);} .tin:focus{border-color:var(--ink);background:#fff;}
.who{display:flex;align-items:center;gap:9px;cursor:pointer;min-width:150px;}

.stp{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(0,0,0,.18);background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:12px;}
.stp.on{background:var(--dark);border-color:var(--dark);}
.stp:hover{border-color:var(--ink);}
.stp-d{font-size:10px;color:var(--mut2);margin-top:2px;white-space:nowrap;}
.tc{text-align:center;}
.ssel{border:none;background:none;outline:none;cursor:pointer;font-size:11px;padding:3px 6px;border-radius:999px;appearance:none;-webkit-appearance:none;text-align:center;}
.lnk{display:flex;align-items:center;gap:4px;}
.lnk a{color:var(--blue);font-size:12px;flex:none;text-decoration:none;}
.rx{border:none;background:none;color:var(--mut2);cursor:pointer;font-size:15px;padding:2px 6px;border-radius:5px;}
.rx:hover{color:var(--red);background:var(--hover);}
.pick{display:flex;flex-direction:column;max-height:46vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px;}
.prow{display:grid;grid-template-columns:22px 34px 1fr auto auto auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid rgba(0,0,0,.06);cursor:pointer;font-size:12px;}
.prow:hover{background:var(--card);}
.prow:last-child{border-bottom:none;}
.prow .av{width:34px;height:34px;font-size:12px;}
.prow.dis{opacity:.4;pointer-events:none;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;padding:10px 18px;border-radius:9px;font-size:12.5px;opacity:0;transition:all .25s;z-index:80;pointer-events:none;}
.toast.on{opacity:1;transform:translateX(-50%);}
</style>

/* BRAND FIT — 지금은 관리자가 수동 설정(A/B/C). 자동 계산을 붙일 때는
   brandFit.mode="auto" 로 두고 computeAutoFit()에서 score/factors를 채우면 된다. */
function computeAutoFit(inf){return null;} /* TODO: 스타일 태그·업로드율·반응 등 가중치로 score(0~100) 산출 → 등급 매핑 */

function collabsOf(id){return state.collabs.filter(function(c){return c.influencerId===id;}).sort(function(a,b){return (b.proposedAt||"").localeCompare(a.proposedAt||"");});}

  var cs=collabsOf(id),seed=0,shipped=0,up=0,cost=0,rev=0,revTracked=false,active=0;
  cs.forEach(function(c){var i=stageIdx(c.status);if(c.type==="SEEDING")seed++;if(i>=3)shipped++;if(i>=5)up++;if(i>=0&&i<6)active++;cost+=num(c.cost);if(c.revenue!==""&&c.revenue!=null&&num(c.revenue)>0){rev+=num(c.revenue);revTracked=true;}});
  return {list:cs,total:cs.length,seed:seed,shipped:shipped,up:up,rate:shipped?up/shipped:null,cost:cost,rev:rev,revTracked:revTracked,active:active,latest:cs[0]||null};

function filtered(){
  var q=ui.q.trim().toLowerCase(),words=q.split(/\s+/).filter(Boolean);
  var tagW=words.filter(function(w){return w.charAt(0)==="#";}),txtW=words.filter(function(w){return w.charAt(0)!=="#";});
  var list=state.influencers.filter(function(inf){
    var s=statsOf(inf.id);inf._s=s;
    if(ui.rel!=="ALL"&&inf.relation!==ui.rel)return false;
    if(ui.saved&&!inf.saved)return false;
    if(ui.fit&&fitOf(inf)!==ui.fit)return false;
    if(ui.fol&&folBucket(mainFollowers(inf))!==ui.fol)return false;
    if(ui.plat&&platformsOf(inf).indexOf(ui.plat)<0)return false;
    if(ui.style&&(inf.styles||[]).indexOf(ui.style)<0)return false;
    if(ui.hist==="yes"&&!s.total)return false;
    if(ui.hist==="no"&&s.total)return false;
    if(ui.hist==="active"&&!s.active)return false;
    if(ui.hist==="waiting"&&!s.list.some(function(c){var i=stageIdx(c.status);return i===3||i===4;}))return false;
    if(ui.rate){var r=s.rate;if(ui.rate==="none"?r!=null:(r==null||(ui.rate==="hi"&&r<.8)||(ui.rate==="mid"&&(r<.5||r>=.8))||(ui.rate==="lo"&&r>=.5)))return false;}
    var tags=(inf.tags||[]).map(function(t){return t.toLowerCase();});
    for(var i=0;i<tagW.length;i++){var tw=tagW[i];if(!tags.some(function(t){return t.indexOf(tw)===0;}))return false;}
    if(txtW.length){var hay=[inf.name,inf.igId,inf.youtube,inf.tiktok,(inf.styles||[]).join(" "),tags.join(" ")].join(" ").toLowerCase();
      for(var j=0;j<txtW.length;j++)if(hay.indexOf(txtW[j].replace(/^@/,""))<0)return false;}
    return true;
  });
  list.sort(function(a,b){
    if(ui.sort==="fit")return fitRank(fitOf(b))-fitRank(fitOf(a))||((b._s.rate||0)-(a._s.rate||0));
    if(ui.sort==="rate")return ((b._s.rate==null?-1:b._s.rate)-(a._s.rate==null?-1:a._s.rate))||(b._s.up-a._s.up);
    if(ui.sort==="fol")return mainFollowers(b)-mainFollowers(a);
    if(ui.sort==="name")return (a.name||"").localeCompare(b.name||"","ko");
    var la=a._s.latest?a._s.latest.proposedAt:"",lb=b._s.latest?b._s.latest.proposedAt:"";return lb.localeCompare(la)||fitRank(fitOf(b))-fitRank(fitOf(a));
  });
  return list;
}

function topTags(){var m={};state.influencers.forEach(function(i){(i.tags||[]).forEach(function(t){m[t]=(m[t]||0)+1;});});return Object.keys(m).sort(function(a,b){return m[b]-m[a];}).slice(0,10);}

function kpiHtml(){
  var n=state.influencers.length,now=new Date(),cut=new Date(now);cut.setDate(cut.getDate()-90);var cutS=cut.toISOString().slice(0,10);

  var cp=campById(c.campaignId);c.campaign=cp?cp.name:"";
  if(!c.id){c.id=uid("k");c.createdAt=new Date().toISOString();var tmp=c.status;c.status="제안 전";c.dates={};setStage(c,tmp);state.collabs.push(c);
    var inf=infById(c.influencerId);if(inf&&inf.relation==="NEW"&&stageIdx(c.status)>=2)inf.relation=c.type==="PAID"?"PAID":"SEEDING";
    toast("협업 기록에 추가했어요");}
  else{var o=colById(c.id);Object.keys(c).forEach(function(k){o[k]=c[k];});toast("저장했어요");}
  save();closeModal();render();if(ui.drawer)renderDrawer();
}
function closeModal(){$("mo").classList.remove("on");mState=null;}

/* ================= 렌더: Seeding ================= */
function campStats(id){
  var rows=state.collabs.filter(function(c){return c.campaignId===id;}),a=0,s=0,u=0;
  rows.forEach(function(c){var i=stageIdx(c.status);if(i>=2)a++;if(i>=3)s++;if(i>=5)u++;});
  return {rows:rows,total:rows.length,acc:a,ship:s,up:u,rate:s?u/s:null};
}
function renderSeed(){
  if(!ui.camp||!campById(ui.camp))ui.camp=state.campaigns[0]?state.campaigns[0].id:null;
  var side='<div><div class="eyebrow en" style="padding:0 12px 10px">Seeding lists</div><div class="clist">'+
    (state.campaigns.length?state.campaigns.map(function(cp){var k=campStats(cp.id);return '<div class="ci'+(cp.id===ui.camp?" on":"")+'" data-act="camp" data-id="'+cp.id+'"><div class="cn en">'+esc(cp.name)+'</div><div class="cs">'+k.total+'명 · 업로드 '+k.up+' · '+pct(k.rate)+'</div><div class="bar"><i style="width:'+(k.total?Math.round(k.up/k.total*100):0)+'%"></i></div></div>';}).join("")
     :'<div class="muted" style="padding:10px 12px;font-size:12px">아직 시딩 리스트가 없어요.</div>')+
    '<div class="ci muted" data-act="newCamp" style="font-size:12px">+ 새 시딩 리스트</div></div></div>';
  var cp=campById(ui.camp),main;
  if(!cp){main='<div class="empty" style="margin-top:0">오른쪽 위 <b>+ 새 시딩 리스트</b>로 캠페인을 만들어 보세요. (예: 26FW 2ND DROP)</div>';}
  else{
    var k=campStats(cp.id);
    var rows=k.rows.slice().sort(function(a,b){var ia=stageIdx(a.status),ib=stageIdx(b.status);return (ia<0?99:ia)-(ib<0?99:ib)||(a.proposedAt||"").localeCompare(b.proposedAt||"");});
    main='<div class="chd"><input class="ctitle en" data-camp="name" value="'+esc(cp.name)+'"><span class="muted" style="font-size:11.5px">생성 '+esc(cp.createdAt||"")+'</span><span style="flex:1"></span>'+
      '<button class="btn" data-act="pickInf">+ 인플루언서 추가</button><button class="btn ghost danger sm" data-act="delCamp">리스트 삭제</button></div>'+
      '<div class="skpi">'+
        '<div><div class="kl en">TOTAL</div><div class="kv en">'+k.total+'<small>명</small></div></div>'+
        '<div><div class="kl en">ACCEPTED</div><div class="kv en">'+k.acc+'<small>명</small></div></div>'+
        '<div><div class="kl en">SHIPPED</div><div class="kv en">'+k.ship+'<small>명</small></div></div>'+
        '<div><div class="kl en">UPLOADED</div><div class="kv en">'+k.up+'<small>명</small></div></div>'+
        '<div><div class="kl en">UPLOAD RATE</div><div class="kv en">'+pct(k.rate)+'</div></div>'+
      '</div>'+
      '<input class="in" data-camp="memo" value="'+esc(cp.memo||"")+'" placeholder="캠페인 메모 (목표, 발송일, 가이드 등)" style="margin-bottom:14px">'+
      '<div class="tw"><table><thead><tr><th>인플루언서</th><th>상품</th><th>컬러</th><th style="width:70px">사이즈</th><th>상태</th><th class="tc">제안</th><th class="tc">발송</th><th class="tc">수령</th><th class="tc">업로드</th><th>콘텐츠 링크</th><th>메모</th><th></th></tr></thead><tbody>'+
      (rows.length?rows.map(function(c){var inf=infById(c.influencerId)||{name:"(삭제됨)",id:""},si=stageIdx(c.status);
        function step(idx,label){var on=si>=idx,d=c.dates&&c.dates[STAGES[idx]];return '<td class="tc"><button class="stp'+(on?" on":"")+'" data-act="step" data-id="'+c.id+'" data-v="'+idx+'" title="'+label+'">'+(on?"✓":"")+'</button>'+(on&&d?'<div class="stp-d en">'+md(d)+'</div>':'')+'</td>';}
        return '<tr>'+
          '<td><div class="who" data-act="open" data-id="'+inf.id+'">'+avHtml(inf)+'<div><div class="wn">'+esc(inf.name)+(c.type!=="SEEDING"?' <span class="typ en">'+esc(c.type)+'</span>':'')+'</div><div class="wi">'+(inf.igId?'@'+esc(inf.igId):'')+' · '+fmtF(mainFollowers(inf))+'</div></div></div></td>'+
          '<td><input class="tin" data-col="product" data-id="'+c.id+'" value="'+esc(c.product)+'" placeholder="상품"></td>'+
          '<td><input class="tin" data-col="color" data-id="'+c.id+'" value="'+esc(c.color)+'" placeholder="컬러"></td>'+
          '<td><input class="tin" data-col="size" data-id="'+c.id+'" value="'+esc(c.size)+'"></td>'+
          '<td><select class="ssel sp '+spClass(c.status)+'" data-col="status" data-id="'+c.id+'">'+STAGES.concat([DECLINED]).map(function(s){return '<option'+(s===c.status?" selected":"")+'>'+s+'</option>';}).join("")+'</select></td>'+
          step(1,"제안(연락 완료)")+step(3,"발송")+step(4,"수령")+step(5,"업로드")+
          '<td><div class="lnk"><input class="tin" data-col="contentUrl" data-id="'+c.id+'" value="'+esc(c.contentUrl)+'" placeholder="URL">'+(c.contentUrl?'<a href="'+esc(c.contentUrl)+'" target="_blank" rel="noopener">↗</a>':'')+'</div></td>'+
          '<td><input class="tin" data-col="memo" data-id="'+c.id+'" value="'+esc(c.memo)+'" placeholder="메모"></td>'+
          '<td><button class="rx" data-act="rmRow" data-id="'+c.id+'" title="리스트에서 삭제">×</button></td>'+
        '</tr>';}).join("")
       :'<tr><td colspan="12" class="muted" style="text-align:center;padding:40px">아직 인원이 없어요. <b>+ 인플루언서 추가</b>로 보낼 사람을 고르세요.</td></tr>')+
      '</tbody></table></div>'+
      '<div class="hint">동그라미를 누르면 해당 단계까지 완료 처리되고 날짜가 기록돼요. 다시 누르면 취소. 여기서 바꾼 내용은 각 인플루언서의 COLLAB HISTORY에도 그대로 반영됩니다.</div>';
  }
  $("view").innerHTML='<div class="sd">'+side+'<div style="min-width:0">'+main+'</div></div>';
}

/* 인플루언서 선택(시딩 리스트에 추가) */
var pickSel={},pickQ="";
function openPicker(){pickSel={};pickQ="";renderPicker();$("mo").classList.add("on");}
function renderPicker(){
  var cp=campById(ui.camp),inCamp={};state.collabs.forEach(function(c){if(c.campaignId===ui.camp)inCamp[c.influencerId]=1;});
  var q=pickQ.toLowerCase();
  var list=state.influencers.filter(function(i){if(!q)return true;return (i.name+" "+i.igId+" "+(i.tags||[]).join(" ")+" "+(i.styles||[]).join(" ")).toLowerCase().indexOf(q.replace(/^@/,""))>=0;})
    .map(function(i){i._s=statsOf(i.id);return i;})
    .sort(function(a,b){return fitRank(fitOf(b))-fitRank(fitOf(a))||((b._s.rate==null?-1:b._s.rate)-(a._s.rate==null?-1:a._s.rate));});
  var n=Object.keys(pickSel).length;
  $("mbox").className="mbox wide";
  $("mbox").innerHTML='<div class="mh"><div><div class="mt">'+esc(cp.name)+'에 인플루언서 추가</div><div class="cid">BRAND FIT·업로드율 높은 순으로 정렬돼 있어요</div></div><button class="dhx" data-act="closeModal">×</button></div>'+
   '<div class="mb"><div class="fg" style="margin-bottom:12px"><div class="full"><label class="search" style="min-width:0">'+IC.search+'<input id="pq" placeholder="이름 / ID / #태그" value="'+esc(pickQ)+'"></label></div>'+
    '<div><label class="fl">상품 (선택, 일괄 적용)</label><input class="in" id="pProd" placeholder="예: Leather Jacket"></div><div><label class="fl">컬러 (선택)</label><input class="in" id="pColor"></div></div>'+
   '<div class="pick">'+list.map(function(i){var dis=inCamp[i.id],s=i._s;return '<div class="prow'+(dis?" dis":"")+'" data-act="pickToggle" data-id="'+i.id+'"><input type="checkbox"'+(pickSel[i.id]||dis?" checked":"")+(dis?" disabled":"")+' style="pointer-events:none">'+avHtml(i)+'<div><b style="font-weight:500">'+esc(i.name)+'</b> <span class="rel en '+esc(i.relation)+'">'+esc(i.relation)+'</span><div class="cid">@'+esc(i.igId)+' · '+fmtF(mainFollowers(i))+(dis?' · 이미 추가됨':'')+'</div></div><span class="en" style="font-size:15px">'+(fitOf(i)||"–")+'</span><span class="muted" style="font-size:11px;width:92px;text-align:right">업로드율 '+pct(s.rate)+'</span><span class="muted" style="font-size:11px;width:70px;text-align:right">'+(s.latest?ym(s.latest.proposedAt):'NEW')+'</span></div>';}).join("")+'</div></div>'+
   '<div class="mf"><span class="muted" style="margin-right:auto">'+n+'명 선택</span><button class="btn" data-act="closeModal">취소</button><button class="btn dark" data-act="pickAdd"'+(n?"":" disabled")+'>'+n+'명 추가</button></div>';
}

/* ================= 이벤트 ================= */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var a=el.getAttribute("data-act"),id=el.getAttribute("data-id"),v=el.getAttribute("data-v");
  if(a!=="open"&&a!=="camp"&&a!=="pickToggle"&&a!=="editCol"&&a!=="pickImg"&&a!=="closeDrawer")e.stopPropagation();
  switch(a){
    case "tab":ui.tab=v;closeDrawer();render();break;
    case "rel":ui.rel=v;render();break;
    case "savedOnly":ui.saved=!ui.saved;render();break;
    case "tag":var qs=ui.q.split(/\s+/).filter(Boolean),ix=qs.map(function(x){return x.toLowerCase();}).indexOf(v.toLowerCase());if(ix>=0)qs.splice(ix,1);else qs.push(v);ui.q=qs.join(" ");render();break;
    case "reset":ui.rel="ALL";ui.q="";ui.fit=ui.fol=ui.plat=ui.style=ui.hist=ui.rate="";ui.saved=false;render();break;
    case "goWaiting":ui.hist=ui.hist==="waiting"?"":"waiting";render();break;
    case "open":if(e.target.closest("[data-act='save'],[data-act='propose']"))return;if(id)openDrawer(id);break;
    case "closeDrawer":closeDrawer();break;
    case "save":e.preventDefault();var inf=infById(id);inf.saved=!inf.saved;save();render();if(ui.drawer===id)renderDrawer();break;
    case "propose":e.preventDefault();openCollabModal({influencerId:id});break;
    case "editCol":var c0=colById(id);if(c0)openCollabModal({influencerId:c0.influencerId,collabId:id});break;
    case "newInf":var ni={id:uid("i"),name:"새 인플루언서",igId:"",followers:0,brandFit:{grade:"",mode:"manual",score:null,factors:null},relation:"NEW",styles:[],tags:[],categories:[],contents:[],avatar:"",saved:false,relationMemo:"",notes:"",reaction:"",size:"",phone:"",email:"",agency:"",youtube:"",ytFollowers:0,tiktok:"",ttFollowers:0,createdAt:today()};
      state.influencers.unshift(ni);save();ui.tab="inf";render();openDrawer(ni.id);setTimeout(function(){var f=document.querySelector('[data-inf="name"]');if(f){f.focus();f.select();}},320);break;
    case "delInf":var di=infById(ui.drawer);if(!di)break;var nc=collabsOf(di.id).length;
      if(!confirm("'"+di.name+"' 인플루언서를 삭제할까요?"+(nc?"\n협업 기록 "+nc+"건도 함께 삭제됩니다.":"")))break;
      state.influencers=state.influencers.filter(function(x){return x.id!==di.id;});state.collabs=state.collabs.filter(function(x){return x.influencerId!==di.id;});
      save();closeDrawer();render();toast("삭제했어요");break;
    case "fit":var fi=infById(ui.drawer);fi.brandFit=fi.brandFit||{mode:"manual"};fi.brandFit.grade=fi.brandFit.grade===v?"":v;fi.brandFit.mode="manual";fi.brandFit.updatedAt=today();save();renderDrawer();render();break;
    case "relSet":var ri=infById(ui.drawer);ri.relation=v;save();renderDrawer();render();break;
    case "react":var rc=infById(ui.drawer);rc.reaction=rc.reaction===v?"":v;save();renderDrawer();break;
    case "pickImg":if(e.target.closest(".mx"))return;imgTarget=el.getAttribute("data-slot");$("fileIn").value="";$("fileIn").click();break;
    case "clrImg":var ci=infById(ui.drawer);setImg(ci,el.getAttribute("data-slot"),"");save();renderDrawer();render();break;
    case "urlImg":e.preventDefault();var ui2=infById(ui.drawer);var slot=prompt("어느 칸에 넣을까요? (0 = 프로필, 1~4 = 콘텐츠)","1");if(slot==null)break;slot=slot.trim();if(!/^[0-4]$/.test(slot))break;var u=prompt("이미지 URL");if(!u)break;setImg(ui2,slot==="0"?"avatar":String(+slot-1),u.trim());save();renderDrawer();render();break;
    case "closeModal":closeModal();break;
    case "mType":readModalInputs();mState.type=v;renderCollabModal();break;
    case "mStage":readModalInputs();mState.status=v;renderCollabModal();break;
    case "saveCol":saveCollab();break;
    case "delCol":if(!confirm("이 협업 기록을 삭제할까요?"))break;state.collabs=state.collabs.filter(function(x){return x.id!==mState.id;});save();closeModal();render();if(ui.drawer)renderDrawer();toast("삭제했어요");break;
    case "newCamp":var nm=prompt("새 시딩 리스트 이름","26FW 3RD DROP");if(!nm||!nm.trim())break;ui.camp=ensureCampaign(nm);ui.tab="seed";save();closeDrawer();render();break;
    case "camp":ui.camp=id;render();break;
    case "delCamp":var dc=campById(ui.camp),k=campStats(ui.camp);if(!confirm("'"+dc.name+"' 리스트를 삭제할까요?"+(k.total?"\n이 리스트의 협업 기록 "+k.total+"건도 인플루언서 히스토리에서 삭제됩니다.":"")))break;
      state.collabs=state.collabs.filter(function(x){return x.campaignId!==ui.camp;});state.campaigns=state.campaigns.filter(function(x){return x.id!==ui.camp;});ui.camp=null;save();render();break;
    case "step":var sc=colById(id),idx=+v,cur=stageIdx(sc.status);setStage(sc,cur>=idx?STAGES[idx===1?0:idx-1]:STAGES[idx]);save();render();break;
    case "rmRow":var rr=colById(id),rn=(infById(rr.influencerId)||{}).name;if(!confirm(rn+"을(를) 이 리스트에서 뺄까요? (협업 기록도 삭제)"))break;state.collabs=state.collabs.filter(function(x){return x.id!==id;});save();render();break;
    case "pickInf":openPicker();break;
    case "pickToggle":if(pickSel[id])delete pickSel[id];else pickSel[id]=1;renderPicker();break;
    case "pickAdd":var prod=$("pProd").value.trim(),col=$("pColor").value.trim(),cpn=campById(ui.camp),added=0;
      Object.keys(pickSel).forEach(function(iid){var pi=infById(iid);state.collabs.push({id:uid("k"),influencerId:iid,campaignId:ui.camp,campaign:cpn.name,season:"",type:"SEEDING",product:prod,color:col,size:(pi.size||"").split("/")[0].trim(),proposedAt:today(),owner:"대표",memo:"",status:"제안 전",dates:{},contentUrl:"",cost:"",revenue:"",createdAt:new Date().toISOString()});added++;});
      save();closeModal();render();toast(added+"명 추가했어요");break;
  }
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="q"){ui.q=t.value;clearTimeout(t._t);t._t=setTimeout(render,120);}
  if(t.id==="pq"){pickQ=t.value;var p=t.selectionStart;renderPicker();var n=$("pq");n.focus();n.setSelectionRange(p,p);}
});
document.addEventListener("change",function(e){
  var t=e.target,f;
  if((f=t.getAttribute("data-f"))){ui[f]=t.value;render();return;}
  if((f=t.getAttribute("data-inf"))){var inf=infById(ui.drawer);if(!inf)return;setInfField(inf,f,t.value);save();render();renderDrawer();return;}
  if((f=t.getAttribute("data-col"))){var c=colById(t.getAttribute("data-id"));if(!c)return;if(f==="status")setStage(c,t.value);else c[f]=t.value;save();render();return;}
  if((f=t.getAttribute("data-camp"))){var cp=campById(ui.camp);if(!cp)return;var v=t.value.trim();if(f==="name"&&!v){t.value=cp.name;return;}cp[f]=v;if(f==="name"){var m=v.match(/(\d{2})\s*(SS|FW)/i);cp.season=m?m[1]+m[2].toUpperCase():cp.season;}save();render();return;}
  if(t.id==="fileIn"&&t.files&&t.files[0]){var inf2=infById(ui.drawer);if(!inf2)return;resizeFile(t.files[0],function(d){setImg(inf2,imgTarget,d);save();renderDrawer();render();});}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if($("mo").classList.contains("on"))closeModal();else if(ui.drawer)closeDrawer();}});
$("mo").addEventListener("mousedown",function(e){if(e.target===$("mo"))closeModal();});

/* ================= 시작 ================= */
(async function init(){
  var loaded=null;
  try{var r=await sb("sku_state?id=eq."+ROW+"&select=payload");var p=r&&r[0]&&r[0].payload;if(p&&p.influencers)loaded=p;cloudOK=true;}catch(e){cloudOK=false;}
  if(!loaded){try{var l=JSON.parse(localStorage.getItem(LKEY)||"null");if(l&&l.influencers)loaded=l;}catch(e){}}
  if(loaded){state=loaded;setSync(cloudOK?"클라우드 동기화됨":"이 기기 데이터");}
  else{state=seedData();setSync("샘플 데이터 · 수정하면 저장돼요");}
  state.influencers=state.influencers||[];state.collabs=state.collabs||[];state.campaigns=state.campaigns||[];
  ready=true;render();
})();
})();
