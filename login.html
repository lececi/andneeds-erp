.hero::before{content:"";position:absolute;top:0;left:0;right:0;height:34%;background:linear-gradient(to bottom,rgba(255,255,255,0.32),rgba(255,255,255,0));pointer-events:none;}
.topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;padding:clamp(26px,4vw,50px) clamp(26px,4.5vw,62px);z-index:3;}
.logo{height:clamp(26px,4vw,50px);width:auto;display:block;filter:drop-shadow(0 1px 18px rgba(255,255,255,0.6));}
.loginbtn{background:none;border:none;cursor:pointer;padding:0;margin:0;line-height:0;}
.loginword{height:clamp(37px,5.76vw,72px);width:auto;display:block;filter:drop-shadow(0 1px 16px rgba(255,255,255,0.6));transition:opacity .25s ease;}
.loginbtn:hover .loginword{opacity:0.62;}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(26,23,20,0.46);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
.modal.open{display:flex;}
.dialog{position:relative;width:100%;max-width:384px;background:var(--paper);padding:46px 40px 40px;animation:rise .35s cubic-bezier(.2,.8,.2,1);}
@keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.close{position:absolute;top:16px;right:18px;width:30px;height:30px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;}
.eyebrow{font-size:13px;letter-spacing:0.26em;text-transform:uppercase;color:var(--accent);font-weight:500;}
.h{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:500;line-height:1.05;margin:12px 0 6px;}
.sub{font-size:15px;color:var(--muted);margin-bottom:34px;}
.f{margin-bottom:22px;}
.f label{display:block;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;}
.f input{width:100%;border:none;border-bottom:1px solid var(--line);background:transparent;padding:9px 2px;font-size:17px;color:#8A8A8A;font-family:inherit;transition:border-color .2s;}
.f input::placeholder{color:#C4BEB7;}
.f input:focus{outline:none;border-bottom-color:#CCCCCC;}
.btn{width:100%;padding:15px;background:var(--ink);color:#fff;border:none;font-size:15px;letter-spacing:0.08em;cursor:pointer;font-family:inherit;margin-top:8px;transition:opacity .2s;}
.btn:hover{opacity:0.86;}
.btn:disabled{opacity:0.5;cursor:default;}
.err{font-size:14px;color:var(--danger);text-align:center;min-height:15px;margin-top:14px;line-height:1.5;}
.foot{font-size:13px;color:var(--muted);text-align:center;margin-top:22px;line-height:1.6;}
@media(max-width:760px){.dialog{padding:40px 28px 34px;}.h{font-size:36px;}}

    }
  }catch(e){
    err.textContent='로그인 중 문제가 생겨었어요. 잠시 후 다시 시도해주세요.';
    btn.disabled=false;btn.textContent='로그인';
  }
}
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&document.getElementById('modal').classList.contains('open'))doLogin();});
</script>
