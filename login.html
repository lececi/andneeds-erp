<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 · ANDNEEDS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>
// 이미 로그인되어 있으면 바로 홈으로
try{var _s=JSON.parse(localStorage.getItem('anniz_auth')||'null');if(_s&&_s.access_token){location.replace('home.html');}}catch(e){}
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#FFFFFF;--ink:#1A1714;--text-2:#6B6560;--text-3:#A09A94;--border:rgba(0,0,0,0.12);--accent:#2B6CB8;--danger:#C0392B;}
html,body{height:100%;}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:#F7F6F4;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px;}
.card{width:100%;max-width:380px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:44px 36px;}
.brand{text-align:center;margin-bottom:6px;}
.brand .wm{font-size:24px;font-weight:600;letter-spacing:0.16em;color:var(--ink);}
.brand .sub{font-size:11px;font-weight:500;letter-spacing:0.32em;color:var(--accent);text-transform:uppercase;margin-top:8px;}
.title{text-align:center;font-size:14px;color:var(--text-2);margin:22px 0 26px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:7px;}
.field input{width:100%;font-family:inherit;font-size:14px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--ink);}
.field input:focus{outline:none;border-color:var(--accent);}
.btn{width:100%;font-family:inherit;font-size:14px;font-weight:500;padding:13px;border:none;border-radius:10px;background:var(--ink);color:#fff;cursor:pointer;margin-top:8px;}
.btn:disabled{opacity:0.5;cursor:default;}
.err{font-size:12px;color:var(--danger);text-align:center;min-height:16px;margin-top:14px;line-height:1.5;}
.foot{font-size:11px;color:var(--text-3);text-align:center;margin-top:22px;line-height:1.6;}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="wm">AN.NIZ</div><div class="sub">ANDNEEDS ERP</div></div>
  <div class="title">로그인 후 이용할 수 있어요</div>
  <div class="field"><label>이메일</label><input id="email" type="email" autocomplete="username" placeholder="you@example.com"></div>
  <div class="field"><label>비밀번호</label><input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호"></div>
  <button class="btn" id="btn" onclick="doLogin()">로그인</button>
  <div class="err" id="err"></div>
  <div class="foot">계정이 없으신가요? 관리자에게 계정 생성을 요청해주세요.</div>
</div>
<script>
const SB='https://nifytqcqfattzpwlzpmb.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pZnl0cWNxZmF0dHpwd2x6cG1iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NTQxMzQsImV4cCI6MjA5NjQzMDEzNH0.0kE9ypuxzVNLuXwjHRTEsMxQ80vitqXjTUretQKXHUs';
async function doLogin(){
  var email=document.getElementById('email').value.trim();
  var pw=document.getElementById('pw').value;
  var err=document.getElementById('err');var btn=document.getElementById('btn');
  err.textContent='';
  if(!email||!pw){err.textContent='이메일과 비밀번호를 입력해주세요.';return;}
  btn.disabled=true;btn.textContent='확인 중...';
  try{
    var r=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:ANON,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pw})});
    var d=await r.json();
    if(d&&d.access_token){
      localStorage.setItem('anniz_auth',JSON.stringify({access_token:d.access_token,refresh_token:d.refresh_token,expires_at:d.expires_at,email:(d.user&&d.user.email)||email}));
      location.replace('home.html');
    }else{
      err.textContent='이메일 또는 비밀번호가 올바르지 않아요.';
      btn.disabled=false;btn.textContent='로그인';
    }
  }catch(e){
    err.textContent='로그인 중 문제가 생겼어요. 잠시 후 다시 시도해주세요.';
    btn.disabled=false;btn.textContent='로그인';
  }
}
document.addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
</script>
</body>
</html>
