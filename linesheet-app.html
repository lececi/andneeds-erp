/* Header */
.lh{position:sticky;top:0;z-index:30;background:rgba(252,251,249,0.92);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line);}
.lh-in{max-width:1400px;margin:0 auto;padding:20px 34px 16px;display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;}
.lh-brand{display:flex;flex-direction:column;gap:5px;}
.lh-logo{height:20px;width:auto;opacity:.92;}
.lh-t{font-family:'Branch',Georgia,serif;font-size:26px;font-weight:500;letter-spacing:.42em;line-height:1;color:var(--ink);text-indent:.42em;}
.lh-s{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--mut2);}
.lh-act{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;align-items:center;}
.lh-btn{border:none;background:none;color:var(--mut);font-size:12px;letter-spacing:.05em;padding:8px 12px;cursor:pointer;font-family:inherit;border-radius:20px;transition:.15s;}
.lh-btn:hover{color:var(--ink);background:rgba(0,0,0,0.04);}
.lh-btn.pri{color:var(--ink);border:1px solid var(--ink);padding:8px 16px;}
.lh-btn.pri:hover{background:var(--ink);color:#fff;}
/* Toolbar */
.tb{max-width:1400px;margin:0 auto;padding:22px 34px 6px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.cats{display:flex;gap:2px;flex-wrap:wrap;}
.cat{border:none;background:none;font-family:inherit;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut2);padding:7px 13px;cursor:pointer;border-radius:20px;transition:.15s;position:relative;}
.cat:hover{color:var(--ink);}
.cat.on{color:var(--ink);font-weight:600;}
.cat.on::after{content:"";position:absolute;left:13px;right:13px;bottom:2px;height:1px;background:var(--ink);}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:16px;}
.count{font-size:11.5px;letter-spacing:.1em;color:var(--mut2);text-transform:uppercase;}
.count b{color:var(--ink);font-weight:600;}
.vtog{display:flex;gap:2px;}
.vtog button{border:none;background:none;cursor:pointer;color:var(--mut2);padding:6px;font-size:15px;line-height:1;border-radius:6px;}
.vtog button.on{color:var(--ink);background:rgba(0,0,0,0.05);}
/* Grid */
.wrap{max-width:1400px;margin:0 auto;padding:22px 34px 90px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:38px 26px;}
.card{cursor:pointer;}
.card-img{position:relative;aspect-ratio:3/4;background:var(--card);overflow:hidden;}
.card-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1);}
.card:hover .card-img img{transform:scale(1.045);}
.card-no{position:absolute;top:11px;left:12px;font-size:10.5px;letter-spacing:.08em;color:rgba(255,255,255,.9);mix-blend-mode:difference;font-variant-numeric:tabular-nums;}
.card-noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--mut2);font-size:11px;letter-spacing:.14em;text-transform:uppercase;}
.card-b{padding:13px 2px 0;}
.card-cat{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut2);}
.card-name{font-family:'Branch',Georgia,serif;font-size:15px;font-weight:500;line-height:1.35;margin:5px 0 0;color:var(--ink);}
.card-meta{font-size:11.5px;color:var(--mut);margin-top:6px;letter-spacing:.02em;}
.card-price{font-size:13px;font-weight:500;margin-top:9px;font-variant-numeric:tabular-nums;letter-spacing:.04em;}
.card-mat{font-size:10.5px;color:var(--mut2);margin-top:7px;line-height:1.5;letter-spacing:.02em;white-space:pre-line;}
/* List view */
.lsx{width:100%;border-collapse:collapse;font-size:13px;}
.lsx th{text-align:left;font-weight:500;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut2);padding:0 14px 12px;border-bottom:1px solid var(--line);}
.lsx th.r{text-align:right;} .lsx th.c{text-align:center;}
.lsx td{padding:16px 14px;border-bottom:1px solid var(--line);vertical-align:top;}
.lsx tr{cursor:pointer;} .lsx tbody tr:hover td{background:rgba(0,0,0,0.015);}
.lsx td.no{color:var(--mut2);width:38px;font-variant-numeric:tabular-nums;}
.lsx td.img img,.lsx td.img .th-no{width:58px;height:76px;object-fit:cover;background:var(--card);display:block;}
.lsx td.img .th-no{display:flex;align-items:center;justify-content:center;color:var(--mut2);font-size:9px;}
.lsx td.nm{font-family:'Branch',Georgia,serif;font-size:14px;color:var(--ink);min-width:190px;}
.lsx td.nm small{display:block;font-family:"Noto Sans KR";font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut2);margin-bottom:3px;}
.lsx td.c{text-align:center;color:var(--mut);}
.lsx td.price{text-align:right;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;}
.lsx td.mat{font-size:11px;color:var(--mut);white-space:pre-line;max-width:220px;line-height:1.6;}
.lsx td.code{font-size:11.5px;color:var(--mut);letter-spacing:.04em;white-space:nowrap;}
.lsx td.desc{font-size:11px;color:var(--mut);min-width:240px;max-width:340px;}
.lsx td.desc .desc-in{line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.lsx td.lnk a{color:var(--ink);font-size:11px;letter-spacing:.06em;text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:1px;}
.lsx td.lnk a:hover{opacity:.6;}
.empty{grid-column:1/-1;text-align:center;padding:90px 20px;color:var(--mut2);font-size:13px;letter-spacing:.05em;}
/* Modal */
.md{position:fixed;inset:0;background:rgba(26,24,21,0.42);display:none;align-items:center;justify-content:center;z-index:100;padding:22px;}
.md.open{display:flex;}
.md-box{background:#fff;width:min(920px,97vw);max-height:92vh;overflow:hidden;display:grid;grid-template-columns:minmax(0,44%) minmax(0,56%);}
@media(max-width:720px){.md-box{grid-template-columns:1fr;max-height:94vh;overflow-y:auto;}}
.md-imgcol{background:var(--card);position:relative;min-height:360px;}
.md-imgcol img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.md-imgcol .ph{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;color:var(--mut2);font-size:11px;letter-spacing:.12em;text-transform:uppercase;}
.md-form{padding:30px 30px 26px;overflow-y:auto;max-height:92vh;}
.md-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;}
.md-head .t{font-family:'Branch',Georgia,serif;font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);}
.md-x{cursor:pointer;color:var(--mut2);font-size:22px;line-height:1;}
.md-x:hover{color:var(--ink);}
.fld{margin-bottom:15px;}
.fld label{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut2);margin-bottom:6px;}
.fld input,.fld textarea{width:100%;border:none;border-bottom:1px solid var(--line);padding:7px 0;font-size:14px;font-family:inherit;color:var(--ink);background:none;outline:none;transition:.15s;}
.fld input:focus,.fld textarea:focus{border-color:var(--ink);}
.fld textarea{resize:vertical;min-height:54px;line-height:1.6;}
.fld.serif input{font-family:'Branch',Georgia,serif;font-size:16px;}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.imgtools{display:flex;gap:14px;align-items:center;margin-top:8px;}
.imgtools label{font-size:11px;color:var(--ink);text-decoration:underline;cursor:pointer;letter-spacing:.02em;}
.md-foot{display:flex;align-items:center;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line);}
.del{border:none;background:none;color:#B04A3C;font-size:12px;letter-spacing:.04em;cursor:pointer;font-family:inherit;}
.del:hover{text-decoration:underline;}
.btn-line{border:1px solid var(--line);background:none;color:var(--mut);border-radius:0;padding:10px 18px;font-size:12px;letter-spacing:.05em;cursor:pointer;font-family:inherit;}
.btn-fill{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:10px 22px;font-size:12px;letter-spacing:.08em;cursor:pointer;font-family:inherit;}
.btn-fill:hover{opacity:.85;}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:12px 22px;font-size:12.5px;letter-spacing:.03em;opacity:0;transition:.3s;z-index:200;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
/* Print */
@media print{
  .lh-act,.tb-right .vtog,.md,.del,.md-foot{display:none !important;}
  .lh,.tb{position:static;background:#fff;backdrop-filter:none;}
  body{background:#fff;} .wrap{padding:10px 0;max-width:none;}
  .grid{grid-template-columns:repeat(4,1fr);gap:18px;}
  .card{break-inside:avoid;} .card-img{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .lsx tbody tr{break-inside:avoid;}
}

  cats.addEventListener("click",function(e){ var b=e.target.closest(".cat"); if(!b)return; filterCat=b.getAttribute("data-c"); render(); });
  document.getElementById("vtog").addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b)return; view=b.getAttribute("data-v"); [].forEach.call(this.children,function(x){x.classList.toggle("on",x===b);}); try{localStorage.setItem("anv_ls_view",view);}catch(e){} render(); });
  grid.addEventListener("click",function(e){ var c=e.target.closest(".card"); if(c)openEdit(parseInt(c.getAttribute("data-i"),10)); });
  listBody.addEventListener("click",function(e){ var tr=e.target.closest("tr"); if(tr&&tr.hasAttribute("data-i"))openEdit(parseInt(tr.getAttribute("data-i"),10)); });

  function setImg(u){ var col=document.getElementById("mdImgCol"); col.querySelectorAll("img").forEach(function(x){x.remove();}); var ph=document.getElementById("mdPh"); if(u){ var im=document.createElement("img"); im.src=u; col.appendChild(im); ph.style.display="none"; } else ph.style.display="flex"; }
  function fill(p){ document.getElementById("fName").value=p.name||""; document.getElementById("fCode").value=p.code||""; document.getElementById("fCat").value=p.cat||""; document.getElementById("fColor").value=p.color||""; document.getElementById("fSize").value=p.size||""; document.getElementById("fPrice").value=p.price||""; document.getElementById("fMaterial").value=p.material||""; document.getElementById("fDesc").value=p.desc||""; document.getElementById("fUrl").value=p.url||""; document.getElementById("fImg").value=p.img||""; setImg(p.img); }
  function openEdit(i){ curIdx=i; document.getElementById("mdT").textContent="EDIT"; document.getElementById("lsDel").style.display=""; fill(DATA[i]); md.classList.add("open"); }
  function openAdd(){ curIdx=-1; document.getElementById("mdT").textContent="NEW"; document.getElementById("lsDel").style.display="none"; fill({}); md.classList.add("open"); setTimeout(function(){document.getElementById("fName").focus();},40); }
  function close(){ md.classList.remove("open"); }
  document.getElementById("lsAdd").addEventListener("click",openAdd);
  document.getElementById("mdX").addEventListener("click",close);
  document.getElementById("lsCancel").addEventListener("click",close);
  md.addEventListener("mousedown",function(e){ md._d=(e.target===md); });
  md.addEventListener("click",function(e){ if(e.target===md&&md._d)close(); });
  document.getElementById("fImg").addEventListener("input",function(){ setImg(this.value.trim()); });
  document.getElementById("fImgFile").addEventListener("change",function(){ var f=this.files&&this.files[0]; if(!f)return; if(f.size>1400000)alert("이미지가 커요(1.4MB↑). 가능하면 URL 붙여넣기를 권장해요."); var r=new FileReader(); r.onload=function(){ document.getElementById("fImg").value=r.result; setImg(r.result); }; r.readAsDataURL(f); });
  document.getElementById("lsSave").addEventListener("click",function(){
    var p={ name:document.getElementById("fName").value.trim(), code:document.getElementById("fCode").value.trim(), cat:document.getElementById("fCat").value.trim(), color:document.getElementById("fColor").value.trim(), size:document.getElementById("fSize").value.trim(), price:parseInt(document.getElementById("fPrice").value.replace(/[^0-9]/g,""),10)||0, material:document.getElementById("fMaterial").value, desc:document.getElementById("fDesc").value, url:document.getElementById("fUrl").value.trim(), img:document.getElementById("fImg").value.trim() };
    if(!p.name){ document.getElementById("fName").focus(); return; }
    if(curIdx>=0)DATA[curIdx]=p; else DATA.push(p);
    render(); save(); close(); toast(curIdx>=0?"수정했어요":"등록했어요");
  });
  document.getElementById("lsDel").addEventListener("click",function(){ if(curIdx<0)return; if(!confirm("이 상품을 삭제할까요?"))return; DATA.splice(curIdx,1); render(); save(); close(); toast("삭제했어요"); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&md.classList.contains("open"))close(); });

  var st=null;
  function save(){ if(!ready)return; try{localStorage.setItem(LKEY,JSON.stringify(DATA));}catch(e){} if(cloudOK){ clearTimeout(st); st=setTimeout(function(){ sb("sku_state",{method:"POST",headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify([{id:ROW,payload:DATA}])}).catch(function(){}); },600); } }

  document.getElementById("lsUploadBtn").addEventListener("click",function(){ document.getElementById("lsFile").click(); });
  document.getElementById("lsFile").addEventListener("change",async function(){
    var f=this.files&&this.files[0]; this.value=""; if(!f)return;
    if(!window.XLSX){ await new Promise(function(res,rej){ var sc=document.createElement("script"); sc.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); }).catch(function(){}); }
    if(!window.XLSX){ alert("엑셀 파서를 불러오지 못했어요."); return; }
    try{
      var buf=await f.arrayBuffer(); var wb=XLSX.read(buf,{type:"array"});
      var rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
      var hi=-1; for(var i=0;i<Math.min(rows.length,25);i++){ if(rows[i].map(function(x){return String(x).trim();}).indexOf("상품명")>=0){hi=i;break;} }
      if(hi<0){ alert("표에서 '상품명' 열을 찾지 못했어요."); return; }
      var H=rows[hi].map(function(x){return String(x).trim();});
      function col(){ for(var a=0;a<arguments.length;a++){ var key=arguments[a]; for(var j=0;j<H.length;j++){ if(H[j].replace(/\s/g,"").indexOf(key.replace(/\s/g,""))>=0)return j; } } return -1; }
      var cCat=col("분류","카테고리"),cCode=col("품번","스타일번호","스타일","코드","STYLE"),cName=col("상품명"),cColor=col("컬러","색상"),cSize=col("사이즈"),cPrice=col("가격"),cMat=col("소재"),cDesc=col("상품설명","설명"),cUrl=col("29CM","페이지","URL","링크"),cImg=col("이미지");
      var added=[];
      rows.slice(hi+1).forEach(function(r){ var nm=String(r[cName]||"").trim(); if(!nm)return;
        added.push({ cat:cCat>=0?String(r[cCat]||"").trim():"", code:cCode>=0?String(r[cCode]||"").trim():"", name:nm, color:cColor>=0?String(r[cColor]||"").trim():"", size:cSize>=0?String(r[cSize]||"").trim():"", price:parseInt(String(r[cPrice]||"").replace(/[^0-9]/g,""),10)||0, material:cMat>=0?String(r[cMat]||"").trim():"", desc:cDesc>=0?String(r[cDesc]||"").trim():"", url:cUrl>=0?String(r[cUrl]||"").trim():"", img:cImg>=0?String(r[cImg]||"").trim():"" }); });
      if(!added.length){ alert("불러올 상품이 없어요."); return; }
      if(!confirm(added.length+"개 상품을 불러왔어요. 기존 "+DATA.length+"개에 추가할까요?")) return;
      DATA=DATA.concat(added); render(); save(); toast(added.length+"개 추가했어요");
    }catch(e){ alert("엑셀 오류: "+(e&&e.message||e)); }
  });

  try{ var sv=localStorage.getItem("anv_ls_view"); if(sv){ view=sv; [].forEach.call(document.querySelectorAll("#vtog button"),function(b){b.classList.toggle("on",b.getAttribute("data-v")===view);}); } }catch(e){}
  (async function(){
    try{ var r=await sb("sku_state?id=eq."+ROW+"&select=payload"); var p=r&&r[0]&&r[0].payload; if(Array.isArray(p)&&p.length)DATA=p; cloudOK=true; }
    catch(e){ cloudOK=false; try{ var l=JSON.parse(localStorage.getItem(LKEY)||"null"); if(Array.isArray(l)&&l.length)DATA=l; }catch(e2){} }
    ready=true; render(); if(cloudOK)save();
  })();
})();
</script>
</body>
</html>
