<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마케팅 비용 · ANDNEEDS ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#FFFFFF;--surface:#FFFFFF;--surface2:#F5F5F5;--border:rgba(0,0,0,0.08);--border-mid:rgba(0,0,0,0.14);--text:#1A1714;--text-2:#6B6560;--text-3:#A09A94;--danger:#BD090A;--success:#2B6CB8;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px;}

  .layout{display:flex;min-height:100vh;}
  .sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;}
  .sidebar-logo{height:60px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid var(--border);box-sizing:border-box;}
  .sidebar-nav{flex:1;padding:16px 10px;}
  .nav-section-label{font-size:10px;font-weight:500;letter-spacing:0.1em;color:var(--text-3);text-transform:uppercase;padding:0 10px;margin-bottom:6px;}
  .nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;font-size:13px;color:var(--text-2);text-decoration:none;transition:all 0.15s;margin-bottom:2px;}
  .nav-item:hover{background:var(--surface2);color:var(--text);}
  .nav-item.active{background:var(--surface2);color:var(--text);font-weight:500;}
  .nav-disabled{opacity:0.4;pointer-events:none;}
  .sidebar-footer{padding:16px 20px;font-size:10px;letter-spacing:0.1em;color:var(--text-3);border-top:1px solid var(--border);}
  .page-content{margin-left:220px;flex:1;min-width:0;}
  .topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;flex-wrap:nowrap;overflow:hidden;}
  .topbar-title{font-size:13px;font-weight:500;color:var(--text);}
  @media(max-width:768px){.sidebar{width:48px;}.nav-item span.nav-label{display:none;}.nav-section-label{display:none;}.sidebar-footer{display:none;}.sidebar-logo{padding:0 10px;}.page-content{margin-left:48px;}.topbar{padding:0 16px;}}
main{max-width:1200px;margin:0 auto;padding:24px 28px 64px;}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:28px;}
.metric-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
.metric-card.highlight{background:var(--text);}
.metric-label{font-size:11px;font-weight:500;letter-spacing:0.08em;color:var(--text-3);text-transform:uppercase;margin-bottom:8px;}
.metric-card.highlight .metric-label{color:rgba(247,245,242,0.5);}
.metric-value{font-size:22px;font-weight:300;color:var(--text);letter-spacing:-0.02em;}
.metric-card.highlight .metric-value{color:#F7F5F2;}
.metric-sub{font-size:12px;color:var(--text-3);margin-top:4px;}
.metric-card.highlight .metric-sub{color:rgba(247,245,242,0.45);}
.tab-btn{font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;padding:5px 14px;border-radius:20px;border:1px solid var(--border-mid);background:transparent;color:var(--text-2);cursor:pointer;transition:all 0.15s;}
.tab-btn.active{background:var(--text);color:var(--bg);border-color:var(--text);}

.plat-filter-btn{font-family:'Noto Sans KR',sans-serif;font-size:12px;padding:5px 14px;border-radius:20px;border:1px solid var(--border-mid);background:transparent;color:var(--text-2);cursor:pointer;transition:all 0.15s;}
.plat-filter-btn:hover{background:var(--surface2);color:var(--text);}
.plat-filter-btn.active{background:var(--text);color:#fff;border-color:var(--text);}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:28px;}
.chart-legend{display:flex;gap:20px;margin-bottom:16px;}
.legend-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-2);}
.legend-dot{width:10px;height:10px;border-radius:2px;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-nav-btn{background:none;border:1px solid var(--border-mid);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px;color:var(--text-2);display:flex;align-items:center;justify-content:center;}
.cal-nav-btn:hover{background:var(--surface2);}
.cal-month-label{font-size:15px;font-weight:500;color:var(--text);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-day-name{text-align:center;font-size:11px;font-weight:500;color:var(--text-3);padding:8px 0;}
.cal-cell{background:var(--surface);border:1px solid var(--border);border-radius:8px;min-height:72px;padding:8px;}
.cal-cell.empty{background:transparent;border-color:transparent;}
.cal-cell.today{border-color:var(--text);}
.cal-date{font-size:12px;font-weight:500;color:var(--text-2);margin-bottom:4px;}
.cal-cell.today .cal-date{color:var(--text);}
.cal-sales{font-size:11px;font-weight:500;color:var(--text);line-height:1.4;}
.cal-net{font-size:10px;color:var(--success);}
.cal-cell{cursor:pointer;}
.cal-cell:hover{border-color:var(--border-mid);}
.cal-cell.has-data:hover{border-color:var(--text);}
.cal-compare{font-size:10px;color:var(--text-3);margin-top:2px;}
.cal-detail-overlay{display:none;position:fixed;inset:0;background:rgba(26,23,20,0.4);z-index:200;align-items:center;justify-content:center;}
.cal-detail-overlay.open{display:flex;}
.cal-detail-box{background:var(--surface);border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;margin:16px;}
.cal-detail-title{font-size:15px;font-weight:500;color:var(--text);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.cal-detail-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-3);}
.cal-detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.cal-detail-row:last-child{border-bottom:none;}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.sec-title{font-size:11px;font-weight:500;letter-spacing:0.1em;color:var(--text-3);text-transform:uppercase;}
.platforms{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:28px;}
.plat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
.plat-name{font-size:11px;font-weight:500;letter-spacing:0.08em;color:var(--text-3);text-transform:uppercase;margin-bottom:8px;}
.plat-val{font-size:17px;font-weight:400;color:var(--text);}
.plat-net{font-size:12px;color:var(--text-3);margin-top:3px;}
.plat-bar{height:2px;background:var(--border);border-radius:2px;margin-top:14px;}
.plat-fill{height:100%;border-radius:2px;background:var(--text);transition:width 0.5s;}
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:28px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{background:var(--surface2);padding:11px 16px;text-align:left;font-size:11px;font-weight:500;color:var(--text-3);letter-spacing:0.07em;text-transform:uppercase;border-bottom:1px solid var(--border);}
tbody td{padding:11px 16px;border-bottom:1px solid var(--border);color:var(--text);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--surface2);}
.num{text-align:right;font-variant-numeric:tabular-nums;}
.neg{color:var(--danger);}.pos{color:var(--success);}
.input-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:28px;}
.input-tabs{display:flex;gap:8px;margin-bottom:20px;}
.input-tab{font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;padding:5px 14px;border-radius:20px;border:1px solid var(--border-mid);background:transparent;color:var(--text-2);cursor:pointer;transition:all 0.15s;}
.input-tab.active{background:var(--text);color:var(--bg);border-color:var(--text);}
.input-panel{display:none;}.input-panel.active{display:block;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px;}
.form-group{display:flex;flex-direction:column;gap:5px;}
.form-label{font-size:11px;font-weight:500;color:var(--text-3);letter-spacing:0.06em;text-transform:uppercase;}
input[type=text],input[type=number],input[type=date],select{font-family:'Noto Sans KR',sans-serif;font-size:13px;padding:8px 12px;border:1px solid var(--border-mid);border-radius:8px;background:var(--bg);color:var(--text);outline:none;transition:border-color 0.15s;width:100%;}
input:focus,select:focus{border-color:var(--text);}
.btn-primary{font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:500;padding:10px 24px;border-radius:8px;border:none;background:var(--text);color:#fff;cursor:pointer;}
.btn-primary:hover{opacity:0.8;}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
.plat-select-btn{font-family:'Noto Sans KR',sans-serif;font-size:13px;padding:7px 18px;border-radius:8px;border:1px solid var(--border-mid);background:transparent;color:var(--text-2);cursor:pointer;transition:all 0.15s;}
.plat-select-btn:hover{background:var(--surface2);color:var(--text);}
.plat-select-btn.active{background:var(--text);color:#fff;border-color:var(--text);}
.upload-area{border:1.5px dashed var(--border-mid);border-radius:10px;padding:32px;text-align:center;background:var(--bg);}
.upload-btn{font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;padding:7px 18px;border-radius:8px;border:1px solid var(--border-mid);background:var(--surface);color:var(--text-2);cursor:pointer;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;font-size:13px;padding:10px 20px;border-radius:8px;transition:transform 0.3s;z-index:999;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
.loading{text-align:center;padding:40px;color:var(--text-3);font-size:13px;}
#fileInput{display:none;}



/* 모바일 메뉴 */
.mobile-header{display:none;}
.mobile-menu-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:150;}
.mobile-menu-overlay.open{display:block;}
.mobile-menu-panel{position:fixed;top:0;left:0;bottom:0;width:240px;background:#fff;z-index:200;padding:20px 16px;transform:translateX(-100%);transition:transform 0.25s;}
.mobile-menu-panel.open{transform:translateX(0);}
.mobile-menu-logo{height:40px;display:flex;align-items:center;margin-bottom:24px;}
.mobile-menu-item{display:flex;align-items:center;gap:10px;padding:12px 10px;border-radius:8px;font-size:14px;color:#6B6560;text-decoration:none;margin-bottom:4px;}
.mobile-menu-item.active{background:#F5F5F5;color:#1A1714;font-weight:500;}
.mobile-menu-item-disabled{opacity:0.4;pointer-events:none;}

@media(max-width:768px){
  .sidebar{display:none!important;}
  .plat-filters{display:none!important;}
  .view-tabs{display:none!important;}
  
  
  .page-content{margin-left:0!important;}
  .topbar{padding:0 10px!important;height:48px!important;}
  .mobile-header{display:flex!important;align-items:center;flex-shrink:0;}
  
  .topbar-title{display:none;}
  /* 모바일 전용 한 줄 필터 */
  
  
  .mobile-all-filters .plat-filter-btn,
  .mobile-all-filters .tab-btn{font-size:11px!important;padding:4px 10px!important;white-space:nowrap;flex-shrink:0;}
  /* PC 필터 숨김 */
  
  
  /* 헤더 버튼 균일 간격 */
  .plat-filters-wrap{display:flex;flex:1;gap:0!important;}
  .view-tabs-wrap{display:flex;gap:0!important;flex-shrink:0;}
  .plat-filters-wrap .plat-filter-btn,
  .view-tabs-wrap .tab-btn{
    font-size:11px!important;
    padding:4px 10px!important;
    white-space:nowrap;
  }
  main{padding:16px 12px 40px;}
  .metrics{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .metric-card{padding:14px 12px;}
  .metric-value{font-size:15px;}
  .chart-card{padding:16px 12px;margin-bottom:16px;}
  .platforms{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .plat-card{padding:12px 10px;}
  .plat-val{font-size:13px;}
  .table-card{overflow-x:auto;}
  table{font-size:12px;}
  thead th{padding:8px 8px;font-size:10px;}
  tbody td{padding:8px 8px;}
  .sec-head{margin-bottom:10px;}
  .input-card{padding:16px 12px;}
  .form-grid{grid-template-columns:1fr 1fr!important;gap:8px;}
  .cal-cell{min-height:52px;padding:4px;}
  .cal-sales{font-size:10px;}
  .cal-net{font-size:9px;}
  .wh-stock{font-size:10px;padding:2px 5px;}
  .badge{font-size:10px;padding:2px 6px;}
  .toolbar{flex-wrap:wrap;gap:6px;}
  .search-input{width:100%;}
  .modal{padding:20px 16px;margin:12px;}
  .inv-parties{grid-template-columns:1fr;gap:16px;padding:16px;}
  .inv-bank-grid{grid-template-columns:1fr;}
  .inv-terms{grid-template-columns:1fr;gap:16px;}
  .inv-signatures{grid-template-columns:1fr;gap:20px;}
  .invoice-paper{padding:28px 18px;}
  .editor-wrap{padding:12px 10px 40px;}
  .editor-toolbar{flex-wrap:wrap;gap:6px;}
  .btn{font-size:11px;padding:6px 10px;}
  .lang-btn{font-size:11px;padding:5px 8px;}
  .topbar-title{display:none;}
}
</style>
<style>
.mk-tabs{display:flex;gap:7px;overflow-x:auto;}
.mk-tabs::-webkit-scrollbar{display:none;}
.mk-tabs .tab-btn{font-size:12px;white-space:nowrap;flex-shrink:0;}
.mk-modal-overlay{display:none;position:fixed;inset:0;background:rgba(26,23,20,0.42);z-index:300;align-items:center;justify-content:center;}
.mk-modal-overlay.open{display:flex;}
.mk-modal{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:460px;margin:16px;box-shadow:0 12px 44px rgba(0,0,0,0.14);}
.mk-modal-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.mk-modal-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mk-modal-close{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--text-3);flex-shrink:0;}
.mk-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.mk-field label{font-size:11px;font-weight:500;color:var(--text-3);letter-spacing:0.04em;}
.mk-field input{font-family:inherit;font-size:13px;padding:10px 12px;border:1px solid var(--border-mid);border-radius:9px;background:#fff;color:var(--text);outline:none;width:100%;box-sizing:border-box;}
.mk-field input:focus{border-color:#2B6CB8;}
.mk-field2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.mk-modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:22px;}
.mk-btn-cancel{font-family:inherit;font-size:13px;padding:9px 20px;border-radius:9px;border:1px solid var(--border-mid);background:#fff;color:var(--text-2);cursor:pointer;}
.mk-btn-save{font-family:inherit;font-size:13px;font-weight:500;padding:9px 22px;border-radius:9px;border:none;background:#2B6CB8;color:#fff;cursor:pointer;}
.mk-btn-save:hover{background:#245a9c;}
.mk-yearbar{display:flex;align-items:center;gap:11px;margin-bottom:26px;flex-wrap:wrap;}
.mk-yearsel{font-family:inherit;font-size:14px;font-weight:500;color:var(--text);border:1px solid var(--border-mid);border-radius:8px;padding:6px 11px;background:#fff;cursor:pointer;width:auto !important;min-width:130px;}
.mk-yearbar-txt{font-size:13px;color:var(--text-3);}
.mk-upload{margin-left:auto;font-family:inherit;font-size:12px;color:#fff;background:#2B6CB8;border:1px solid #2B6CB8;border-radius:8px;padding:7px 14px;cursor:pointer;}
.mk-upload:hover{background:#245a9c;}
.mk-addyear{margin-left:8px;font-family:inherit;font-size:12px;color:#2B6CB8;background:none;border:1px solid #2B6CB8;border-radius:8px;padding:7px 14px;cursor:pointer;}
.mk-addyear:hover{background:#EAF1FA;}
.mk-summary{margin:2px 0 4px;padding-bottom:26px;border-bottom:1px solid var(--border);}
.mk-sum-label{font-size:11px;letter-spacing:0.14em;color:var(--text-3);text-transform:uppercase;}
.mk-sum-line{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;gap:12px;flex-wrap:wrap;}
.mk-sum-num{font-size:26px;font-weight:300;letter-spacing:-0.01em;color:var(--text);}
.mk-sum-num small{font-size:14px;font-weight:300;color:var(--text-3);margin-left:8px;}
.mk-sum-rate{font-size:13px;color:var(--text-2);font-weight:400;}
.mk-sum-rate.over{color:var(--danger);}
.mk-sum-track{height:2px;background:var(--surface2);margin-top:18px;border-radius:2px;overflow:hidden;}
.mk-sum-track>div{height:100%;background:#2B6CB8;}
.mk-sum-track.over>div{background:var(--danger);}
.mk-budget{font-size:11px;color:var(--text-3);margin-top:12px;display:flex;align-items:center;gap:7px;}
.mk-budget input{width:130px;text-align:right;font-size:11px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text-2);font-family:inherit;}
.mk-section-label{font-size:11px;letter-spacing:0.12em;color:var(--text-3);text-transform:uppercase;margin:34px 0 2px;}
.mk-row{display:flex;align-items:center;gap:18px;padding:17px 6px;border-top:1px solid var(--border);cursor:pointer;transition:background .12s;}
.mk-row:hover{background:var(--surface2);}
.mk-row-name{flex:1;font-size:14px;color:var(--text);min-width:120px;}
.mk-row-name .cnt{font-size:11px;color:var(--text-3);margin-left:7px;}
.mk-row-track{width:90px;height:2px;background:var(--surface2);border-radius:2px;overflow:hidden;flex-shrink:0;}
.mk-row-track>div{height:100%;background:#2B6CB8;}
.mk-row.over .mk-row-track>div{background:var(--danger);}
.mk-row-amt{text-align:right;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:150px;}
.mk-row-amt .sp{color:var(--text);}
.mk-row-amt .bd{color:var(--text-3);}
.mk-row-rate{width:44px;text-align:right;font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;flex-shrink:0;}
.mk-row.over .mk-row-rate{color:var(--danger);}
.mk-row-arrow{color:var(--text-3);font-size:12px;flex-shrink:0;}
/* inline detail (group tabs) */
.mk-detail{margin-bottom:34px;}
.mk-detail-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:11px;border-bottom:1px solid var(--border-mid);margin-bottom:4px;}
.mk-detail-name{font-size:15px;font-weight:500;}
.mk-detail-meta{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;}
.mk-detail-meta b{color:var(--text);font-weight:500;}
.mk-detail-meta .over{color:var(--danger);}
.item-tbl{width:100%;border-collapse:collapse;font-size:13px;}
.item-tbl th{color:var(--text-3);font-weight:400;text-align:left;padding:8px 8px;font-size:11px;border-bottom:1px solid var(--border);}
.item-tbl td{padding:11px 8px;border-bottom:1px solid var(--border);}
.item-tbl td.num{text-align:right;font-variant-numeric:tabular-nums;}
.item-del{background:none;border:none;color:var(--text-3);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:5px;}
.item-del:hover{background:#FBECEC;color:var(--danger);}
.item-edit{background:none;border:none;color:var(--text-3);cursor:pointer;font-size:12px;padding:2px 6px;border-radius:5px;}
.item-edit:hover{background:var(--surface2);color:var(--text);}
.add-form{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px;align-items:center;}
.add-form input{font-family:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--border-mid);border-radius:8px;background:#fff;color:var(--text);}
.add-form input.f-content{flex:1;min-width:150px;}
.add-form input.f-date{width:90px;}
.add-form input.f-amt{width:120px;text-align:right;}
.add-form input.f-note{flex:1;min-width:110px;}
.add-form button{font-family:inherit;font-size:13px;font-weight:500;padding:8px 18px;border-radius:8px;border:none;background:var(--text);color:#fff;cursor:pointer;white-space:nowrap;}
.empty-it{font-size:13px;color:var(--text-3);padding:16px 2px;text-align:center;}

}
async function save(){
  try{localStorage.setItem(LSKEY,JSON.stringify(state));}catch(e){}
  try{await sbFetch('sku_state',{method:'POST',prefer:'resolution=merge-duplicates',body:JSON.stringify({id:SB_ID,payload:state,updated_at:new Date().toISOString()})});cloudOK=true;}catch(e){cloudOK=false;}
  document.getElementById('saveNote').textContent=cloudOK?'☁ 저장됨':'⚠ 이 기기에만 저장됨';
}
function buildYear(y){
  const base=JSON.parse(JSON.stringify(DEFAULT_CATS));
  if(y&&y.cats){y.cats.forEach((sc,i)=>{if(base[i]){base[i].items=sc.items||[];if(sc.budget!=null)base[i].budget=sc.budget;if(sc.name)base[i].name=sc.name;if(sc.last!=null)base[i].last=sc.last;if(sc.ratio!=null)base[i].ratio=sc.ratio;}});}
  return {budget:(y&&y.budget!=null)?y.budget:DEFAULT_BUDGET,cats:base};
}
function mergeLoaded(p){
  if(p&&p.years){
    const years={};Object.keys(p.years).forEach(k=>{years[k]=buildYear(p.years[k]);});
    let cy=p.currentYear||Object.keys(years)[0]||2026;
    if(!years[cy])years[cy]=buildYear(null);
    state={currentYear:cy,years:years};
  } else if(p&&p.cats){
    const y=p.year||2026;
    const yr={};yr[y]=buildYear(p);
    state={currentYear:y,years:yr};
  }
}
async function load(){
  try{const r=await sbFetch('sku_state?id=eq.'+SB_ID+'&select=payload');cloudOK=true;if(r&&r[0]&&r[0].payload){mergeLoaded(r[0].payload);return;}}catch(e){cloudOK=false;}
  try{const s=localStorage.getItem(LSKEY);if(s){mergeLoaded(JSON.parse(s));return;}}catch(e){}
}

function renderTabs(){
  let h='<button class="tab-btn'+(activeTab==='summary'?' active':'')+'" onclick="switchTab(\'summary\')">요약</button>';
  GROUPS.forEach((g,gi)=>{ h+='<button class="tab-btn'+(activeTab===gi?' active':'')+'" onclick="switchTab('+gi+')">'+esc(g.title)+'</button>'; });
  document.getElementById('tabs').innerHTML=h;
}
function switchTab(t){activeTab=t;renderTabs();renderContent();}

function summaryRow(i){
  const c=cur().cats[i];const act=catActual(c);const bud=num(c.budget);
  const rate=bud>0?act/bud*100:0;const over=act>bud&&bud>0;const cnt=(c.items&&c.items.length)||0;
  return '<div class="mk-row'+(over?' over':'')+'" onclick="switchTab('+groupOf(i)+')">'+
    '<div class="mk-row-name">'+esc(c.name)+(cnt?'<span class="cnt">'+cnt+'건</span>':'')+'</div>'+
    '<div class="mk-row-track"><div style="width:'+Math.min(100,rate)+'%"></div></div>'+
    '<div class="mk-row-amt"><span class="sp">'+(act?manwon(act):'0')+'</span> <span class="bd">/ '+manwon(bud)+'</span></div>'+
    '<div class="mk-row-rate">'+rate.toFixed(0)+'%</div><div class="mk-row-arrow">›</div></div>';
}
function groupOf(i){for(let g=0;g<GROUPS.length;g++)if(GROUPS[g].idx.includes(i))return g;return 0;}
function renderSummaryView(){
  const actual=cur().cats.reduce((s,c)=>s+catActual(c),0);
  const rate=cur().budget>0?actual/cur().budget*100:0;const over=rate>100;
  let h='<div class="mk-summary">'+
    ''+
    '<div class="mk-sum-line"><div class="mk-sum-num">'+manwon(actual)+'원<small>/ 예산 '+manwon(cur().budget)+'원</small></div>'+
    '<div class="mk-sum-rate'+(over?' over':'')+'">집행률 '+rate.toFixed(1)+'%'+(over?'':'  ·  잔여 '+manwon(cur().budget-actual)+'원')+'</div></div>'+
    '<div class="mk-sum-track'+(over?' over':'')+'"><div style="width:'+Math.min(100,rate)+'%"></div></div>'+
    '<div class="mk-budget">26년 예산 수정 <input type="number" id="budgetInput" step="1000000" value="'+cur().budget+'" onchange="setBudget()">원</div></div>';
  GROUPS.forEach(g=>{ h+='<div class="mk-section-label">'+esc(g.title)+'</div>'+g.idx.map(summaryRow).join(''); });
  document.getElementById('content').innerHTML=h;
}

function detailBlock(ci){
  const c=cur().cats[ci];const act=catActual(c);const bud=num(c.budget);const rate=bud>0?act/bud*100:0;const over=act>bud&&bud>0;
  const items=c.items||[];
  const rows = items.length ? items.map((it,j)=>'<tr>'+
    '<td>'+esc(it.content)+'</td><td style="color:var(--text-3)">'+esc(it.date||'')+'</td>'+
    '<td class="num">'+won(num(it.amount))+'</td><td style="color:var(--text-3)">'+esc(it.note||'')+'</td>'+
    '<td style="text-align:right;white-space:nowrap;"><button class="item-edit" onclick="editItemAt('+ci+','+j+')" title="수정">&#9998;</button><button class="item-del" onclick="deleteItemAt('+ci+','+j+')" title="삭제">&times;</button></td>'+
    '</tr>').join('') : '<tr><td colspan="5" class="empty-it">아직 등록된 비용이 없어요. 아래에서 추가해주세요.</td></tr>';
  return '<div class="mk-detail">'+
    '<div class="mk-detail-head"><div class="mk-detail-name">'+esc(c.name)+'</div>'+
    '<div class="mk-detail-meta">실제 <b>'+won(act)+'</b> · 예산 '+won(bud)+' · <span class="'+(over?'over':'')+'">집행률 '+rate.toFixed(0)+'%</span></div></div>'+
    '<div class="mk-detail-bud">예산 수정 <input type="number" step="100000" value="'+bud+'" onchange="setCatBudget('+ci+',this.value)">원</div>'+
    '<table class="item-tbl"><thead><tr><th>내용</th><th>날짜</th><th style="text-align:right;">금액</th><th>비고</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="add-form">'+
      '<input class="f-content" id="gf-content-'+ci+'" type="text" placeholder="내용 (예: 1차 룩북 촬영)">'+
      '<input class="f-date" id="gf-date-'+ci+'" type="text" placeholder="날짜">'+
      '<input class="f-amt" id="gf-amt-'+ci+'" type="number" placeholder="금액">'+
      '<input class="f-note" id="gf-note-'+ci+'" type="text" placeholder="비고(선택)">'+
      '<button onclick="addItemInline('+ci+')">추가</button>'+
    '</div></div>';
}
function renderGroupView(g){
  const gAct=GROUPS[g].idx.reduce((s,i)=>s+catActual(cur().cats[i]),0);
  const gBud=GROUPS[g].idx.reduce((s,i)=>s+num(cur().cats[i].budget),0);
  const rate=gBud>0?gAct/gBud*100:0;
  let h='<div class="mk-summary"><div class="mk-sum-label">'+esc(GROUPS[g].title)+'</div>'+
    '<div class="mk-sum-line"><div class="mk-sum-num">'+manwon(gAct)+'원<small>/ 예산 '+manwon(gBud)+'원</small></div>'+
    '<div class="mk-sum-rate'+(rate>100?' over':'')+'">집행률 '+rate.toFixed(1)+'%</div></div>'+
    '<div class="mk-sum-track'+(rate>100?' over':'')+'"><div style="width:'+Math.min(100,rate)+'%"></div></div></div>'+
    '<div style="margin-top:24px;">'+GROUPS[g].idx.map(detailBlock).join('')+'</div>';
  document.getElementById('content').innerHTML=h;
}
function renderContent(){ if(activeTab==='summary')renderSummaryView(); else renderGroupView(activeTab); }
function renderYearBar(){
  const years=Object.keys(state.years).sort();
  const opts=years.map(y=>'<option value="'+y+'"'+(String(y)===String(state.currentYear)?' selected':'')+'>'+y+'년</option>').join('');
  document.getElementById('yearBar').innerHTML='<div class="mk-yearbar"><select class="mk-yearsel" id="yearSel" onchange="switchYear(this.value)">'+opts+'</select><span class="mk-yearbar-txt">마케팅 집행</span><button class="mk-upload" onclick="mkUploadClick()">엑셀 업로드</button><button class="mk-addyear" onclick="addYear()">+ 연도 추가</button></div>';
}
function switchYear(v){state.currentYear=v;save();renderAll();}
function addYear(){
  const next=Math.max(...Object.keys(state.years).map(Number))+1;
  const v=prompt('추가할 연도를 입력하세요:',next);if(v==null)return;
  const y=parseInt(v,10);if(!y){toast('숫자 연도를 입력해주세요.');return;}
  if(state.years[y]){toast('이미 있는 연도예요.');state.currentYear=y;save();renderAll();return;}
  state.years[y]={budget:DEFAULT_BUDGET,cats:JSON.parse(JSON.stringify(DEFAULT_CATS))};
  state.currentYear=y;save();renderAll();toast(y+'년이 추가됐어요.');
}
function renderAll(){renderYearBar();renderTabs();renderContent();}
function numCell(v){if(typeof v==='number')return v;const n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0;}
function parseMarketingExcel(wb){
  const sumName=wb.SheetNames.find(n=>n.replace(/\s/g,'').indexOf('총마케팅비용')>=0)||wb.SheetNames[0];
  const sum=XLSX.utils.sheet_to_json(wb.Sheets[sumName],{header:1,raw:true});
  let year=2026;
  outer: for(const row of sum){for(const cell of row){const m=String(cell==null?'':cell).match(/20\d{2}/);if(m){year=parseInt(m[0],10);break outer;}}}
  let budget=DEFAULT_BUDGET;
  for(const row of sum){const j=row.findIndex(c=>String(c==null?'':c).indexOf('예산')>=0);if(j>=0){let found=0;for(let k=j+1;k<row.length;k++){const n=numCell(row[k]);if(n>1000000){found=n;break;}}if(found){budget=found;break;}}}
  let hi=sum.findIndex(r=>r.some(c=>String(c==null?'':c).indexOf('프로모션')>=0));
  if(hi<0)hi=3;
  const cats=JSON.parse(JSON.stringify(DEFAULT_CATS));
  let ci=0;
  for(let i=hi+1;i<sum.length&&ci<cats.length;i++){
    const r=sum[i]||[];const name=String(r[1]==null?'':r[1]).trim();
    if(!name)continue;
    if(name.indexOf('합계')>=0||name.indexOf('총 ')>=0)break;
    cats[ci].name=name;
    cats[ci].last=numCell(r[2]);
    cats[ci].ratio=numCell(r[3])||0;
    const bud=numCell(r[4]);if(bud)cats[ci].budget=bud;
    cats[ci].items=[];
    ci++;
  }
  wb.SheetNames.forEach(sn=>{
    const m=sn.match(/^\s*(\d+)\s*\./);if(!m)return;
    const idx=parseInt(m[1],10)-1;if(idx<0||idx>=cats.length)return;
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true});
    let total=0;
    for(const r of rows){const arr=r||[];const j=arr.findIndex(c=>String(c==null?'':c).replace(/\s/g,'').indexOf('총비용')>=0);if(j>=0){for(let k=j+1;k<arr.length;k++){const n=numCell(arr[k]);if(n>0){total=n;break;}}if(total)break;}}
    if(total>0)cats[idx].items=[{content:'엑셀 집행 합계',date:'',amount:total,note:'엑셀에서 불러옴'}];
  });
  return {year:String(year),budget:budget,cats:cats};
}
window.mkUploadClick=function(){document.getElementById('mkFile').click();};
function handleMkFile(e){
  const f=e.target.files[0];e.target.value='';if(!f)return;
  if(typeof XLSX==='undefined'){toast('엑셀 모듈 로딩 중이에요. 잠시 후 다시 시도해주세요.');return;}
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
      const data=parseMarketingExcel(wb);
      state.years[data.year]={budget:data.budget,cats:data.cats};
      state.currentYear=data.year;
      save();renderAll();
      toast(data.year+'년 마케팅 비용을 불러왔어요!');
    }catch(err){console.error(err);toast('엑셀을 읽지 못했어요. 양식을 확인해주세요.');}
  };
  reader.readAsArrayBuffer(f);
}

function setBudget(){cur().budget=num(val('budgetInput'));save();renderContent();}
function setCatBudget(ci,v){cur().cats[ci].budget=num(v);save();renderContent();}
function addItemInline(ci){
  const content=val('gf-content-'+ci).trim();const amt=num(val('gf-amt-'+ci));
  if(!content){toast('내용을 입력해주세요.');return;}
  if(!amt){toast('금액을 입력해주세요.');return;}
  cur().cats[ci].items.push({content,date:val('gf-date-'+ci).trim(),amount:amt,note:val('gf-note-'+ci).trim()});
  save();renderContent();const f=document.getElementById('gf-content-'+ci);if(f)f.focus();
}
let mkEditRef={ci:null,j:null};
function editItemAt(ci,j){
  const it=cur().cats[ci].items[j];
  mkEditRef={ci:ci,j:j};
  document.getElementById('mkfContent').value=it.content||'';
  document.getElementById('mkfDate').value=it.date||'';
  document.getElementById('mkfAmount').value=(it.amount!=null?it.amount:'');
  document.getElementById('mkfNote').value=it.note||'';
  document.getElementById('mkEditTitle').textContent='항목 수정 · '+(cur().cats[ci].name||'');
  document.getElementById('mkEditModal').classList.add('open');
}
function closeEditModal(){document.getElementById('mkEditModal').classList.remove('open');mkEditRef={ci:null,j:null};}
function saveEditModal(){
  if(mkEditRef.ci==null)return;
  const it=cur().cats[mkEditRef.ci].items[mkEditRef.j];
  if(!it){closeEditModal();return;}
  it.content=(document.getElementById('mkfContent').value.trim())||it.content;
  it.date=document.getElementById('mkfDate').value.trim();
  it.amount=num(document.getElementById('mkfAmount').value);
  it.note=document.getElementById('mkfNote').value.trim();
  save();renderContent();closeEditModal();
}
function deleteItemAt(ci,j){if(!confirm('이 항목을 삭제할까요?'))return;cur().cats[ci].items.splice(j,1);save();renderContent();}

function openMobileMenu(){document.getElementById('mmOverlay').classList.add('open');document.getElementById('mmPanel').classList.add('open');}
function closeMobileMenu(){document.getElementById('mmOverlay').classList.remove('open');document.getElementById('mmPanel').classList.remove('open');}

(async()=>{document.getElementById('saveNote').textContent='불러오는 중...';await load();renderAll();var _mf=document.getElementById('mkFile');if(_mf)_mf.addEventListener('change',handleMkFile);var _mo=document.getElementById('mkEditModal');if(_mo)_mo.addEventListener('click',function(e){if(e.target===_mo)closeEditModal();});document.getElementById('saveNote').textContent=cloudOK?'☁ 저장됨':'⚠ 오프라인';})();
</script>
